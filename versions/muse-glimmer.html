<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock · Muse Glimmer</title>
<meta name="description" content="Sixty-two watch and clock faces rendered as live SVG world clocks. From-scratch entry by Muse Glimmer.">
<style>
  :root{--bg:#0b0c10;--panel:#14161c;--line:#2a2f3a;--ink:#e8e9ed;--muted:#8a93a6;--accent:#7dd3fc}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
  h1{font-size:18px;margin:0}main{padding:20px;max-width:1200px;margin:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .face{aspect-ratio:1/1;background:#0f1117;border-radius:8px;display:grid;place-items:center}
  .face svg{width:80%;height:80%}
  .meta{margin-top:8px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink)}
</style>
</head>
<body>
<header><h1>World Clock · Muse Glimmer</h1><span style="color:var(--muted);font-size:13px">62 faces · from-scratch</span></header>
<main>
<div class="grid" id="grid"></div>
</main>

Object.entries(FACES).forEach(([k,v])=>{
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="face"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#7dd3fc" stroke-width="2"/><circle cx="50" cy="50" r="3" fill="#7dd3fc"/></svg></div><div class="meta"><b>${k}</b><br>${v.name}</div>`;

</body>
</html>
