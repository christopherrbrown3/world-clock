<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock - Codex 5.6 Sol</title>
<meta name="description" content="A standalone world clock with 62 live watch and clock faces drawn as inline SVG.">
<meta name="theme-color" content="#f2efe7">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2315191b'/%3E%3Ccircle cx='50' cy='50' r='31' fill='none' stroke='%23f6b941' stroke-width='5'/%3E%3Cpath d='M50 16v-9M50 93v-9M16 50H7M93 50h-9M26 26l-7-7M81 81l-7-7M74 26l7-7M19 81l7-7' stroke='%23f6b941' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M50 50V30M50 50l15 9' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='4' fill='%23d65d49'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --paper: #f2efe7;
  --paper-2: #e7e3da;
  --surface: #fcfbf7;
  --ink: #15191b;
  --muted: #65706f;
  --line: #cec9bf;
  --line-dark: #a8aaa4;
  --solar: #f6b941;
  --coral: #d65d49;
  --cyan: #2c9298;
  --night: #17313a;
  --focus: #0a6670;
  --shadow: rgba(30, 35, 36, 0.13);
  --sans: "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-width: 280px;
  min-height: 100vh;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

button,
input { font: inherit; }

button { color: inherit; }

.appbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: grid;
  grid-template-columns: auto minmax(220px, 1fr) auto;
  align-items: center;
  gap: 20px;
  min-height: 72px;
  padding: 12px max(18px, calc((100vw - 1480px) / 2));
  background: rgba(242, 239, 231, 0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.sunmark {
  position: relative;
  width: 42px;
  height: 42px;
  flex: none;
}

.sunmark::before,
.sunmark::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 2px solid var(--ink);
  border-radius: 50%;
}

.sunmark::after {
  inset: 12px;
  border: 0;
  background: var(--solar);
}

.brandcopy { min-width: 0; }

.brand h1 {
  margin: 0;
  font-family: var(--display);
  font-size: 1.38rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0;
}

.model {
  margin: 4px 0 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.66rem;
  line-height: 1;
  letter-spacing: 0;
  text-transform: uppercase;
}

.add-form {
  position: relative;
  width: min(560px, 100%);
  justify-self: center;
}

.search-shell {
  position: relative;
  display: flex;
  align-items: center;
}

.search-shell > svg {
  position: absolute;
  left: 13px;
  width: 18px;
  height: 18px;
  pointer-events: none;
  color: var(--muted);
}

#city-search {
  width: 100%;
  height: 46px;
  padding: 0 42px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-dark);
  border-radius: 5px;
  outline: 0;
}

#city-search::placeholder { color: #737c7a; }

#city-search:focus {
  border-color: var(--focus);
  box-shadow: 0 0 0 3px rgba(10, 102, 112, 0.14);
}

.search-results {
  position: absolute;
  z-index: 50;
  top: calc(100% + 7px);
  right: 0;
  left: 0;
  max-height: min(390px, 58vh);
  margin: 0;
  padding: 5px;
  overflow-y: auto;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--line-dark);
  border-radius: 5px;
  box-shadow: 0 18px 44px var(--shadow);
}

.search-results[hidden] { display: none; }

.search-option {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 14px;
  padding: 10px 11px;
  border-radius: 3px;
  cursor: pointer;
}

.search-option:hover,
.search-option[aria-selected="true"] {
  color: #fff;
  background: var(--night);
}

.option-city { font-size: 0.9rem; font-weight: 650; }
.option-country { color: var(--muted); font-size: 0.72rem; }
.option-offset {
  grid-row: 1 / span 2;
  grid-column: 2;
  align-self: center;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.68rem;
}

.search-option:hover .option-country,
.search-option:hover .option-offset,
.search-option[aria-selected="true"] .option-country,
.search-option[aria-selected="true"] .option-offset { color: #c8d7d8; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.action,
.icon-action {
  display: inline-grid;
  place-items: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--line-dark);
  border-radius: 5px;
}

.action {
  grid-auto-flow: column;
  gap: 8px;
  padding: 0 14px;
  font-size: 0.78rem;
  font-weight: 700;
}

.action svg,
.icon-action svg { width: 18px; height: 18px; }

.action:hover,
.icon-action:hover {
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
}

.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  width: min(1480px, 100%);
  min-height: 48px;
  margin: 0 auto;
  padding: 0 18px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 0.7rem;
}

.statusbar p { margin: 0; }

.solar-track {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 180px;
  color: var(--ink);
}

.solar-track::before {
  content: "";
  width: 44px;
  height: 6px;
  flex: none;
  background:
    linear-gradient(90deg, var(--night) 0 22%, var(--coral) 22% 35%, var(--solar) 35% 72%, var(--cyan) 72% 84%, var(--night) 84%);
  border-radius: 1px;
}

.clock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  gap: 16px;
  width: min(1480px, 100%);
  margin: 0 auto;
  padding: 18px 18px 72px;
}

.clock-card {
  --phase-color: var(--solar);
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0;
  min-height: 390px;
  padding: 14px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 10px 30px rgba(44, 47, 45, 0.06);
}

.clock-card[data-phase="night"] { --phase-color: #496e78; }
.clock-card[data-phase="dawn"] { --phase-color: var(--coral); }
.clock-card[data-phase="day"] { --phase-color: var(--solar); }
.clock-card[data-phase="dusk"] { --phase-color: var(--cyan); }

.clock-card::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 4px;
  background: var(--phase-color);
}

.card-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  padding-top: 4px;
}

.place { min-width: 0; }

.place h2 {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--display);
  font-size: 1.18rem;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0;
}

.place p,
.card-time p { margin: 4px 0 0; }

.country,
.offset {
  color: var(--muted);
  font-size: 0.67rem;
  line-height: 1.2;
}

.card-time { text-align: right; }

.digital-time {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.offset {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.watch-stage {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 1;
  margin: 8px 0 7px;
  overflow: hidden;
}

.watch-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.card-foot {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 8px;
  min-height: 54px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.face-name {
  margin: 0;
  color: #303739;
  font-size: 0.72rem;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.local-date {
  margin: 3px 0 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.64rem;
  line-height: 1.25;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.card-actions .icon-action {
  border-color: transparent;
}

.card-actions .icon-action:hover { border-color: var(--ink); }

.empty {
  grid-column: 1 / -1;
  min-height: 260px;
  display: grid;
  place-items: center;
  color: var(--muted);
  border: 1px dashed var(--line-dark);
  font-family: var(--mono);
  font-size: 0.8rem;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 3px solid rgba(10, 102, 112, 0.35);
  outline-offset: 2px;
}

@media (max-width: 820px) {
  .appbar {
    position: relative;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    padding: 12px 16px;
  }

  .add-form {
    grid-row: 2;
    grid-column: 1 / -1;
    width: 100%;
  }

  .action span { display: none; }
  .action { padding: 0; }
}

@media (max-width: 520px) {
  .clock-grid {
    grid-template-columns: minmax(0, 1fr);
    padding: 12px 12px 56px;
  }

  .statusbar { padding: 0 12px; }
  .status-zone { display: none; }
  .brand h1 { font-size: 1.22rem; }
  .clock-card { min-height: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <span class="sunmark" aria-hidden="true"></span>
    <div class="brandcopy">
      <h1>World Clock</h1>
      <p class="model">Codex 5.6 Sol</p>
    </div>
  </div>

  <form class="add-form" id="add-form" role="search" autocomplete="off">
    <label class="sr-only" for="city-search">Add a city</label>
    <div class="search-shell">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="m20 20-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="city-search" type="search" placeholder="Add city" role="combobox"
        aria-autocomplete="list" aria-expanded="false" aria-controls="city-results">
    </div>
    <ul class="search-results" id="city-results" role="listbox" aria-label="City matches" hidden></ul>
  </form>

  <div class="toolbar">
    <button class="action" id="shuffle-all" type="button" title="Shuffle all faces">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Shuffle</span>
    </button>
  </div>
</header>

<div class="statusbar">
  <p class="solar-track"><span id="summary">7 cities / 62 faces</span></p>
  <p class="status-zone" id="home-zone"></p>
</div>

<main class="clock-grid" id="clock-grid"></main>
<p class="sr-only" id="live-region" role="status" aria-live="polite"></p>

<script>
"use strict";
(() => {
  const NS = "http://www.w3.org/2000/svg";

  const H = {
    n(value) {
      const rounded = Math.round(value * 1000) / 1000;
      return Object.is(rounded, -0) ? 0 : rounded;
    },

    esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    },

    point(angle, radius, cx = 50, cy = 50) {
      const rad = angle * Math.PI / 180;
      return [
        this.n(cx + Math.sin(rad) * radius),
        this.n(cy - Math.cos(rad) * radius)
      ];
    },

    polar(angle, radius, cx = 50, cy = 50) {
      return this.point(angle, radius, cx, cy).join(",");
    },

    ticks({
      count = 60, outer = 40, inner = 38, majorEvery = 5,
      majorInner = 35.5, width = 0.45, majorWidth = 1.1,
      color = "#111", cx = 50, cy = 50, start = 0, skip = () => false
    } = {}) {
      let out = "";
      for (let i = 0; i < count; i += 1) {
        if (skip(i)) continue;
        const angle = start + i * 360 / count;
        const major = majorEvery > 0 && i % majorEvery === 0;
        const a = this.point(angle, outer, cx, cy);
        const b = this.point(angle, major ? majorInner : inner, cx, cy);
        out += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ` +
          `stroke="${color}" stroke-width="${major ? majorWidth : width}" stroke-linecap="round"/>`;
      }
      return out;
    },

    numerals({
      labels, radius = 32, size = 7, color = "#111", family = "Arial, sans-serif",
      weight = 600, cx = 50, cy = 50, rotate = false, start = 0, dy = 0,
      skip = () => false
    }) {
      let out = "";
      labels.forEach((label, index) => {
        if (label === "" || label == null || skip(index)) return;
        const angle = start + index * 360 / labels.length;
        const [x, y] = this.point(angle, radius, cx, cy);
        const transform = rotate ? ` transform="rotate(${angle} ${x} ${y})"` : "";
        out += `<text x="${x}" y="${this.n(y + dy)}" text-anchor="middle" ` +
          `dominant-baseline="middle" font-family="${family}" font-size="${size}" ` +
          `font-weight="${weight}" fill="${color}"${transform}>${this.esc(label)}</text>`;
      });
      return out;
    },

    text(x, y, value, {
      size = 4, color = "#111", family = "Arial, sans-serif", weight = 500,
      anchor = "middle", spacing = 0, transform = "", opacity = 1, extra = ""
    } = {}) {
      return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" ` +
        `font-family="${family}" font-size="${size}" font-weight="${weight}" fill="${color}" ` +
        `letter-spacing="${spacing}" opacity="${opacity}"${transform ? ` transform="${transform}"` : ""} ` +
        `${extra}>${this.esc(value)}</text>`;
    },

    arc(cx, cy, radius, from, to) {
      const p1 = this.point(from, radius, cx, cy);
      const p2 = this.point(to, radius, cx, cy);
      const span = ((to - from) % 360 + 360) % 360;
      return `M${p1[0]} ${p1[1]} A${radius} ${radius} 0 ${span > 180 ? 1 : 0} 1 ${p2[0]} ${p2[1]}`;
    },

    sector(cx, cy, radius, from, to) {
      const p1 = this.point(from, radius, cx, cy);
      const p2 = this.point(to, radius, cx, cy);
      const span = ((to - from) % 360 + 360) % 360;
      return `M${cx} ${cy} L${p1[0]} ${p1[1]} A${radius} ${radius} 0 ${span > 180 ? 1 : 0} 1 ${p2[0]} ${p2[1]} Z`;
    },

    defs(id, { steel = true, gold = false, dial = "#111" } = {}) {
      return `<defs>
        ${steel ? `<linearGradient id="${id}-steel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#626a70"/><stop offset=".18" stop-color="#f8fbfc"/>
          <stop offset=".43" stop-color="#929ba1"/><stop offset=".7" stop-color="#f3f5f4"/>
          <stop offset="1" stop-color="#555e64"/>
        </linearGradient>` : ""}
        ${gold ? `<linearGradient id="${id}-gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7f451c"/><stop offset=".22" stop-color="#f6d79a"/>
          <stop offset=".52" stop-color="#b86c32"/><stop offset=".77" stop-color="#ffe3a9"/>
          <stop offset="1" stop-color="#7a3f1e"/>
        </linearGradient>` : ""}
        <radialGradient id="${id}-dial" cx=".36" cy=".28" r=".72">
          <stop offset="0" stop-color="${dial}"/><stop offset=".72" stop-color="${dial}"/>
          <stop offset="1" stop-color="#050708"/>
        </radialGradient>
        <radialGradient id="${id}-glass" cx=".28" cy=".18" r=".85">
          <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
          <stop offset=".42" stop-color="#fff" stop-opacity=".02"/>
          <stop offset="1" stop-color="#2b4952" stop-opacity=".08"/>
        </radialGradient>
        <filter id="${id}-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="1.7" flood-color="#000" flood-opacity=".28"/>
        </filter>
      </defs>`;
    },

    roundCase(id, {
      strap = "#17191a", caseFill = null, bezel = "#c5cbce", dial = "#101314",
      dialRadius = 36, bezelRadius = 43, crown = true, bracelet = false, gold = false
    } = {}) {
      const metal = caseFill || `url(#${id}-${gold ? "gold" : "steel"})`;
      let body = "";
      if (bracelet) {
        for (let y = -8; y < 20; y += 7) {
          body += `<rect x="35" y="${y}" width="30" height="6.4" rx="1.2" fill="${metal}" stroke="#545c61" stroke-width=".35"/>`;
        }
        for (let y = 81; y < 108; y += 7) {
          body += `<rect x="35" y="${y}" width="30" height="6.4" rx="1.2" fill="${metal}" stroke="#545c61" stroke-width=".35"/>`;
        }
      } else {
        body += `<path d="M36 -5 H64 L67 22 H33 Z M33 78 H67 L64 105 H36 Z" fill="${strap}"/>`;
        body += `<path d="M39 -5H42V19H39ZM58 -5H61V19H58ZM39 81H42V105H39ZM58 81H61V105H58Z" fill="#fff" opacity=".09"/>`;
      }
      body += `<path d="M29 16 Q50 6 71 16 L82 28 Q91 50 82 72 L71 84 Q50 94 29 84 L18 72 Q9 50 18 28 Z" fill="${metal}" stroke="#50585d" stroke-width=".75"/>`;
      if (crown) {
        body += `<rect x="90.5" y="43.5" width="5.5" height="13" rx="2.2" fill="${metal}" stroke="#535b60" stroke-width=".7"/>`;
        body += Array.from({ length: 5 }, (_, i) =>
          `<line x1="${92 + i}" y1="45" x2="${92 + i}" y2="55" stroke="#626a6f" stroke-width=".3"/>`
        ).join("");
      }
      body += `<circle cx="50" cy="50" r="${bezelRadius}" fill="${bezel}" stroke="#4f565a" stroke-width=".65"/>`;
      body += `<circle cx="50" cy="50" r="${dialRadius + 1.7}" fill="#70787d"/>`;
      body += `<circle cx="50" cy="50" r="${dialRadius}" fill="url(#${id}-dial)"/>`;
      return body;
    },

    batonHands({
      hour = 21, minute = 29, second = 32, lume = "#e9f3df",
      metal = "#d8dde0", outline = "#4c5357", seconds = "#df493d",
      centerX = 50, centerY = 50, secondHand = true, broad = false
    } = {}) {
      const hw = broad ? 2.8 : 2.1;
      const mw = broad ? 2.3 : 1.65;
      return `<g data-hand="hour" data-cx="${centerX}" data-cy="${centerY}" filter="none">
          <path d="M${centerX - hw} ${centerY + 5} L${centerX - hw * .72} ${centerY - hour + 4}
            L${centerX} ${centerY - hour} L${centerX + hw * .72} ${centerY - hour + 4}
            L${centerX + hw} ${centerY + 5} Z" fill="${metal}" stroke="${outline}" stroke-width=".45"/>
          <path d="M${centerX - hw * .45} ${centerY - 3} L${centerX - hw * .32} ${centerY - hour + 5}
            L${centerX} ${centerY - hour + 2} L${centerX + hw * .32} ${centerY - hour + 5}
            L${centerX + hw * .45} ${centerY - 3} Z" fill="${lume}"/>
        </g>
        <g data-hand="minute" data-cx="${centerX}" data-cy="${centerY}" filter="none">
          <path d="M${centerX - mw} ${centerY + 6} L${centerX - mw * .65} ${centerY - minute + 3}
            L${centerX} ${centerY - minute} L${centerX + mw * .65} ${centerY - minute + 3}
            L${centerX + mw} ${centerY + 6} Z" fill="${metal}" stroke="${outline}" stroke-width=".4"/>
          <path d="M${centerX - mw * .4} ${centerY - 4} L${centerX - mw * .3} ${centerY - minute + 4}
            L${centerX} ${centerY - minute + 2} L${centerX + mw * .3} ${centerY - minute + 4}
            L${centerX + mw * .4} ${centerY - 4} Z" fill="${lume}"/>
        </g>
        ${secondHand ? `<g data-hand="second" data-cx="${centerX}" data-cy="${centerY}">

  const CLOCK = (() => {
    const formatters = new Map();
    const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN",
      "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    function formatter(zone) {
      if (!formatters.has(zone)) {
        formatters.set(zone, new Intl.DateTimeFormat("en-US", {
          timeZone: zone,
          hourCycle: "h23",
          year: "numeric",
          month: "numeric",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }));
      }
      return formatters.get(zone);
    }

    function wall(zone, date) {
      const result = {};
      formatter(zone).formatToParts(date).forEach((part) => {
        if (part.type !== "literal") result[part.type] = part.value;
      });
      const weekday = WEEKDAYS.indexOf(String(result.weekday).toUpperCase());
      return {
        year: Number(result.year),
        month: Number(result.month) - 1,
        date: Number(result.day),
        weekday: weekday < 0 ? 0 : weekday,
        hour: Number(result.hour) % 24,
        minute: Number(result.minute),
        second: Number(result.second),
        ms: date.getMilliseconds()
      };
    }

    function offset(zone, date) {
      const value = wall(zone, date);
      const wallAsUtc = Date.UTC(value.year, value.month, value.date,
        value.hour, value.minute, value.second);
      const instant = date.getTime() - date.getMilliseconds();
      return Math.round((wallAsUtc - instant) / 60000);
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function offsetLabel(minutes) {
      const sign = minutes < 0 ? "-" : "+";
      const absolute = Math.abs(minutes);
      return `UTC${sign}${pad(Math.floor(absolute / 60))}:${pad(absolute % 60)}`;
    }

    function snapshot(zone, date, cadence) {
      const value = wall(zone, date);
      const rawSecond = value.second + value.ms / 1000;
      let second = value.second;
      if (cadence === "sweep") second = Math.floor(rawSecond * 8) / 8;
      if (cadence === "glide") second = rawSecond;
      if (cadence === "mondaine") second = rawSecond >= 58 ? 60 : rawSecond * 60 / 58;
      const days = (date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
      const moon = ((days / 29.530588853) % 1 + 1) % 1;
      return {
        ...value,
        second,
        hourAngle: ((value.hour % 12) + value.minute / 60 + value.second / 3600) * 30,
        minuteAngle: (value.minute + value.second / 60) * 6,
        secondAngle: second * 6,
        gmtAngle: (value.hour + value.minute / 60) * 15,
        moon,
        night: value.hour < 6 || value.hour >= 20
      };
    }

    function channel(name, value) {
      const h12 = value.hour % 12 || 12;
      const daysInMonth = new Date(Date.UTC(value.year, value.month + 1, 0)).getUTCDate();
      switch (name) {
        case "date": return String(value.date);
        case "date2": return pad(value.date);
        case "date-tens": return String(Math.floor(value.date / 10));
        case "date-ones": return String(value.date % 10);
        case "day": return WEEKDAYS[value.weekday];
        case "day-date": return `${WEEKDAYS[value.weekday].slice(0, 2)} ${value.date}`;
        case "month": return MONTHS[value.month];
        case "month-number": return String(value.month + 1);
        case "month-date": return `${value.month + 1}-${value.date}`;
        case "year": return String(value.year);
        case "hour12": return String(h12);
        case "hour24": return pad(value.hour);
        case "minute": return pad(value.minute);
        case "second": return pad(Math.floor(value.second) % 60);
        case "ampm": return value.hour < 12 ? "AM" : "PM";
        case "digital12": return `${h12}:${pad(value.minute)}`;
        case "digital24": return `${pad(value.hour)}:${pad(value.minute)}`;
        case "digital-seconds": return `${pad(value.hour)}:${pad(value.minute)}:${pad(Math.floor(value.second) % 60)}`;
        case "days-in-month": return String(daysInMonth);
        default: return "";
      }
    }

    return { wall, offset, offsetLabel, snapshot, channel, pad, WEEKDAYS, MONTHS };
  })();

  function shuffle(values) {
    const result = values.slice();
    for (let index = result.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
    }
    return result;
  }

  function usedFaces(except = null) {
    return new Set(state.cities
      .filter((entry) => entry !== except)
      .map((entry) => entry.face)
      .filter(Boolean));
  }

  function chooseFace(except = null, avoid = null) {
    const used = usedFaces(except);
    let choices = FACE_KEYS.filter((key) => !used.has(key) && key !== avoid);
    if (!choices.length) choices = FACE_KEYS.filter((key) => key !== avoid);
    if (!choices.length) choices = FACE_KEYS.slice();
    return choices[Math.floor(Math.random() * choices.length)];
  }

  function assignAllFaces() {
    const available = shuffle(FACE_KEYS);
    state.cities.forEach((entry, index) => {
      entry.face = available[index % available.length];
    });
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        cities: state.cities.map(({ cityId, face }) => ({ cityId, face }))
      }));
    } catch (error) {
      // Storage can be disabled for file URLs. The app remains fully usable.
    }
  }

  function load() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (value && Array.isArray(value.cities)) {
        const seen = new Set();
        state.cities = value.cities.flatMap((entry) => {
          if (!entry || !CITY_BY_ID.has(entry.cityId) || seen.has(entry.cityId)) return [];
          seen.add(entry.cityId);
          return [{
            cityId: entry.cityId,
            face: FACES[entry.face] ? entry.face : null
          }];
        });
      }
    } catch (error) {
      state.cities = [];
    }

    if (!state.cities.length) {
      state.cities = DEFAULT_CITY_IDS.map((cityId) => ({ cityId, face: null }));
      assignAllFaces();
    } else {
      state.cities.forEach((entry) => {
        if (!entry.face) entry.face = chooseFace(entry);
      });
    }
  }

    return state.cities.map((entry) => {
      const city = CITY_BY_ID.get(entry.cityId);
      return { entry, city, offset: CLOCK.offset(city.zone, date) };
    }).sort((a, b) =>

        <div class="card-actions">
          <button class="icon-action" type="button" data-action="shuffle"
            title="Shuffle face" aria-label="Shuffle the face for ${cityName}">${icon("shuffle")}</button>
          <button class="icon-action" type="button" data-action="remove"
            title="Remove city" aria-label="Remove ${cityName}">${icon("remove")}</button>
        </div>
      </footer>
    </article>`;
  }

  const DOM = {
    grid: document.getElementById("clock-grid"),
    form: document.getElementById("add-form"),
    input: document.getElementById("city-search"),
    results: document.getElementById("city-results"),
    shuffle: document.getElementById("shuffle-all"),
    summary: document.getElementById("summary"),
    home: document.getElementById("home-zone"),
    live: document.getElementById("live-region")
  };

  const instances = new Map();
  let rows = [];

  function namespaceSvg(markup, prefix) {
    return markup
      .replace(/(^|\s)id="([^"]+)"/g,
        (all, leading, id) => `${leading}id="${prefix}-${id}"`)
      .replace(/url\(#([^)]+)\)/g, (all, id) => `url(#${prefix}-${id})`)
      .replace(/\bhref="#([^"]+)"/g, (all, id) => `href="#${prefix}-${id}"`);
  }

  function mountFace(svg, key, cityId) {
    const face = FACES[key];
    const drawing = face.draw(`${key}-${cityId.replace(/[^a-z0-9]/gi, "")}`);
    svg.setAttribute("viewBox", drawing.viewBox || "0 0 100 100");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.innerHTML = namespaceSvg(drawing.svg, `face-${cityId}-${key}`);
    return {
      face,
      svg,
      hands: [...svg.querySelectorAll("[data-hand]")],
      texts: [...svg.querySelectorAll("[data-text]")],
      moon: [...svg.querySelectorAll("[data-moon]")],
      custom: drawing.update || null
    };
  }

  function phaseFor(snapshot) {
    const hour = snapshot.hour + snapshot.minute / 60;
    if (hour < 5.5 || hour >= 20.5) return "night";
    if (hour < 7.5) return "dawn";
    if (hour < 18) return "day";
    return "dusk";
  }

  function updateFace(instance, date) {
    const snapshot = CLOCK.snapshot(instance.city.zone, date, instance.face.cadence);
    instance.hands.forEach((node) => {
      const channel = node.dataset.hand;
      let angle = 0;
      if (channel === "hour") angle = snapshot.hourAngle;
      else if (channel === "minute") angle = snapshot.minuteAngle;
      else if (channel === "second" || channel === "small-second") angle = snapshot.secondAngle;
      else if (channel === "gmt") angle = snapshot.gmtAngle;
      else if (channel === "day") angle = snapshot.weekday * 360 / 7;
      else if (channel === "date") angle = (snapshot.date - 1) * 360 / 31;
      else if (channel === "month") angle = snapshot.month * 30;
      else if (channel === "moon") angle = snapshot.moon * 360;
      const cx = Number(node.dataset.cx || 50);
      const cy = Number(node.dataset.cy || 50);
      node.setAttribute("transform", `rotate(${H.n(angle)} ${cx} ${cy})`);
    });
    instance.texts.forEach((node) => {
      const value = CLOCK.channel(node.dataset.text, snapshot);
      if (node.textContent !== value) node.textContent = value;
    });
    instance.moon.forEach((node) => {
      node.setAttribute("transform", `translate(${H.n((snapshot.moon - .5) * 9)} 0)`);
    });
    if (instance.custom) instance.custom(instance.svg, snapshot);
    return snapshot;
  }

  function render() {
    const date = new Date();
    rows = ordered(date);
    instances.clear();

    if (!rows.length) {
      DOM.grid.innerHTML = `<p class="empty">No cities selected</p>`;
      DOM.summary.textContent = `0 cities / ${FACE_KEYS.length} faces`;
      return;
    }

    DOM.grid.innerHTML = rows.map(cardMarkup).join("");
    rows.forEach((row) => {
      const card = DOM.grid.querySelector(`[data-city="${row.city.id}"]`);
      const mounted = mountFace(card.querySelector('[data-role="watch"]'),
        row.entry.face, row.city.id);
      instances.set(row.city.id, {
        ...mounted,
        card,
        city: row.city,
        offset: row.offset,
        time: card.querySelector('[data-role="time"]'),
        offsetNode: card.querySelector('[data-role="offset"]'),
        dateNode: card.querySelector('[data-role="date"]'),
        lastMinute: null,
        lastDate: null,
        lastPhase: null
      });
    });
    DOM.summary.textContent = `${rows.length} ${rows.length === 1 ? "city" : "cities"} / ${FACE_KEYS.length} faces`;
    update(new Date());
  }

  function update(date) {
    const homeOffset = CLOCK.offset(state.homeZone, date);
    rows.forEach((row) => {
      const instance = instances.get(row.city.id);
      if (!instance) return;
      const snapshot = updateFace(instance, date);
      const minuteKey = `${snapshot.hour}:${snapshot.minute}`;
      if (minuteKey !== instance.lastMinute) {
        instance.lastMinute = minuteKey;
        instance.time.textContent = CLOCK.channel("digital24", snapshot);
        const difference = row.offset - homeOffset;
        const relation = difference === 0 ? "local" :
          `${difference > 0 ? "+" : "-"}${Math.floor(Math.abs(difference) / 60)}h` +
          `${Math.abs(difference) % 60 ? CLOCK.pad(Math.abs(difference) % 60) : ""}`;
        instance.offsetNode.textContent = `${CLOCK.offsetLabel(row.offset)} / ${relation}`;
      }
      const dateKey = `${snapshot.year}-${snapshot.month}-${snapshot.date}`;
      if (dateKey !== instance.lastDate) {
        instance.lastDate = dateKey;
        instance.dateNode.textContent =
          `${CLOCK.WEEKDAYS[snapshot.weekday]} ${CLOCK.MONTHS[snapshot.month]} ${snapshot.date}`;
      }
      const phase = phaseFor(snapshot);
      if (phase !== instance.lastPhase) {
        instance.lastPhase = phase;
        instance.card.dataset.phase = phase;
      }
    });
  }

  function announce(message) {
    DOM.live.textContent = message;
  }

  DOM.grid.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const card = button.closest("[data-city]");
    const entry = state.cities.find((item) => item.cityId === card.dataset.city);
    if (!entry) return;
    const city = CITY_BY_ID.get(entry.cityId);

    if (button.dataset.action === "shuffle") {
      const previous = entry.face;
      entry.face = chooseFace(entry, previous);
      save();
      render();
      announce(`${city.name} now shows ${FACES[entry.face].name}.`);
      const replacement = DOM.grid.querySelector(
        `[data-city="${city.id}"] [data-action="shuffle"]`);
      if (replacement) replacement.focus();
    } else {
      state.cities = state.cities.filter((item) => item !== entry);
      save();
      render();
      announce(`${city.name} removed.`);
      DOM.input.focus();
    }
  });

  DOM.shuffle.addEventListener("click", () => {
    assignAllFaces();
    save();
    render();
    announce(`Shuffled ${state.cities.length} faces.`);
  });

  const search = { matches: [], active: -1 };

  function normalize(value) {
    return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function cityMatches(query) {
    const needle = normalize(query.trim());
    if (!needle) return [];
    const selected = new Set(state.cities.map((entry) => entry.cityId));
    const matches = CITIES.filter((city) => {
      if (selected.has(city.id)) return false;
      const haystack = `${normalize(city.name)} ${normalize(city.country)}`;
      return haystack.includes(needle);
    });
    matches.sort((a, b) => {
      const aStarts = normalize(a.name).startsWith(needle) ? 0 : 1;
      const bStarts = normalize(b.name).startsWith(needle) ? 0 : 1;
      return aStarts - bStarts || a.name.localeCompare(b.name, "en");
    });
    return matches.slice(0, 9);
  }

  function closeSearch() {
    search.matches = [];
    search.active = -1;
    DOM.results.hidden = true;
    DOM.results.innerHTML = "";
    DOM.input.setAttribute("aria-expanded", "false");
    DOM.input.removeAttribute("aria-activedescendant");
  }

  function renderSearch() {
    search.matches = cityMatches(DOM.input.value);
    search.active = -1;
    if (!search.matches.length) {
      closeSearch();
      return;
    }
    const date = new Date();
    DOM.results.innerHTML = search.matches.map((city, index) =>
      `<li class="search-option" id="city-option-${index}" role="option"
        aria-selected="false" data-city="${city.id}">
        <span class="option-city">${H.esc(city.name)}</span>
        <span class="option-country">${H.esc(city.country)}</span>
        <span class="option-offset">${CLOCK.offsetLabel(CLOCK.offset(city.zone, date))}</span>
      </li>`
    ).join("");
    DOM.results.hidden = false;
    DOM.input.setAttribute("aria-expanded", "true");
  }

  function setActive(index) {
    if (!search.matches.length) return;
    search.active = (index + search.matches.length) % search.matches.length;
    [...DOM.results.children].forEach((option, optionIndex) => {
      option.setAttribute("aria-selected",
        optionIndex === search.active ? "true" : "false");
    });
    const active = DOM.results.children[search.active];
    DOM.input.setAttribute("aria-activedescendant", active.id);
    active.scrollIntoView({ block: "nearest" });
  }

  function addCity(cityId) {
    const city = CITY_BY_ID.get(cityId);
    if (!city || state.cities.some((entry) => entry.cityId === cityId)) return;
    const entry = { cityId, face: null };
    state.cities.push(entry);
    entry.face = chooseFace(entry);
    DOM.input.value = "";
    closeSearch();
    save();
    render();
    announce(`${city.name} added with ${FACES[entry.face].name}.`);
  }

  DOM.input.addEventListener("input", renderSearch);
  DOM.input.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (DOM.results.hidden) renderSearch();
      setActive(search.active + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      if (DOM.results.hidden) renderSearch();
      setActive(search.active - 1);
    } else if (event.key === "Enter" && search.matches.length) {
      event.preventDefault();
      addCity(search.matches[search.active < 0 ? 0 : search.active].id);
    } else if (event.key === "Escape") {
      closeSearch();
    }
  });

  DOM.results.addEventListener("mousedown", (event) => {
    const option = event.target.closest("[data-city]");
    if (!option) return;
    event.preventDefault();
    addCity(option.dataset.city);
  });

  DOM.form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (search.matches.length) addCity(search.matches[search.active < 0 ? 0 : search.active].id);
  });

  document.addEventListener("click", (event) => {
    if (!DOM.form.contains(event.target)) closeSearch();
  });

  let lastOrderKey = "";
  function loop() {
    const date = new Date();
    const nextOrderKey = ordered(date).map((row) => `${row.city.id}:${row.offset}`).join("|");
    if (nextOrderKey !== lastOrderKey) {
      lastOrderKey = nextOrderKey;
      render();
    } else {
      update(date);
    }
  }

  function start() {
    if (reduceMotion) {
      loop();
      window.setInterval(loop, 1000);
    } else {
      const frame = () => {
        loop();
        window.requestAnimationFrame(frame);
      };
      frame();
    }
  }

  load();
  DOM.home.textContent = `${state.homeZone.replace(/_/g, " ")} / ${CLOCK.offsetLabel(CLOCK.offset(state.homeZone, new Date()))}`;
  render();
  start();

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      lastOrderKey = "";
      loop();
    }
  });
})();
</script>
</body>
</html>
