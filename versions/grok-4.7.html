    .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }

    .suggest {
      position: absolute; z-index: 8; left: 0; right: 0; top: calc(100% + 4px);

    .suggest button {

    }
    .suggest button[aria-selected="true"], .suggest button:hover { background: #2a313b; }
    .suggest small { color: var(--mute); }
    .btn {
      min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--paper); font-size: 13px; letter-spacing: .02em;
    }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.tiny { min-height: 36px; padding: 0 10px; font-size: 12px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .meta-row {
      display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
      padding: 12px 0 4px; color: var(--mute); font-size: 12px;
    }
    .meta-row strong { color: var(--ink); font-weight: 600; }
    .clocks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 8px 0 28px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .face-well {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, #fff 0%, #f6efe4 62%, #eadfcb 100%);
      border-bottom: 1px solid var(--line);
      color: #1c1612;
      cursor: zoom-in;
      min-width: 0;
    }
    .face-well svg { width: 94%; height: 94%; }
    .card-body { padding: 10px 12px 12px; display: grid; gap: 6px; }
    .card-top, .card-actions { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .city-name { font-family: var(--serif); font-size: 20px; letter-spacing: -.02em; margin: 0; }
    .offset { font-variant-numeric: tabular-nums; color: var(--brass); font-size: 12px; }
    .when { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .when time { font-variant-numeric: tabular-nums; font-size: 18px; letter-spacing: .02em; }
    .date-line { color: var(--mute); font-size: 12px; }
    .sky {
      font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid var(--line-strong); padding: 3px 6px; color: var(--celadon);
    }
    .sky.Night { color: #d5e4ff; background: #243044; }
    .sky.Dawn, .sky.Dusk { color: #f0b429; background: #3a2e18; }
    .sky.Daylight { color: #b7ebc8; background: #1c3328; }
    .card-actions { flex-wrap: wrap; }
    .sheet {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      padding-bottom: 40px;
    }
    body.sheet-mode .clocks, body.sheet-mode .meta-row { display: none; }
    body.sheet-mode .sheet { display: grid; }
    .sheet figure { margin: 0; background: var(--card); border: 1px solid var(--line); min-width: 0; }
    .sheet .face-well { cursor: zoom-in; }
    .sheet figcaption { font-size: 10px; padding: 6px 8px 8px; color: var(--mute); line-height: 1.35; }
    .sheet figcaption strong { display: block; color: var(--ink); font-size: 11px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
    .filters button[aria-pressed="true"] { background: var(--cinnabar); border-color: var(--cinnabar); color: #101318; }
    dialog {
      width: min(920px, calc(100% - 24px));
      border: 1px solid var(--line-strong);
      padding: 0;
      background: #161a20;
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(28, 22, 18, .46); }
    .inspect { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(240px, .9fr); }
    .inspect-face { background: radial-gradient(circle at 50% 40%, #fff, #efe4d2); display: grid; place-items: center; min-height: 320px; }

    .inspect-copy { padding: 18px 18px 16px; }
    .inspect-copy h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; letter-spacing: -.03em; }
    .kicker { color: var(--cinnabar-deep); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; }
    .notes { color: var(--ink-soft); font-size: 14px; line-height: 1.5; }

    .assign { display: flex; gap: 8px; align-items: center; }
    .assign select { min-height: 44px; flex: 1; border: 1px solid var(--line-strong); background: #0e1116; color: var(--ink); }

    footer.colophon {
      border-top: 1px solid var(--line);

      padding: 14px 0 28px;
      display: flex;
      justify-content: space-between;
      gap: 12px;

    @media (max-width: 800px) {
      header.top { grid-template-columns: 1fr; gap: 12px; }
      .tools { justify-content: stretch; }
      .search-wrap { max-width: none; flex-basis: 100%; }
      .inspect { grid-template-columns: 1fr; }
      .brand h1 { font-size: 24px; }

    @media (max-width: 540px) {
      .wrap { width: min(100% - 20px, 1180px); }
      .clocks { grid-template-columns: 1fr; }
      .btn { padding: 0 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<a class="skip" href="#clocks">Skip to clocks</a>
<div class="wrap">
  <header class="top">
    <div class="brand">

      </div>
      <button class="btn" id="add-city" type="button">Add</button>
      <button class="btn ghost" id="shuffle-all" type="button">Shuffle all</button>
      <button class="btn ghost" id="toggle-sheet" type="button" aria-pressed="false">Collection</button>
      <button class="btn ghost" id="reset-folio" type="button">Reset</button>
    </div>
  </header>
  <div class="meta-row">
    <span id="order-note">Ordered west to east by current offset</span>
    <span>UTC <time id="utc-clock">--:--:--</time></span>
  </div>
  <p id="boot-error" role="alert"></p>
  <div class="filters" id="filters" hidden>
    <button class="btn ghost tiny" type="button" data-cat="All" aria-pressed="true">All</button>
    <button class="btn ghost tiny" type="button" data-cat="Diver" aria-pressed="false">Diver</button>
    <button class="btn ghost tiny" type="button" data-cat="Dress" aria-pressed="false">Dress</button>
    <button class="btn ghost tiny" type="button" data-cat="Chronograph" aria-pressed="false">Chronograph</button>
    <button class="btn ghost tiny" type="button" data-cat="Field" aria-pressed="false">Field</button>

    <button class="btn ghost tiny" type="button" data-cat="Clock" aria-pressed="false">Clock</button>
  </div>
  <main id="clocks" class="clocks" aria-live="polite"></main>
  <section class="sheet" id="sheet" aria-label="All 62 faces"></section>
  <footer class="colophon">
    <span>Drawn as inline SVG. Time comes from this browser’s clock and time-zone data.</span>
    <a href="../docs/grok-4.7-reference-notes.md">Reference notes</a>
  </footer>
</div>
<dialog id="inspect" aria-labelledby="inspect-title">
  <div class="inspect">
    <div class="inspect-face" id="inspect-face"></div>
    <div class="inspect-copy">
      <button class="btn ghost tiny close-x" id="close-inspect" type="button">Close</button>
      <p class="kicker" id="inspect-kicker"></p>
      <h2 id="inspect-title"></h2>
      <p class="notes" id="inspect-notes"></p>
      <div class="pose" id="pose-row"></div>
      <div class="pose" id="chrono-row" hidden>
        <button class="btn tiny" type="button" id="chrono-toggle">Start</button>
        <button class="btn ghost tiny" type="button" id="chrono-reset">Reset</button>
      </div>
      <div class="assign">
        <label class="sr" for="assign-city">Assign this face to a city</label>
        <select id="assign-city"></select>
        <button class="btn tiny" id="assign-go" type="button">Assign</button>
      </div>
    </div>
  </div>
</dialog>

  function P(cx, cy, r, deg) {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  }
  function f(n) { return Number(n).toFixed(2); }
  function pts(list) { return list.map(p => p.map(f).join(",")).join(" "); }

  function ticks(cx, cy, r1, r2, step, color, sw, skip) {
    let s = "";
    for (let d = 0; d < 360; d += step) {
      if (skip && skip.indexOf(d) >= 0) continue;
      const a = P(cx, cy, r1, d), b = P(cx, cy, r2, d);
      s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${color}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    }
    return s;
  }

  function ringText(id, cx, cy, r, text, size, fill) {
    return `<defs><path id="${id}-ring" d="M ${f(cx - r)},${f(cy)} a ${r},${r} 0 1 1 ${r * 2},0 a ${r},${r} 0 1 1 ${-r * 2},0"/></defs><text fill="${fill}" font-size="${size}" letter-spacing="1.4"><textPath href="#${id}-ring">${text}</textPath></text>`;
  }

  function crownMark(x, y, s, fill) {
    return `<g transform="translate(${f(x)} ${f(y)}) scale(${s})" fill="${fill}"><path d="M-8,4 L-8,-1 L-4,-4 L0,-1 L4,-5 L8,-1 L8,4 Z"/><rect x="-8" y="4" width="16" height="2.2"/></g>`;
  }

  function metalDefs(id) {
    return `<defs>
      <linearGradient id="${id}-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafb"/><stop offset=".45" stop-color="#c5ced3"/><stop offset=".72" stop-color="#f3f6f7"/><stop offset="1" stop-color="#8d979d"/></linearGradient>

      <radialGradient id="${id}-glass" cx="36%" cy="30%" r="68%"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".42" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#1c2830" stop-opacity=".16"/></radialGradient>

      <pattern id="${id}-wave" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="#0d3f86"/><path d="M0,3 Q3,0 6,3 T12,3" fill="none" stroke="#1a56a8" stroke-width="1.4"/></pattern>
      <pattern id="${id}-lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#7fd0cc"/><path d="M0,2 H4" stroke="#6bb8b6" stroke-width=".6"/></pattern>

  }

  function strapBlock(kind, color) {
    if (kind === "none") return "";
    const c = color || "#1b1b1b";
    if (kind === "oyster" || kind === "jubilee" || kind === "bracelet") {
      const link = (y, h) => `<rect x="58" y="${y}" width="84" height="${h}" rx="2" fill="url(#steel)"/><rect x="70" y="${y + 1}" width="60" height="${h - 2}" fill="#d5dde0" opacity=".35"/>`;
      let s = "";
      for (let i = 0; i < 5; i++) s += link(4 + i * 13, 12) + link(214 + i * 12, 12);
      if (kind === "jubilee") {
        s = "";
        for (let i = 0; i < 4; i++) {
          s += `<rect x="62" y="${8 + i * 11}" width="22" height="8" rx="1" fill="#dfe6e8"/><rect x="89" y="${8 + i * 11}" width="22" height="8" rx="1" fill="#c5cfd3"/><rect x="116" y="${8 + i * 11}" width="22" height="8" rx="1" fill="#dfe6e8"/>`;

    d -= w;
    if (d <= h) return [x + w, y + d];
    d -= h;
    if (d <= w) return [x + w - d, y + h];
    d -= w;

    casiomq24: { name: "CASIO MQ-24-7B2LL", cadence: "tick", category: "Dress", note: "Simple resin analog, white dial, stick markers and hands. Archive folder empty.", spec: { strap: "rubber", strapColor: "#111", metal: "black", bezelFill: "#111", dial: "#f7f7f7", markers: "baton", marker: "#161616", hands: "stick", hand: "#161616", second: "stick", secondColor: "#c4372a", texts: [{ t: "CASIO", y: -16, size: 6, fill: "#161616" }, { t: "QUARTZ", y: 24, size: 4, fill: "#666" }] } },
    bigtic: { name: "Fossil Big Tic JR-7845", cadence: "tick", category: "Digital", custom: "bigtic", note: "Analog hands plus a 60-segment LCD ring. One segment lights per second and the ring clears at the next minute. Archive folder empty." },
    timexindiglo: { name: "Timex Easy Reader Day Date T20041 (INDIGLO)", cadence: "tick", category: "Dress", note: "White easy-reader, day-date at 3. The blue-green INDIGLO wash appears from 20:00 to 06:00 local, instead of a crown press. Archive folder empty.", spec: { strap: "leather", strapColor: "#1a2744", bezelFill: "#c5ccd0", dial: "#f7f7f7", markers: "arabic", marker: "#161616", hands: "stick", hand: "#161616", second: "stick", secondColor: "#c4372a", dayDate: true, dateAt: 3, indiglo: true, texts: [{ t: "TIMEX", y: -8, size: 6, fill: "#161616" }, { t: "INDIGLO", y: 26, size: 3.6, fill: "#1d4c86" }] } }
  };

  const FACE_KEYS = Object.keys(FACES);

  function offsetMinutes(tz, date) {
    const fmt = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset", hour: "2-digit" });
    const name = fmt.formatToParts(date).find(p => p.type === "timeZoneName");
    const raw = name ? name.value : "GMT";
    const m = raw.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
    if (!m) return 0;
    const sign = m[1] === "-" ? -1 : 1;
    return sign * (Number(m[2]) * 60 + Number(m[3] || 0));
  }

  function localClock(tz, date) {
    const off = offsetMinutes(tz, date);
    const local = new Date(date.getTime() + off * 60000);
    return {
      h: local.getUTCHours(),
      m: local.getUTCMinutes(),
      s: local.getUTCSeconds(),
      ms: local.getUTCMilliseconds(),
      dow: local.getUTCDay(),
      date: local.getUTCDate(),
      month: local.getUTCMonth(),
      year: local.getUTCFullYear(),
      off
    };
  }

  function dayOfYear(clock) {
    const t = Date.UTC(clock.year, clock.month, clock.date);
    const start = Date.UTC(clock.year, 0, 1);
    return Math.floor((t - start) / 86400000) + 1;
  }

  function moonPhase(date) {
    const known = Date.UTC(2000, 0, 6, 18, 14);
    const syn = 29.530588853 * 86400000;
    return ((date.getTime() - known) % syn + syn) % syn / syn;
  }

  function skyState(clock) {
    const city = byName[clock.city];
    const lat = ((city && city.lat) || 0) * Math.PI / 180;
    const decl = 23.44 * Math.PI / 180 * Math.sin((360 / 365) * (dayOfYear(clock) - 81) * Math.PI / 180);
    const ha = (clock.h + clock.m / 60 - 12) * 15 * Math.PI / 180;
    const elev = Math.asin(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha));
    if (elev > 0.04) return "Daylight";
    if (elev > -0.08) return clock.h < 12 ? "Dawn" : "Dusk";
    return "Night";
  }

  function displayedSecond(face, clock) {
    const exact = clock.s + clock.ms / 1000;
    if (reduced || face.cadence === "tick" || face.cadence === "digital") return clock.s;
    if (face.cadence === "glide") return exact;
    if (face.cadence === "mondaine") {
      if (exact >= 58) return 0;
      return exact * (60 / 58);
    }
    const hz = (face.vph || 28800) / 3600;
    return Math.floor(exact * hz) / hz;
  }

  function formatOffset(min) {
    const sign = min >= 0 ? "+" : "−";
    const abs = Math.abs(min);
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    return "UTC" + sign + String(h) + (m ? ":" + String(m).padStart(2, "0") : "");
  }

  let reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { reduced = false; }

  let cities = [];
  let seq = 0;
  let sheetCat = "All";
  let inspectKey = null;
  let pose = null;
  let chrono = { running: false, base: 0, started: 0 };
  const suggestIndex = { i: -1 };

  function defaultCities() {
    return [
      ["Honolulu", "submariner"],
      ["Los Angeles", "speedmaster"],
      ["New York", "nautilus"],
      ["London", "royaloak"],
      ["Dubai", "tank"],
      ["Singapore", "seamaster"],
      ["Tokyo", "snowflake"],
      ["Sydney", "bigben"]
    ].filter(([, face]) => FACES[face]).map(([name, face]) => ({ name, face, chrono: { running: false, base: 0, started: 0 } }));
  }

  function loadCities() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE) || "null");
      if (Array.isArray(raw) && raw.length && raw.every(c => byName[c.name] && FACES[c.face])) {
        cities = raw.map(c => ({ name: c.name, face: c.face, chrono: c.chrono || { running: false, base: 0, started: 0 } }));
        return;
      }
    } catch (e) { /* keep defaults */ }
    cities = defaultCities();
  }

  function saveCities() {
    try { localStorage.setItem(STORE, JSON.stringify(cities)); } catch (e) { /* private mode */ }
  }

  function sortCities(now) {
    cities.sort((a, b) => {
      const oa = offsetMinutes(byName[a.name].tz, now);
      const ob = offsetMinutes(byName[b.name].tz, now);
      if (oa !== ob) return oa - ob;
      return a.name.localeCompare(b.name);
    });
  }

  function unusedFaces(exceptName) {
    const used = new Set(cities.filter(c => c.name !== exceptName).map(c => c.face));
    return FACE_KEYS.filter(k => !used.has(k));
  }

  function shuffleOne(name) {
    const city = cities.find(c => c.name === name);
    if (!city) return;
    const pool = unusedFaces(name);
    const choices = pool.length ? pool : FACE_KEYS.filter(k => k !== city.face);
    city.face = choices[Math.floor(Math.random() * choices.length)];
    saveCities();
    renderBoard();
  }

  function shuffleAll() {
    const bag = FACE_KEYS.slice();
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
    cities.forEach((c, i) => { c.face = bag[i % bag.length]; });
    saveCities();
    renderBoard();
  }

  function addCity(name) {
    if (!byName[name] || cities.some(c => c.name === name)) return;
    const pool = unusedFaces("");
    const face = pool[0] || FACE_KEYS[cities.length % FACE_KEYS.length];
    cities.push({ name, face, chrono: { running: false, base: 0, started: 0 } });
    saveCities();
    renderBoard();
  }

  function removeCity(name) {
    cities = cities.filter(c => c.name !== name);
    saveCities();
    renderBoard();
  }

  function renderBoard() {
    const now = new Date();
    sortCities(now);
    const root = document.getElementById("clocks");
    root.innerHTML = cities.map(city => {
      const id = "c" + (++seq);
      city.domId = id;
      const svg = drawFace(city.face, id);
      return `<article class="card" data-city="${city.name}">
        <button class="face-well" type="button" data-open="${city.face}" aria-label="Inspect ${FACES[city.face].name}">${svg}</button>
        <div class="card-body">
          <div class="card-top"><h2 class="city-name">${city.name}</h2><span class="offset" data-offset>—</span></div>
          <div class="when"><time data-readout>--:--:--</time><span class="sky" data-sky>—</span></div>
          <div class="date-line" data-date></div>
          <div class="card-actions">
            <button class="btn ghost tiny" type="button" data-shuffle="${city.name}">Shuffle face</button>
            <button class="btn ghost tiny" type="button" data-remove="${city.name}">Remove</button>
          </div>
        </div>
      </article>`;
    }).join("");
    document.getElementById("order-note").textContent = cities.length + " cities · west to east";
    tick(now);
  }

  function applyClock(root, key, clock, chronoState, dateObj) {
    const face = FACES[key];
    if (!root || !face) return;
    const sec = displayedSecond(face, clock);
    const minute = clock.m + sec / 60;
    const hourA = ((clock.h % 12) + minute / 60) * 30;
    const utcH = ((clock.h * 60 + clock.m - clock.off) / 60 + 48) % 24;
    const elapsed = chronoElapsed(chronoState, dateObj);
    const map = {
      hour: hourA,
      minute: minute * 6,
      second: sec * 6,
      subsec: sec * 6,
      gmt: utcH * 15,
      csec: (elapsed % 60) * 6,
      cmin: (Math.floor(elapsed / 60) % 30) * 12,
      chour: (Math.floor(elapsed / 3600) % 12) * 30,
      tenth: Math.floor(clock.ms / 100) * 36,
      reserve: 40 + 80 * (0.5 + 0.35 * Math.sin((clock.h * 60 + clock.m) / 240)),
      regatta: ((600 - ((clock.m % 10) * 60 + sec)) / 600) * 360,
      zodiac: (dayOfYear(clock) / 365) * 360,
      daydisc: (clock.h + clock.m / 60) * 15
    };
    root.querySelectorAll("[data-hand]").forEach(node => {
      const kind = node.getAttribute("data-hand");
      const ang = map[kind] || 0;
      node.setAttribute("transform", `rotate(${ang} ${node.getAttribute("data-cx")} ${node.getAttribute("data-cy")})`);
    });
    const dateText = String(clock.date);
    const set = (field, value) => root.querySelectorAll(`[data-field="${field}"]`).forEach(n => { n.textContent = value; });
    set("date", dateText);
    set("dow", WEEK[clock.dow].toUpperCase());
    set("month", MONTHS[clock.month].toUpperCase());
    set("year", String(clock.year));
    set("dayname", WEEK[clock.dow]);
    const hh = String(clock.h).padStart(2, "0");
    const mm = String(clock.m).padStart(2, "0");
    const ss = String(clock.s).padStart(2, "0");
    paintDigits(root, "time", hh + mm + ss);
    paintDigits(root, "f91", hh + mm + ss);
    root.querySelectorAll("[data-colon]").forEach(n => { n.setAttribute("opacity", clock.s % 2 ? "1" : ".35"); });
    root.querySelectorAll("[data-field='lcd-day']").forEach(n => { n.textContent = WEEK[clock.dow].toUpperCase(); });
    root.querySelectorAll("[data-field='lcd-date']").forEach(n => { n.textContent = (clock.month + 1) + "-" + clock.date; });
    root.querySelectorAll("[data-moon]").forEach(node => {
      const phase = pose && pose.fullMoon ? 0.5 : moonPhase(dateObj);
      const r = Number(node.getAttribute("data-r"));
      const cx = Number(node.getAttribute("data-cx"));
      const disc = node.querySelector("[data-moon-disc]");
      if (disc) disc.setAttribute("cx", f(cx + (0.5 - phase) * r * 2));
    });
    root.querySelectorAll("[data-indiglo]").forEach(node => {
      const on = clock.h >= 20 || clock.h < 6;
      node.setAttribute("opacity", on ? "0.38" : "0");
    });
    root.querySelectorAll("[data-bigtic]").forEach(node => {
      const i = Number(node.getAttribute("data-bigtic"));
      node.setAttribute("fill", i <= clock.s ? "#39d16a" : "#d5ddd0");
    });
    root.querySelectorAll("[data-field='ampm']").forEach(n => { n.textContent = clock.h >= 12 ? "PM" : "AM"; });
  }

  function chronoElapsed(state, dateObj) {
    if (!state) return 0;
    if (!state.running) return state.base || 0;
    return (state.base || 0) + (dateObj.getTime() - state.started) / 1000;
  }

  function tick(now) {
    const date = now || new Date();
    const utc = new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
    const utcNode = document.getElementById("utc-clock");
    utcNode.textContent = utc.format(date);
    utcNode.dateTime = date.toISOString();
    document.querySelectorAll(".card").forEach(card => {
      const name = card.getAttribute("data-city");
      const city = cities.find(c => c.name === name);
      if (!city) return;
      const clock = localClock(byName[name].tz, date);
      clock.city = name;
      applyClock(card, city.face, clock, city.chrono, date);
      const readout = card.querySelector("[data-readout]");
      readout.textContent = [clock.h, clock.m, clock.s].map(n => String(n).padStart(2, "0")).join(":");
      readout.dateTime = readout.textContent;
      card.querySelector("[data-offset]").textContent = formatOffset(clock.off);
      card.querySelector("[data-date]").textContent = WEEK[clock.dow] + " " + clock.date + " " + MONTHS[clock.month] + " " + clock.year;
      const sky = card.querySelector("[data-sky]");
      const state = skyState(clock);
      sky.textContent = state;
      sky.className = "sky " + state;
    });
    if (inspectKey && document.getElementById("inspect").open) refreshInspect(date);
  }

  function posedClock(spec) {
    const base = { h: 10, m: 8, s: 37, ms: 0, dow: 2, date: 8, month: 8, year: 2026, off: 0, city: "London" };
    if (!spec) return base;
    if (spec.fullMoon) return Object.assign({}, base, { date: 18 });
    return Object.assign({}, base, spec);
  }

  function refreshInspect(date) {
    const faceNode = document.getElementById("inspect-face");
    const svg = faceNode.querySelector("svg");
    if (!svg) return;
    const clock = pose ? posedClock(pose) : localClock("UTC", date);
    clock.city = "London";
    applyClock(faceNode, inspectKey, clock, chrono, pose && pose.fullMoon ? new Date(Date.UTC(2026, 8, 26)) : date);
  }

  function openInspect(key) {
    inspectKey = key;
    pose = null;
    chrono = { running: false, base: 0, started: 0 };
    const face = FACES[key];
    document.getElementById("inspect-kicker").textContent = face.category + " · " + face.cadence + (face.vph ? " · " + face.vph + " vph" : "");
    document.getElementById("inspect-title").textContent = face.name;
    document.getElementById("inspect-notes").textContent = face.note || "";
    document.getElementById("inspect-face").innerHTML = drawFace(key, "inspect" + (++seq));
    const poses = [
      ["Live", null],
      ["10:10", { h: 10, m: 10, s: 0 }],
      ["12:00", { h: 12, m: 0, s: 0 }],
      ["03:15", { h: 3, m: 15, s: 8, date: 5 }],
      ["06:30", { h: 6, m: 30, s: 30 }],
      ["23:59", { h: 23, m: 59, s: 59, date: 31, dow: 3 }],
      ["Full moon", { fullMoon: true }]
    ];
    document.getElementById("pose-row").innerHTML = poses.map(([label], i) => `<button class="btn ghost tiny" type="button" data-pose="${i}">${label}</button>`).join("");
    document.getElementById("pose-row").dataset.poses = JSON.stringify(poses.map(p => p[1]));
    const chronoRow = document.getElementById("chrono-row");
    chronoRow.hidden = !face.spec || !face.spec.chrono;
    const select = document.getElementById("assign-city");
    select.innerHTML = cities.map(c => `<option value="${c.name}">${c.name}</option>`).join("");
    document.getElementById("inspect").showModal();
    refreshInspect(new Date());
  }

  function renderSheet() {
    const root = document.getElementById("sheet");
    const keys = FACE_KEYS.filter(k => sheetCat === "All" || FACES[k].category === sheetCat);
    root.innerHTML = keys.map(key => {
      const id = "s" + (++seq);
      const face = FACES[key];
      return `<figure><button class="face-well" type="button" data-open="${key}" aria-label="Inspect ${face.name}">${drawFace(key, id)}</button><figcaption><strong>${face.name}</strong>${key} · ${face.cadence}</figcaption></figure>`;
    }).join("");
    const frozen = posedClock({ h: 10, m: 8, s: 37, date: 18 });
    root.querySelectorAll("figure").forEach((fig, i) => {
      applyClock(fig, keys[i], frozen, { running: false, base: 0, started: 0 }, new Date(Date.UTC(2026, 8, 18, 10, 8, 37)));
    });
  }

  function bind() {
    document.getElementById("clocks").addEventListener("click", ev => {
      const open = ev.target.closest("[data-open]");
      const shuffle = ev.target.closest("[data-shuffle]");
      const remove = ev.target.closest("[data-remove]");
      if (shuffle) shuffleOne(shuffle.getAttribute("data-shuffle"));
      else if (remove) removeCity(remove.getAttribute("data-remove"));
      else if (open) openInspect(open.getAttribute("data-open"));
    });
    document.getElementById("sheet").addEventListener("click", ev => {
      const open = ev.target.closest("[data-open]");
      if (open) openInspect(open.getAttribute("data-open"));
    });
    document.getElementById("shuffle-all").addEventListener("click", shuffleAll);
    document.getElementById("reset-folio").addEventListener("click", () => { cities = defaultCities(); saveCities(); renderBoard(); });
    document.getElementById("add-city").addEventListener("click", () => {
      const value = document.getElementById("city-search").value.trim();
      const hit = CITIES.find(c => c.name.toLowerCase() === value.toLowerCase());
      if (hit) { addCity(hit.name); document.getElementById("city-search").value = ""; hideSuggest(); }
    });
    document.getElementById("toggle-sheet").addEventListener("click", () => {
      const on = !document.body.classList.contains("sheet-mode");
      document.body.classList.toggle("sheet-mode", on);
      document.getElementById("toggle-sheet").setAttribute("aria-pressed", String(on));
      document.getElementById("filters").hidden = !on;
      if (on) renderSheet();
    });
    document.getElementById("filters").addEventListener("click", ev => {
      const btn = ev.target.closest("[data-cat]");
      if (!btn) return;
      sheetCat = btn.getAttribute("data-cat");
      document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      renderSheet();
    });
    document.getElementById("close-inspect").addEventListener("click", () => document.getElementById("inspect").close());
    document.getElementById("inspect").addEventListener("close", () => { inspectKey = null; });
    document.getElementById("pose-row").addEventListener("click", ev => {
      const btn = ev.target.closest("[data-pose]");
      if (!btn) return;
      const poses = JSON.parse(document.getElementById("pose-row").dataset.poses || "[]");
      pose = poses[Number(btn.getAttribute("data-pose"))];
      refreshInspect(new Date());
    });
    document.getElementById("chrono-toggle").addEventListener("click", () => {
      const now = Date.now();
      if (chrono.running) {
        chrono.base = chronoElapsed(chrono, new Date());
        chrono.running = false;
      } else {
        chrono.started = now;
        chrono.running = true;
      }
      document.getElementById("chrono-toggle").textContent = chrono.running ? "Stop" : "Start";
    });
    document.getElementById("chrono-reset").addEventListener("click", () => {
      chrono = { running: false, base: 0, started: 0 };
      document.getElementById("chrono-toggle").textContent = "Start";
      refreshInspect(new Date());
    });
    document.getElementById("assign-go").addEventListener("click", () => {
      const name = document.getElementById("assign-city").value;
      const city = cities.find(c => c.name === name);
      if (!city || !inspectKey) return;
      const other = cities.find(c => c.face === inspectKey && c.name !== name);
      if (other) other.face = city.face;
      city.face = inspectKey;
      saveCities();
      renderBoard();
    });
    const input = document.getElementById("city-search");
    const list = document.getElementById("city-suggest");
    input.addEventListener("input", () => showSuggest(input.value));
    input.addEventListener("keydown", ev => {
      const buttons = [...list.querySelectorAll("button")];
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        if (!buttons.length) return;
        suggestIndex.i = ev.key === "ArrowDown" ? Math.min(buttons.length - 1, suggestIndex.i + 1) : Math.max(0, suggestIndex.i - 1);
        buttons.forEach((b, i) => b.setAttribute("aria-selected", String(i === suggestIndex.i)));
      } else if (ev.key === "Enter") {
        ev.preventDefault();
        const chosen = buttons[suggestIndex.i] || buttons[0];
        if (chosen) { addCity(chosen.dataset.name); input.value = ""; hideSuggest(); }
        else document.getElementById("add-city").click();
      } else if (ev.key === "Escape") hideSuggest();
    });
    list.addEventListener("click", ev => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      addCity(btn.dataset.name);
      input.value = "";
      hideSuggest();
    });
    document.addEventListener("click", ev => {
      if (!ev.target.closest(".search-wrap")) hideSuggest();
    });
  }

  function hideSuggest() {
    const list = document.getElementById("city-suggest");
    list.hidden = true;
    list.innerHTML = "";
    document.getElementById("city-search").setAttribute("aria-expanded", "false");
    suggestIndex.i = -1;
  }

  function showSuggest(q) {
    const list = document.getElementById("city-suggest");
    const query = q.trim().toLowerCase();
    const hits = CITIES.filter(c => !query || c.name.toLowerCase().includes(query)).slice(0, 8);
    if (!query || !hits.length) { hideSuggest(); return; }
    suggestIndex.i = 0;
    list.hidden = false;
    document.getElementById("city-search").setAttribute("aria-expanded", "true");
    list.innerHTML = hits.map((c, i) => `<li role="presentation"><button type="button" role="option" data-name="${c.name}" aria-selected="${i === 0}">${c.name}<small>${c.tz}</small></button></li>`).join("");
  }

  const CUSTOMS = {
    tank: drawTank, reverso: drawReverso, lange: drawLange, gshock: drawGshock, f91w: drawF91w,
    apple: drawApple, monaco: drawMonaco, br03: drawBr03, santos: drawSantos, richard: drawRichard,
    freak: drawFreak, bigben: drawBigben, f1: drawF1, twinbell: drawTwinbell, grandfather: drawGrandfather,
    howard: drawHoward, orloj: drawOrloj, grandcentral: drawGrandCentral, railroad: drawRailroad,
    mickey: drawMickey, bigtic: drawBigtick, yacht: drawYacht, rainbow: drawRainbow, patek: drawPatek,
    moon: drawMoon, nomos: drawNomos, snoopy: drawSnoopy
  };

  function boot() {
    loadCities();
    bind();
    renderBoard();
    if (location.search.indexOf("sheet=1") >= 0) {
      document.body.classList.add("sheet-mode");
      document.getElementById("filters").hidden = false;
      document.getElementById("toggle-sheet").setAttribute("aria-pressed", "true");
      renderSheet();
    }
    const loop = () => { tick(new Date()); requestAnimationFrame(loop); };
    if (reduced) setInterval(() => tick(new Date()), 1000);
    else loop();
    tick(new Date());
  }

  window.addEventListener("error", ev => {
    const node = document.getElementById("boot-error");
    if (node) node.textContent = ev.message;
  });

  boot();
})();
