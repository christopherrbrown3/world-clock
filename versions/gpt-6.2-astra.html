<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9f8f3" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23254c40%27/%3E%3Cpath d=%27M16 5v11l7 4%27 fill=%27none%27 stroke=%27%23faf8ec%27 stroke-width=%272%27/%3E%3C/svg%3E"
    />
    <title>World Clock — OpenAI GPT 6.2 Astra</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f9f8f3;
        --ink: #202e2a;
        --soft: #52625b;
        --rule: #cdd2c9;
        --green: #254c40;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        --sans: 'Avenir Next', Avenir, 'Helvetica Neue', Arial, sans-serif;
        --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--paper);
        scrollbar-color: #9fa99e var(--paper);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 0;
      }
      a {
        color: inherit;
        text-underline-offset: 0.24em;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        padding: 0;
        background: none;
        border: 0;
      }
      button:disabled {
        opacity: 0.48;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #477e66;
        outline-offset: 3px;
      }
      ::selection {
        background: #c8d9c9;
        color: #14271e;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg.icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.55;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        margin: -1px;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .skip {
        position: fixed;
        z-index: 9;
        top: 6px;
        left: 8px;
        padding: 12px;
        background: var(--paper);
        transform: translateY(-150%);
      }
      .skip:focus {
        transform: none;
      }
      .frame {
        width: min(1430px, 100%);
        margin-inline: auto;
        padding-inline: clamp(18px, 4.35vw, 74px);
      }
      .mast {
        border-bottom: 1px solid var(--rule);
      }
      .mast .frame {
        display: flex;
        align-items: center;
        gap: 32px;
        min-height: 75px;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        text-decoration: none;
        font: 600 clamp(20px, 2.15vw, 30px) / 1 var(--serif);
        letter-spacing: -0.04em;
        white-space: nowrap;
      }
      .wordmark svg {
        width: 35px;
        height: 35px;
        color: var(--green);
      }
      .tabs {
        display: flex;
        align-self: stretch;
        align-items: stretch;
        gap: 24px;
        margin-left: clamp(4px, 3vw, 50px);
      }
      .tabs button {
        position: relative;
        font-size: 14px;
        font-weight: 600;
        color: var(--soft);
        min-height: 44px;
      }
      .tabs button[aria-current='page'] {
        color: var(--green);
      }
      .tabs button[aria-current='page']:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--green);
      }
      .tabs small {
        font-variant-numeric: tabular-nums;
        font-size: 0.78em;
        margin-left: 3px;
      }
      .credit {
        margin-left: auto;
        text-align: right;
        line-height: 1.3;
        font-size: 13px;
        white-space: nowrap;
      }
      .credit span,
      .credit b {
        display: block;
      }
      .credit span {
        font-size: 11px;
        color: var(--soft);
      }
      main {
        padding-block: clamp(20px, 2.7vw, 42px) 54px;
      }
      .pinboard {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(0, 1fr);
        border: 1px solid var(--rule);
      }
      .stage {
        position: relative;
        isolation: isolate;
        min-width: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: #dde3dc;
      }
      .hero-stage {
        background: radial-gradient(ellipse at 34% 13%, #36564b 0, #29483f 43%, #1a362f 100%);
        color: #fffef3;
        min-height: 365px;
      }
      .artwork {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }
      .art-slot {
        position: absolute;
        inset: 0;
        display: block;
        min-width: 0;
        min-height: 0;
      }
      .hero-stage .art-slot {
        inset: 0 max(16px, 6%) 0;
      }
      .plate-info {
        position: absolute;
        left: clamp(14px, 2vw, 30px);
        bottom: clamp(15px, 1.8vw, 26px);
        display: grid;
        gap: 4px;
        max-width: 32%;
        overflow-wrap: anywhere;
      }
      .plate-info .make {
        color: #d7e2d7;
        line-height: 1.3;
      }
      .plate-info .object-name {
        font: 500 clamp(15px, 1.45vw, 21px) / 1.08 var(--serif);
        text-wrap: balance;
      }
      .make,
      .mini-label {
        font: 650 10px/1.4 var(--sans);
        letter-spacing: 0.105em;
        text-transform: uppercase;
      }
      .inspect-trigger {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: #f6faf2;
        border: 1px solid #87a096;
        border-radius: 50%;
        background: #233d34;
      }
      .inspect-trigger:hover {
        background: #3c574b;
      }
      .city-profile {
        min-width: 0;
        padding: clamp(23px, 3vw, 46px) clamp(24px, 3.75vw, 63px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .location-line {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--soft);
        font-size: 13px;
      }
      .location-line .icon {
        width: 15px;
        height: 15px;
      }
      .city-profile h1 {
        font: 500 clamp(42px, 5.5vw, 82px) / 1 var(--serif);
        letter-spacing: -0.04em;
        margin: 8px 0 18px;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .time-read {
        display: flex;
        align-items: baseline;
        gap: 7px;
        font-size: clamp(37px, 4.4vw, 67px);
        line-height: 1;
        font-weight: 450;
        letter-spacing: -0.038em;
        font-variant-numeric: tabular-nums;
      }
      .time-read .sec {
        font-size: 0.44em;
        color: var(--soft);
        letter-spacing: -0.02em;
      }
      .calendar-line {
        margin-top: 9px;
        font-size: clamp(13px, 1.05vw, 16px);
        color: var(--soft);
      }
      .day-ruler {
        margin: 19px 0 17px;
        max-width: 390px;
      }
      .day-ruler svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        border: 1px solid #bfc8bd;
        border-radius: 4px;
        padding: 8px 14px;
        font-size: 13px;
        line-height: 1.2;
        font-weight: 600;
        background: transparent;
      }
      .control:hover,
      .icon-btn:hover {
        background: #e9ede4;
      }
      .control[aria-pressed='true'] {
        background: #d9e9db;
        border-color: var(--green);
      }
      .primary {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .primary:hover {
        background: #1c3e33;
      }
      .quiet {
        border-color: transparent;
        color: var(--soft);
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: inline-grid;
        place-items: center;
        border-radius: 4px;
      }
      .section-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: clamp(25px, 3vw, 44px) 0 15px;
      }
      .section-top h2,
      .collection-head h1,
      .empty-board h1 {
        font: 500 clamp(30px, 3.15vw, 49px) / 1.06 var(--serif);
        letter-spacing: -0.035em;
      }
      .clock-grid,
      .object-grid {
        display: grid;
        align-items: start;
        grid-template-columns: repeat(auto-fill, minmax(min(205px, 100%), 1fr));
        gap: clamp(11px, 1.3vw, 21px);
      }
      .city-tile,
      .object-tile {
        width: 100%;
        text-align: left;
        display: block;
        min-width: 0;
      }
      .tile-well {
        display: block;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background: var(--tile, #e1e4db);
        height: clamp(134px, 11.8vw, 180px);
      }
      .tile-well .art-slot {
        inset: 0 6%;
      }
      .city-tile .tile-well:after {
        content: '';
        position: absolute;
        z-index: 1;
        inset: 0;
        border: 1px solid #2d393217;
        pointer-events: none;
      }
      .city-tile[aria-pressed='true'] .tile-well:after {
        border: 2px solid var(--green);
      }
      .tile-tick {
        display: none;
        position: absolute;
        right: 8px;
        top: 8px;
        place-items: center;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        background: var(--green);
        color: white;
      }
      .tile-tick .icon {
        width: 14px;
        height: 14px;
      }
      .city-tile[aria-pressed='true'] .tile-tick {
        display: grid;
      }
      .city-summary {
        display: flex;
        gap: 6px;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 10px;
      }
      .city-summary strong {
        font: 600 clamp(17px, 1.6vw, 24px) / 1.16 var(--serif);
        letter-spacing: -0.025em;
      }
      .city-summary time {
        font: 500 13px/1.4 var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .city-caption {
        display: block;
        color: var(--soft);
        font-size: 12px;
        line-height: 1.45;
        margin-top: 4px;
      }
      .city-tile:hover .city-summary strong,
      .object-tile:hover .object-title {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      .end-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px solid var(--rule);
        margin-top: 34px;
        padding-top: 9px;
        align-items: center;
        font-size: 12px;
        color: var(--soft);
      }
      .end-line a,
      .end-line button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
      }
      .end-line button .icon {
        width: 15px;
      }
      .collection-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin: 6px 0 24px;
      }
      .collection-head p {
        margin-top: 7px;
        color: var(--soft);
        font-size: 14px;
      }
      .filters {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .search-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding-inline: 11px;
        background: #fffefa;
      }
      .search-label input {
        min-width: 0;
        width: 100%;
        border: 0;
        background: none;
        outline: 0;
        padding: 10px 0;
        font-size: 14px;
        caret-color: var(--green);
      }
      .search-label:focus-within {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      select {
        font-size: 14px;
        background: #fffefa;
        border: 1px solid var(--rule);
        border-radius: 4px;
        min-height: 44px;
        max-width: 100%;
        padding: 7px 24px 7px 10px;
      }
      .object-grid {
        grid-template-columns: repeat(auto-fill, minmax(min(235px, 100%), 1fr));
        row-gap: 25px;
      }
      .object-tile .tile-well {
        height: auto;
        aspect-ratio: 1.27;
      }
      .object-tile .make {
        display: block;
        margin: 10px 0 3px;
        color: var(--soft);
      }
      .object-title {
        display: block;
        font: 500 clamp(19px, 1.8vw, 27px) / 1.16 var(--serif);
        letter-spacing: -0.025em;
        overflow-wrap: anywhere;
      }
      .empty-board,
      .nothing {
        padding: 30px 0;
      }
      .empty-board p,
      .nothing {
        color: var(--soft);
        margin: 12px 0;
      }
      dialog {
        color: var(--ink);
        background: var(--paper);
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 7px;
        max-width: calc(100vw - 26px);
        max-height: calc(100dvh - 30px);
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: #13251ed4;
      }
      .dialog-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 14px 9px 22px;
        border-bottom: 1px solid var(--rule);
      }
      .dialog-top h2 {
        font: 600 22px/1.15 var(--serif);
        letter-spacing: -0.025em;
      }
      #city-chooser {
        width: 470px;
      }
      .chooser-main {
        padding: 16px 20px 18px;
      }
      #suggestions {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        max-height: min(49dvh, 370px);
        overflow: auto;
      }
      #suggestions button {
        width: 100%;
        text-align: left;
        display: flex;
        gap: 9px;
        justify-content: space-between;
        align-items: center;
        padding: 10px 6px;
        min-height: 46px;
        border-bottom: 1px solid var(--rule);
      }
      #suggestions button:hover {
        background: #e7ece2;
      }
      #suggestions small {
        color: var(--soft);
        text-align: right;
      }
      #inspection {
        width: 970px;
      }
      .inspection-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      }
      .inspection-stage {
        min-height: 440px;
        background: #e0e3da;
      }
      .scale-switch {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        border: 1px solid #b4bdb0;
        border-radius: 4px;
        background: var(--paper);
        overflow: hidden;
      }
      .scale-switch button {
        font-size: 12px;
        min-height: 44px;
        padding: 8px 13px;
        white-space: nowrap;
      }
      .scale-switch button[aria-pressed='true'] {
        background: var(--green);
        color: white;
      }
      .inspection-stage .art-slot {
        inset: 10px 12px 64px;
      }
      .inspection-info {
        padding: 25px;
        align-self: center;
        min-width: 0;
      }
      .inspection-info h3 {
        font: 500 clamp(28px, 3.1vw, 44px) / 1.03 var(--serif);
        letter-spacing: -0.035em;
        margin: 5px 0;
      }
      .reference {
        font: 12px/1.5 var(--mono);
        color: var(--soft);
        overflow-wrap: anywhere;
      }
      .observation {
        font-size: 14px;
        line-height: 1.52;
        margin: 16px 0 18px;
        max-width: 50ch;
      }
      .inspection-info .control {
        font-size: 12px;
      }
      .watch-controls {
        padding-top: 13px;
        border-top: 1px solid var(--rule);
        display: grid;
        gap: 10px;
      }
      .zone-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }
      .zone-line label,
      .timer-label {
        font-weight: 600;
        font-size: 13px;
      }
      .zone-line select {
        max-width: 64%;
      }
      .timer-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .timer-label output {
        font: 14px var(--mono);
      }
      #timing {
        display: grid;
        gap: 7px;
      }
      #time-source {
        color: var(--soft);
        font-size: 13px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }
      @media (min-width: 1550px) {
        .hero-stage {
          min-height: 420px;
        }
      }
      @media (max-width: 900px) {
        .mast .frame {
          gap: 18px;
        }
        .tabs {
          margin-left: auto;
        }
        .credit {
          margin-left: 5px;
        }
        .clock-grid {
          grid-template-columns: repeat(auto-fill, minmax(min(156px, 100%), 1fr));
        }
        .city-summary {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .hero-stage {
          min-height: 330px;
        }
        .city-profile {
          padding: 22px;
        }
        .plate-info {
          max-width: 27%;
          left: 12px;
        }
        .collection-head {
          align-items: flex-start;
          flex-direction: column;
        }
        .filters {
          width: 100%;
        }
        .object-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 650px) {
        .mast .frame {
          min-height: 0;
          display: grid;
          grid-template-columns: 1fr auto;
          gap: 0 12px;
        }
        .wordmark {
          min-height: 57px;
        }
        .credit {
          grid-column: 2;
          grid-row: 1;
          font-size: 12px;
        }
        .tabs {
          grid-row: 2;
          grid-column: 1/-1;
          margin: 0;
          gap: 24px;
        }
        .tabs button {
          min-height: 44px;
        }
        .pinboard {
          grid-template-columns: 1fr;
        }
        .hero-stage {
          height: clamp(235px, 65vw, 315px);
          min-height: 0;
        }
        .city-profile {
          padding: 21px;
        }
        .city-profile h1 {
          margin: 7px 0 12px;
          font-size: 44px;
        }
        .time-read {
          font-size: 43px;
        }
        .day-ruler {
          margin: 13px 0 11px;
          max-width: none;
        }
        .section-top {
          flex-wrap: wrap;
          gap: 9px;
        }
        .section-top .actions {
          gap: 4px;
        }
        .section-top .control {
          padding: 7px 9px;
        }
        .clock-grid,
        .object-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px 11px;
        }
        .tile-well {
          height: 128px;
        }
        .object-grid .tile-well {
          aspect-ratio: 1.1;
        }
        .city-summary time {
          font-size: 12px;
        }
        .plate-info {
          max-width: 30%;
          left: 15px;
        }
        .plate-info .object-name {
          font-size: 17px;
        }
        .inspection-grid {
          grid-template-columns: 1fr;
        }
        .inspection-stage {
          min-height: 0;
          height: clamp(225px, 38dvh, 310px);
        }
        .inspection-info {
          padding: 20px;
        }
        .inspection-stage .art-slot {
          inset: 0 10px 46px;
        }
        .scale-switch {
          bottom: 4px;
        }
        .scale-switch button {
          min-height: 44px;
        }
        .end-line {
          flex-wrap: wrap;
        }
        .filters .search-label {
          flex: 1 1 160px;
        }
        .filters select {
          flex: 0 1 auto;
        }
        .collection-head {
          margin-bottom: 17px;
        }
      }
      @media (max-width: 360px) {
        .frame {
          padding-inline: 12px;
        }
        .control {
          padding: 8px 10px;
        }
        .plate-info .make {
          font-size: 8.5px;
        }
        .plate-info .object-name {
          font-size: 14px;
        }
        .section-top h2 {
          font-size: 28px;
        }
        .wordmark svg {
          width: 28px;
          height: 28px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to clocks</a>
    <header class="mast">
      <div class="frame">
        <a class="wordmark" href="../index.html" aria-label="World Clock model directory">
          <svg viewBox="0 0 42 42" fill="none" stroke="currentColor" aria-hidden="true">

        }
        root.hidden = false;
        const t = timerFor(key, city);
        if (lcdKeys.has(key) && !t.lcdMode) {
          root.innerHTML = '<button class="control" id="lcd-toggle">Stopwatch mode</button>';
          return;
        }
        root.innerHTML = `<div class="timer-label"><span>${regatta ? 'Regatta countdown' : lcdKeys.has(key) ? 'Stopwatch' : 'Chronograph'}</span><output id="timer-value"></output></div>
    <div class="actions">${regatta ? `<select id="countdown" aria-label="Countdown minutes" ${t.started !== null || t.bank > 0 ? 'disabled' : ''}>${repeat(10, (i) => `<option value="${i + 1}" ${t.length === i + 1 ? 'selected' : ''}>${i + 1} min</option>`)}</select>` : ''}
    <button class="control" id="timer-toggle" ${regatta && t.bank >= t.length * 60000 ? 'disabled' : ''}>${t.started === null ? (t.bank > 0 ? 'Resume' : 'Start') : 'Stop'}</button>
    <button class="control" id="timer-reset">Reset</button>${lcdKeys.has(key) ? '<button class="control" id="lcd-toggle">Clock mode</button>' : ''}</div>`;
      }
      function readInspection(now) {
        if (!inspection || !inspector.open) return;
        const { key, city } = inspection,
          place = places.get(city),
          p = civil(place.zone, now);
        const source = `${two(p.h)}:${two(p.m)}:${two(p.s)} · ${dateLine(p)} · ${offsetName(p.offset)}`;
        if (byId('time-source').textContent !== source) byId('time-source').textContent = source;
        const output = byId('timer-value');
        if (!output) return;
        const t = timerFor(key, city);
        let ms = elapsed(t);
        if (key === 'yachtmaster2') {
          if (t.started !== null && ms >= t.length * 60000) {
            t.bank = t.length * 60000;
            t.started = null;
            showTimer();
            notice('Regatta countdown complete.');
          }
          ms = Math.max(0, t.length * 60000 - ms);
        }
        const tenths = Math.floor(ms / 100),
          val = `${two(Math.floor(tenths / 600))}:${two(Math.floor(tenths / 10) % 60)}.${tenths % 10}`;
        const current = byId('timer-value');
        if (current.value !== val) current.value = val;
      }
      function assignFace() {
        const { key, city } = inspection,
          row = state.cities.find((r) => r.city === city);
        if (!row) return;
        const conflict = state.cities.find((r) => r.face === key && r.city !== city);
        if (conflict) conflict.face = row.face;
        row.face = key;
        state.selected = city;
        save();
        inspector.close();
        changeView('board', true);
        notice(`${plates[key].title} assigned to ${places.get(city).name}.`);
      }
      byId('feature').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.id === 'change-face') changeOne();
        if (btn.id === 'remove-city') removeCity();
        if (btn.id === 'hero-inspect') {
          const r = selectedRow();
          openInspection(r.face, r.city, btn);
        }
      });
      byId('clock-grid').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-select]');
        if (!btn) return;
        state.selected = btn.dataset.select;
        boardAction();
        [...byId('clock-grid').children]
          .find((n) => n.dataset.select === state.selected)
          ?.focus({ preventScroll: true });
      });
      byId('shuffle-all').addEventListener('click', changeAll);
      byId('add-city').addEventListener('click', openCitySearch);
      byId('city-query').addEventListener('input', suggestions);
      byId('city-query').addEventListener('keydown', (e) => {
        const first = byId('suggestions').querySelector('button');
        if (e.key === 'ArrowDown' && first) {
          e.preventDefault();
          first.focus();
        }
        if (e.key === 'Enter' && first) {
          e.preventDefault();
          addCity(first.dataset.add);
        }
      });
      byId('suggestions').addEventListener('click', (e) => {
        const b = e.target.closest('[data-add]');
        if (b) addCity(b.dataset.add);
      });
      byId('nav-board').addEventListener('click', () => changeView('board'));
      byId('nav-collection').addEventListener('click', () => changeView('collection'));
      byId('other-view').addEventListener('click', () => changeView(view === 'board' ? 'collection' : 'board', true));
      byId('object-search').addEventListener('input', renderCollection);
      byId('category').addEventListener('change', renderCollection);
      byId('clear-filter').addEventListener('click', () => {
        byId('category').selectedIndex = 0;
        byId('object-search').value = '';
        renderCollection();
        byId('object-search').focus();
      });
      byId('object-grid').addEventListener('click', (e) => {
        const b = e.target.closest('[data-inspect]');
        if (b) openInspection(b.dataset.inspect, null, b);
      });
      for (const dialog of [cityChooser, inspector]) {
        dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
        dialog.addEventListener('click', (e) => {
          if (e.target !== dialog) return;
          const r = dialog.getBoundingClientRect();
          if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
        });
        dialog.addEventListener('close', () => {
          if (dialog === inspector) {
            forgetArt(byId('inspection-stage'));
            byId('inspection-stage').replaceChildren();
            inspection = null;
          }
          if (returnFocus?.isConnected && !returnFocus.closest('[hidden]')) returnFocus.focus({ preventScroll: true });
          returnFocus = null;
        });
      }
      inspector.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || !inspection) return;
        const { key, city } = inspection;
        if (b.id === 'hunter-cover') {
          inspection.coverClosed = !inspection.coverClosed;
          showHunterCover();
        }
        if (b.id === 'light-toggle') {
          inspection.light = !inspection.light;
          b.setAttribute('aria-pressed', String(inspection.light));
          setLight(inspector.querySelector('[data-light-surface]'));
        }
        if (b.id === 'lcd-toggle') {
          const t = timerFor(key, city);
          t.lcdMode = !t.lcdMode;
          for (const inst of casesInView)
            if (inst.timer === t) {
              inst.lastSecond = null;
              paintWatch(inst, Date.now());
            }
          showTimer();
          readInspection(Date.now());
          byId('lcd-toggle').focus({ preventScroll: true });
        }
        if (b.dataset.scale) {
          inspection.detail = b.dataset.scale === 'dial';
          byId('inspection-stage')
            .querySelector('.artwork')
            .setAttribute('viewBox', inspectionBounds(key, inspection.detail));
          inspector
            .querySelectorAll('[data-scale]')
            .forEach((btn) => btn.setAttribute('aria-pressed', String(btn === b)));
        }
        if (b.id === 'assign-face') assignFace();
        if (b.id === 'timer-toggle' || b.id === 'timer-reset') {
          const t = timerFor(key, city);
          if (b.id === 'timer-reset') {
            t.bank = 0;
            t.started = null;
          } else if (t.started === null) t.started = performance.now();
          else {
            t.bank = elapsed(t);
            t.started = null;
          }
          showTimer();
          readInspection(Date.now());
          byId(b.id)?.focus({ preventScroll: true });
        }
      });
      inspector.addEventListener('change', (e) => {
        if (!inspection) return;
        if (e.target.id === 'inspect-city') {
          inspection.city = e.target.value;
          renderInspection();
          byId('inspect-city').focus();
        }
        if (e.target.id === 'countdown') {
          timerFor(inspection.key, inspection.city).length = Number(e.target.value);
          readInspection(Date.now());
        }
      });
      let scheduled,
        lastTime = null;
      function advance() {
        clearTimeout(scheduled);
        if (document.hidden) return;
        const now = Date.now(),
          sec = Math.floor(now / 1000),
          minute = Math.floor(sec / 60);
        if (minuteRendered !== minute && view === 'board') {
          const ordered = sortedCities(now);
          const shown = [...byId('clock-grid').children];
          if (ordered.some((r, i) => shown[i]?.dataset.select !== r.city)) renderBoard();
          minuteRendered = minute;
        }
        if (lastTime !== sec) {
          readBoard(now);
          lastTime = sec;
        }
        for (const inst of casesInView) {
          if (inspector.open && !inspector.contains(inst.slot)) continue;
          paintWatch(inst, now);
        }
        readInspection(now);
        scheduled = setTimeout(advance, motionQuery.matches ? 250 : 40);
      }
      document.addEventListener('visibilitychange', advance);
      renderBoard();
      advance();
    </script>
  </body>
</html>
