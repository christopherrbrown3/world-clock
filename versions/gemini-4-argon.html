// Per-card chronograph states
const chronoStates = {};
function getChronoState(id) {
  if (!chronoStates[id]) {
    chronoStates[id] = { running: true, startMs: performance.now() - 38400, elapsedMs: 38400 };
  }
  return chronoStates[id];
}

// Compute live UTC offset in minutes for any IANA timezone
function getUtcOffsetMinutes(tz, dateObj = new Date()) {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hourCycle: 'h23'
    });
    const parts = {};
    for (const p of fmt.formatToParts(dateObj)) {
      parts[p.type] = p.value;
    }
    const asUtc = Date.UTC(
      Number(parts.year),
      Number(parts.month) - 1,
      Number(parts.day),
      Number(parts.hour),
      Number(parts.minute),
      Number(parts.second)
    );
    const utcNow = Date.UTC(
      dateObj.getUTCFullYear(),
      dateObj.getUTCMonth(),
      dateObj.getUTCDate(),
      dateObj.getUTCHours(),
      dateObj.getUTCMinutes(),
      dateObj.getUTCSeconds()
    );
    return Math.round((asUtc - utcNow) / 60000);
  } catch (e) {
    return 0;
  }
}

function formatUtcOffset(mins) {
  const sign = mins >= 0 ? '+' : '-';
  const abs = Math.abs(mins);
  const hh = String(Math.floor(abs / 60)).padStart(2, '0');
  const mm = String(abs % 60).padStart(2, '0');
  return 'UTC' + sign + hh + ':' + mm;
}

// Extract localized time components for a given IANA timezone
function getZonedTimeParts(tz, nowDate = new Date()) {
  try {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz,
      year: 'numeric', month: 'numeric', day: 'numeric',
      weekday: 'short',
      hour: 'numeric', minute: 'numeric', second: 'numeric',
      hourCycle: 'h23'
    });
    const map = {};
    for (const p of fmt.formatToParts(nowDate)) {
      map[p.type] = p.value;
    }
    const wkIdx = Math.max(0, SHORT_DAYS.indexOf((map.weekday || 'TUE').toUpperCase().slice(0, 3)));
    return {
      year: Number(map.year) || 2026,
      month: Number(map.month) || 10,
      day: Number(map.day) || 13,
      weekdayIndex: wkIdx,
      hour24: Number(map.hour) || 0,
      minute: Number(map.minute) || 0,
      second: Number(map.second) || 0,
      ms: nowDate.getMilliseconds()
    };
  } catch (e) {
    return { year: 2026, month: 10, day: 13, weekdayIndex: 2, hour24: 10, minute: 10, second: 30, ms: 0 };
  }
}

// Update any rendered SVG watch face in-place
function updateWatchSvg(svgEl, faceKey, parts, chronoElapsedMs) {
  if (!svgEl || !FACES[faceKey]) return;
  const face = FACES[faceKey];
  const cadence = face.cadence;
  const rawSec = parts.second + parts.ms / 1000;

  let effSec = rawSec;
  let minDeg = (parts.minute + rawSec / 60) * 6;
  let secDeg = rawSec * 6;

  if (cadence === 'tick') {
    effSec = Math.floor(rawSec);
    secDeg = effSec * 6;
    minDeg = (parts.minute + effSec / 60) * 6;
  } else if (cadence === 'sweep') {
    // 28,800 vph (8 steps per second)
    effSec = Math.floor(rawSec * 8) / 8;
    secDeg = effSec * 6;
    minDeg = (parts.minute + effSec / 60) * 6;
  } else if (cadence === 'glide') {
    secDeg = rawSec * 6;
    minDeg = (parts.minute + rawSec / 60) * 6;
  } else if (cadence === 'mondaine') {
    // Swiss Federal Railways stop2go: 58s sweep + 2s pause at 12 o'clock; minute jumps on the minute!
    const clamped = Math.min(58, rawSec);
    secDeg = (clamped / 58) * 360;
    minDeg = parts.minute * 6;
  }

  const hrDeg = ((parts.hour24 % 12) + parts.minute / 60 + effSec / 3600) * 30;
  const gmtDeg = ((parts.hour24 + parts.minute / 60) / 24) * 360;

  // Chronograph angles
  const cSecTotal = (chronoElapsedMs || 0) / 1000;
  const cSec = cadence === 'tick' ? Math.floor(cSecTotal) : Math.floor(cSecTotal * 8) / 8;
  const chronoSecDeg = faceKey === 'elprimero' ? ((cSecTotal % 10) * 36) : ((cSec % 60) * 6);
  const chronoMinDiv = faceKey === 'bigbang' || faceKey === 'richardmille' || faceKey === 'elprimero' ? 60 : (faceKey === 'typexx' ? 15 : 30);
  const chronoMinDeg = (((cSecTotal / 60) % chronoMinDiv) / chronoMinDiv) * 360;
  const chronoHrDeg = (((cSecTotal / 3600) % 12) / 12) * 360;

  // Synodic lunar phase angle
  const synodic = ((parts.day + parts.month * 2.5) % 29.53) / 29.53;
  const moonDeg = synodic * 180 - 45;
  const pointerDateDeg = ((parts.day - 1) / 31) * 360;
  const orlojSunDeg = ((parts.hour24 + parts.minute / 60 - 12) / 24) * 360;
  const orlojMoonDeg = orlojSunDeg + synodic * 360;
  const orlojZodiacDeg = orlojSunDeg + (parts.month * 30 + parts.day) * 0.9856;
  const regattaDeg = -105 + ((parts.minute % 10 + rawSec / 60) / 10) * 210;
  const pendulumDeg = Math.sin(rawSec * Math.PI) * 7.5;
  const balanceDeg = Math.sin(rawSec * Math.PI * 8) * 28;

  const hands = svgEl.querySelectorAll('[data-hand]');
  for (let i = 0; i < hands.length; i++) {
    const el = hands[i];
    const role = el.getAttribute('data-hand');
    const cx = el.getAttribute('data-cx') || '150';
    const cy = el.getAttribute('data-cy') || '150';
    let deg = 0;
    if (role === 'hour') deg = hrDeg;
    else if (role === 'minute') deg = minDeg;
    else if (role === 'second' || role === 'sub-sec') deg = secDeg;
    else if (role === 'chrono-sec') deg = chronoSecDeg;
    else if (role === 'chrono-min') deg = chronoMinDeg;
    else if (role === 'chrono-hr') deg = chronoHrDeg;
    else if (role === 'gmt') deg = gmtDeg;
    else if (role === 'power') deg = Number(el.getAttribute('data-base') || 0);
    else if (role === 'pointer-date') deg = pointerDateDeg;
    else if (role === 'moon-disc') deg = moonDeg;
    else if (role === 'orloj-sun') deg = orlojSunDeg;
    else if (role === 'orloj-moon') deg = orlojMoonDeg;
    else if (role === 'orloj-zodiac') deg = orlojZodiacDeg;
    else if (role === 'regatta') deg = regattaDeg;
    else if (role === 'pendulum') deg = pendulumDeg;
    else if (role === 'balance') deg = balanceDeg;
    el.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' ' + cx + ' ' + cy + ')');
  }

  // Update dynamic apertures & LCD text elements
  const texts = svgEl.querySelectorAll('[data-text]');
  const dateStr = String(parts.day);
  const tensStr = parts.day >= 10 ? String(Math.floor(parts.day / 10)) : (faceKey === 'richardmille' ? '0' : '');
  const onesStr = String(parts.day % 10);
  const dayShort = SHORT_DAYS[parts.weekdayIndex] || 'TUE';
  const day2 = TWO_CHAR_DAYS[parts.weekdayIndex] || 'TU';
  const dayFullDate = (FULL_DAYS[parts.weekdayIndex] || 'TUESDAY') + ' ' + dateStr;
  const monthShort = SHORT_MONTHS[(parts.month - 1) % 12] || 'OCT';
  const monthNum = String(parts.month).padStart(2, '0');
  const mmDd = String(parts.month) + '-' + String(parts.day).padStart(2, '0');
  const hr12 = (parts.hour24 % 12) || 12;
  const lcdHhMm = String(hr12).padStart(2, ' ') + ':' + String(parts.minute).padStart(2, '0');
  const lcdSs = String(parts.second).padStart(2, '0');
  const ampm = parts.hour24 >= 12 ? 'PM' : 'AM';

  for (let i = 0; i < texts.length; i++) {
    const el = texts[i];
    const tRole = el.getAttribute('data-text');
    let val = '';
    if (tRole === 'date') val = dateStr;
    else if (tRole === 'date-tens') val = tensStr;
    else if (tRole === 'date-ones') val = onesStr;
    else if (tRole === 'day-short') val = dayShort;
    else if (tRole === 'day-2') val = day2;
    else if (tRole === 'day-full-date') val = dayFullDate;
    else if (tRole === 'month-short') val = monthShort;
    else if (tRole === 'month-num') val = monthNum;
    else if (tRole === 'mm-dd') val = mmDd;
    else if (tRole === 'lcd-hhmm') val = lcdHhMm;
    else if (tRole === 'lcd-ss' || tRole === 'bigtic-ss') val = lcdSs;
    else if (tRole === 'lcd-ampm') val = ampm;
    if (el.textContent !== val) el.textContent = val;
  }
}

// Application State
let state = {
  cities: [],
  use24h: true,
  lumeMode: false,
  activeTab: 'board',
  catalogCategory: 'all',
  catalogQuery: '',
  loupeKey: 'submariner',
  loupePose: 'live',
  loupeCustomDay: 13,
  loupeCustomWeekday: 2
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.cities) && parsed.cities.length > 0) {
        state.cities = parsed.cities.filter(c => c && c.city && c.tz && FACES[c.face]);
      }
      if (typeof parsed.use24h === 'boolean') state.use24h = parsed.use24h;
      if (typeof parsed.lumeMode === 'boolean') state.lumeMode = parsed.lumeMode;
    }
  } catch (e) {}
  if (!state.cities.length) {
    state.cities = DEFAULT_CITIES.map(c => ({ ...c }));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cities: state.cities,
      use24h: state.use24h,
      lumeMode: state.lumeMode
    }));
  } catch (e) {}
}

// Sort cities West-to-East by current UTC offset, with alphabetical tie-breaker
function sortCitiesWestToEast() {
  const now = new Date();
  state.cities.sort((a, b) => {
    const offA = getUtcOffsetMinutes(a.tz, now);
    const offB = getUtcOffsetMinutes(b.tz, now);
    if (offA !== offB) return offA - offB;
    return a.city.localeCompare(b.city);
  });
}

// Pick a random face not currently in use (unless all 62 are used)
function pickUnusedFace(excludeFace = null) {
  const used = new Set(state.cities.map(c => c.face));
  if (excludeFace) used.add(excludeFace);
  let pool = FACE_KEYS.filter(k => !used.has(k));
  if (!pool.length) {
    pool = FACE_KEYS.filter(k => k !== excludeFace);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function cadenceLabel(cadence) {
  if (cadence === 'sweep') return '28,800 vph Sweep';
  if (cadence === 'glide') return 'Spring Drive Glide';
  if (cadence === 'mondaine') return 'SBB Stop2Go';
  if (cadence === 'digital') return 'Digital LCD';
  return '1 Hz Quartz Tick';
}

function lumeModeType(faceKey) {
  if (faceKey === 'timexindiglo') return 'indiglo';
  if (faceKey === 'grandcentral' || faceKey === 'bigben') return 'amber';
  if ((FACES[faceKey].lumeColor || '').toLowerCase() === '#38e8ff') return 'cyan';
  return 'green';
}

function renderMeridianRibbon() {
  const ribbon = document.getElementById('meridianRibbon');
  const badge = document.getElementById('cityCountBadge');
  badge.textContent = String(state.cities.length);
  const now = new Date();
  let html = '<span style="font-weight:700; color:var(--text-primary);">West → East:</span>';
  state.cities.forEach(c => {
    const mins = getUtcOffsetMinutes(c.tz, now);
    const sign = mins >= 0 ? '+' : '-';
    const hrs = (Math.abs(mins) / 60).toFixed(mins % 60 === 0 ? 0 : 1);
    html += '<span class="meridian-chip">' + c.city + ' <b>' + sign + hrs + 'h</b></span>';
  });
  ribbon.innerHTML = html;
}

function renderBoard() {
  sortCitiesWestToEast();
  renderMeridianRibbon();
  const grid = document.getElementById('clockGrid');
  const localOffset = -new Date().getTimezoneOffset();

  let html = '';
  state.cities.forEach((c, idx) => {
    const face = FACES[c.face] || FACES.submariner;
    const prefix = 'card-' + c.id + '-' + idx;
    const offsetMins = getUtcOffsetMinutes(c.tz);
    const diffHrs = (offsetMins - localOffset) / 60;
    const diffLabel = diffHrs === 0 ? 'Local TZ' : ((diffHrs > 0 ? '+' : '') + (Number.isInteger(diffHrs) ? diffHrs : diffHrs.toFixed(1)) + 'h vs local');

    let optionsHtml = '';
    FACE_KEYS.forEach((k, fIdx) => {
      const sel = k === c.face ? ' selected' : '';
      optionsHtml += '<option value="' + k + '"' + sel + '>' + (fIdx + 1) + '. ' + FACES[k].name + '</option>';
    });

    html += '<article class="clock-card" data-card-id="' + c.id + '" data-face-Lume="' + lumeModeType(c.face) + '">' +
      '<div class="card-top">' +
        '<div>' +
          '<h2 class="city-heading">' + c.city + '</h2>' +
          '<div class="city-sub">' +
            '<span>' + c.country + '</span>' +
            '<span class="utc-pill">' + formatUtcOffset(offsetMins) + '</span>' +
            '<span class="delta-pill">' + diffLabel + '</span>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="icon-btn remove-btn" data-action="remove" data-id="' + c.id + '" title="Remove ' + c.city + '" aria-label="Remove ' + c.city + '">✕</button>' +
      '</div>' +
      '<div class="watch-stage" data-action="loupe" data-face="' + c.face + '" title="Click to inspect ' + face.name + ' in Horological Loupe">' +
        '<svg viewBox="0 0 300 300" aria-label="' + face.name + ' watch face for ' + c.city + '">' + face.svg(prefix) + '</svg>' +
      '</div>' +
      (face.hasChrono ? (
        '<div class="chrono-bar">' +
          '<button type="button" class="chrono-pill-btn" data-action="chrono-toggle" data-id="' + c.id + '">⏱ Start / Stop</button>' +
          '<button type="button" class="chrono-pill-btn" data-action="chrono-reset" data-id="' + c.id + '">↺ Reset</button>' +
        '</div>'
      ) : '') +
      '<div class="telemetry-row">' +
        '<span class="digital-clock" data-role="digital-time">--:--:--</span>' +
        '<span class="date-label" data-role="digital-date">---</span>' +
      '</div>' +
      '<div class="watch-meta-row">' +
        '<span class="watch-title-text" title="' + face.name + '">' + face.name + '</span>' +
        '<span class="cadence-tag">' + cadenceLabel(face.cadence) + '</span>' +
      '</div>' +
      '<div class="card-controls">' +
        '<select class="face-select" data-action="select-face" data-id="' + c.id + '" aria-label="Select watch face for ' + c.city + '">' +
          optionsHtml +
        '</select>' +
        '<button type="button" class="icon-btn" data-action="shuffle-one" data-id="' + c.id + '" title="Shuffle watch face for ' + c.city + '" aria-label="Shuffle watch face for ' + c.city + '">🎲</button>' +
        '<button type="button" class="icon-btn" data-action="loupe" data-face="' + c.face + '" title="Inspect in Loupe" aria-label="Inspect ' + face.name + ' in Loupe">🔍</button>' +
      '</div>' +
    '</article>';
  });

  grid.innerHTML = html;
  tickAllClocks();
}

// Render all 62 watches in the Catalog section
function renderCatalog() {
  const grid = document.getElementById('catalogGrid');
  const q = state.catalogQuery.trim().toLowerCase();
  const cat = state.catalogCategory;

  let html = '';
  FACE_KEYS.forEach((k, idx) => {
    const f = FACES[k];
    if (cat !== 'all' && f.category !== cat) return;
    if (q && !(f.name.toLowerCase().includes(q) || f.maker.toLowerCase().includes(q) || k.toLowerCase().includes(q) || f.blurb.toLowerCase().includes(q))) {
      return;
    }
    const prefix = 'cat-' + k;
    html += '<div class="catalog-card" data-cat-face="' + k + '" data-face-Lume="' + lumeModeType(k) + '" role="button" tabindex="0" aria-label="Inspect ' + f.name + '">' +
      '<div style="width:100%; display:flex; justify-content:space-between; align-items:center;">' +
        '<span class="cat-index">#' + String(idx + 1).padStart(2, '0') + ' · ' + k + '</span>' +
        '<span class="cadence-tag">' + f.cadence + '</span>' +
      '</div>' +
      '<svg viewBox="0 0 300 300">' + f.svg(prefix) + '</svg>' +
      '<div class="cat-name">' + f.name + '</div>' +
      '<p class="cat-blurb">' + f.blurb + '</p>' +
    '</div>';
  });
  grid.innerHTML = html;
  tickAllClocks();
}

// Open Horological Loupe Modal
function openLoupe(faceKey) {
  if (!FACES[faceKey]) return;
  state.loupeKey = faceKey;
  const f = FACES[faceKey];
  const idx = FACE_KEYS.indexOf(faceKey);
  document.getElementById('loupeMakerBadge').textContent = '#' + (idx + 1) + ' · ' + f.maker + ' · ' + cadenceLabel(f.cadence);
  document.getElementById('loupeTitle').textContent = f.name;
  document.getElementById('loupeRefLine').textContent = f.ref + '  |  Key: ' + faceKey + '  |  Category: ' + f.category;
  document.getElementById('loupeBlurb').textContent = f.blurb;
  const holder = document.getElementById('loupeSvgHolder');
  holder.setAttribute('data-face-Lume', lumeModeType(faceKey));
  holder.innerHTML = '<svg viewBox="0 0 300 300" id="loupeActiveSvg">' + f.svg('loupe-' + faceKey) + '</svg>';
  document.getElementById('loupeBackdrop').classList.add('open');
  tickAllClocks();
}

function closeLoupe() {
  document.getElementById('loupeBackdrop').classList.remove('open');
}

// Master animation loop updating active cards, catalog view, and loupe
function tickAllClocks() {
  const now = new Date();
  const perfNow = performance.now();

  // 1. Update World Clock Board cards
  const cards = document.querySelectorAll('#clockGrid .clock-card');
  for (let i = 0; i < cards.length; i++) {
    const cardEl = cards[i];
    const id = cardEl.getAttribute('data-card-id');
    const cityObj = state.cities.find(c => c.id === id);
    if (!cityObj) continue;

    const parts = getZonedTimeParts(cityObj.tz, now);
    const svgEl = cardEl.querySelector('svg');
    const cState = getChronoState(id);
    const cElapsed = cState.running ? (cState.elapsedMs + (perfNow - cState.startMs)) : cState.elapsedMs;
    updateWatchSvg(svgEl, cityObj.face, parts, cElapsed);

    const digTimeEl = cardEl.querySelector('[data-role="digital-time"]');
    const digDateEl = cardEl.querySelector('[data-role="digital-date"]');
    if (digTimeEl) {
      if (state.use24h) {
        digTimeEl.textContent = String(parts.hour24).padStart(2, '0') + ':' + String(parts.minute).padStart(2, '0') + ':' + String(parts.second).padStart(2, '0');
      } else {
        const h12 = (parts.hour24 % 12) || 12;
        const ap = parts.hour24 >= 12 ? ' PM' : ' AM';
        digTimeEl.textContent = String(h12).padStart(2, '0') + ':' + String(parts.minute).padStart(2, '0') + ':' + String(parts.second).padStart(2, '0') + ap;
      }
    }
    if (digDateEl) {
      const solarIcon = (parts.hour24 >= 6 && parts.hour24 < 19) ? '☀' : '☾';
      digDateEl.textContent = solarIcon + ' ' + SHORT_DAYS[parts.weekdayIndex] + ', ' + SHORT_MONTHS[(parts.month - 1) % 12] + ' ' + parts.day;
    }
  }

  // 2. Update Catalog cards if visible
  if (state.activeTab === 'catalog') {
    const localParts = getZonedTimeParts(Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC', now);
    const catCards = document.querySelectorAll('#catalogGrid .catalog-card');
    for (let i = 0; i < catCards.length; i++) {
      const el = catCards[i];
      const fKey = el.getAttribute('data-cat-face');
      const svgEl = el.querySelector('svg');
      updateWatchSvg(svgEl, fKey, localParts, perfNow);
    }
  }

  // 3. Update Loupe modal if open
  const loupeSvg = document.getElementById('loupeActiveSvg');
  if (loupeSvg && document.getElementById('loupeBackdrop').classList.contains('open')) {
    let lParts;
    if (state.loupePose === 'live') {
      lParts = getZonedTimeParts(Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC', now);
      lParts.day = state.loupeCustomDay;
      lParts.weekdayIndex = state.loupeCustomWeekday;
    } else {
      const [hh, mm, ss] = state.loupePose.split(':').map(Number);
      lParts = {
        year: 2026,
        month: 10,
        day: state.loupeCustomDay,
        weekdayIndex: state.loupeCustomWeekday,
        hour24: hh,
        minute: mm,
        second: ss,
        ms: 0
      };
    }
    const lcState = getChronoState('loupe');
    const lcElapsed = lcState.running ? (lcState.elapsedMs + (perfNow - lcState.startMs)) : lcState.elapsedMs;
    updateWatchSvg(loupeSvg, state.loupeKey, lParts, lcElapsed);
  }
}

// City Search & Autocomplete Logic
let currentMatches = [];
let highlightedIdx = -1;

function updateSuggestions() {
  const input = document.getElementById('citySearchInput');
  const box = document.getElementById('citySuggestions');
  const q = input.value.trim().toLowerCase();

  if (!q) {
    box.classList.remove('open');
    currentMatches = [];
    highlightedIdx = -1;
    return;
  }

  currentMatches = WORLD_ATLAS.filter(item =>
    item.city.toLowerCase().includes(q) ||
    item.country.toLowerCase().includes(q) ||
    item.tz.toLowerCase().includes(q) ||
    item.region.toLowerCase().includes(q)
  ).slice(0, 12);

  if (!currentMatches.length) {
    box.classList.remove('open');
    return;
  }

  highlightedIdx = 0;
  renderSuggestionItems();
  box.classList.add('open');
}

function renderSuggestionItems() {
  const box = document.getElementById('citySuggestions');
  const now = new Date();
  box.innerHTML = currentMatches.map((m, idx) => {
    const off = formatUtcOffset(getUtcOffsetMinutes(m.tz, now));
    const cls = idx === highlightedIdx ? 'suggestion-item highlighted' : 'suggestion-item';
    return '<button type="button" class="' + cls + '" data-sugg-idx="' + idx + '" role="option">' +
      '<span><b>' + m.city + '</b>, ' + m.country + '</span>' +
      '<span class="suggestion-meta">' + m.region + ' · ' + off + '</span>' +
    '</button>';
  }).join('');
}

function addCityFromAtlas(atlasEntry) {
  if (!atlasEntry) return;
  const newCity = {
    id: 'c-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    city: atlasEntry.city,
    country: atlasEntry.country,
    tz: atlasEntry.tz,
    face: pickUnusedFace()
  };
  state.cities.push(newCity);
  saveState();
  renderBoard();
  const input = document.getElementById('citySearchInput');
  input.value = '';
  document.getElementById('citySuggestions').classList.remove('open');
}

// Event Listeners
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  document.body.classList.toggle('lume-mode', state.lumeMode);
  document.getElementById('lumeToggleBtn').classList.toggle('active-toggle', state.lumeMode);
  document.getElementById('formatToggleBtn').textContent = state.use24h ? '24H' : '12H';

  renderBoard();

  // Tab switching
  document.getElementById('tabBoardBtn').addEventListener('click', () => {
    state.activeTab = 'board';
    document.getElementById('tabBoardBtn').classList.add('active');
    document.getElementById('tabCatalogBtn').classList.remove('active');
    document.getElementById('boardSection').classList.remove('hidden');
    document.getElementById('catalogSection').classList.remove('active');
  });

  document.getElementById('tabCatalogBtn').addEventListener('click', () => {
    state.activeTab = 'catalog';
    document.getElementById('tabCatalogBtn').classList.add('active');
    document.getElementById('tabBoardBtn').classList.remove('active');
    document.getElementById('boardSection').classList.add('hidden');
    document.getElementById('catalogSection').classList.add('active');
    renderCatalog();
  });

  // Shuffle All Faces without duplicates while unused faces remain
  document.getElementById('shuffleAllBtn').addEventListener('click', () => {
    const pool = [...FACE_KEYS];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.cities.forEach((c, idx) => {
      c.face = pool[idx % pool.length];
    });
    saveState();
    renderBoard();
  });

  // Lume Mode toggle
  document.getElementById('lumeToggleBtn').addEventListener('click', () => {
    state.lumeMode = !state.lumeMode;
    document.body.classList.toggle('lume-mode', state.lumeMode);
    document.getElementById('lumeToggleBtn').classList.toggle('active-toggle', state.lumeMode);
    saveState();
  });

  // 12H / 24H toggle
  document.getElementById('formatToggleBtn').addEventListener('click', () => {
    state.use24h = !state.use24h;
    document.getElementById('formatToggleBtn').textContent = state.use24h ? '24H' : '12H';
    saveState();
    tickAllClocks();
  });

  // Search input & keyboard navigation
  const searchInput = document.getElementById('citySearchInput');
  searchInput.addEventListener('input', updateSuggestions);
  searchInput.addEventListener('keydown', (e) => {
    if (!currentMatches.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlightedIdx = (highlightedIdx + 1) % currentMatches.length;
      renderSuggestionItems();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightedIdx = (highlightedIdx - 1 + currentMatches.length) % currentMatches.length;
      renderSuggestionItems();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      addCityFromAtlas(currentMatches[Math.max(0, highlightedIdx)]);
    } else if (e.key === 'Escape') {
      document.getElementById('citySuggestions').classList.remove('open');
    }
  });

  document.getElementById('addSelectedCityBtn').addEventListener('click', () => {
    if (currentMatches.length > 0) {
      addCityFromAtlas(currentMatches[Math.max(0, highlightedIdx)]);
    } else {
      const q = searchInput.value.trim().toLowerCase();
      const found = WORLD_ATLAS.find(m => m.city.toLowerCase().includes(q));
      if (found) addCityFromAtlas(found);
    }
  });

  document.getElementById('citySuggestions').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-sugg-idx]');
    if (btn) {
      const idx = Number(btn.getAttribute('data-sugg-idx'));
      addCityFromAtlas(currentMatches[idx]);
    }
  });

  // Delegated actions on World Clock Grid
  document.getElementById('clockGrid').addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.getAttribute('data-action');
    const id = target.getAttribute('data-id');

    if (action === 'remove') {
      state.cities = state.cities.filter(c => c.id !== id);
      saveState();
      renderBoard();
    } else if (action === 'shuffle-one') {
      const cityObj = state.cities.find(c => c.id === id);
      if (cityObj) {
        cityObj.face = pickUnusedFace(cityObj.face);
        saveState();
        renderBoard();
      }
    } else if (action === 'loupe') {
      const faceKey = target.getAttribute('data-face');
      openLoupe(faceKey);
    } else if (action === 'chrono-toggle') {
      const cs = getChronoState(id);
      if (cs.running) {
        cs.elapsedMs += performance.now() - cs.startMs;
        cs.running = false;
      } else {
        cs.startMs = performance.now();
        cs.running = true;
      }
    } else if (action === 'chrono-reset') {
      chronoStates[id] = { running: false, startMs: performance.now(), elapsedMs: 0 };
      tickAllClocks();
    }
  });

  document.getElementById('clockGrid').addEventListener('change', (e) => {
    const sel = e.target.closest('[data-action="select-face"]');
    if (!sel) return;
    const id = sel.getAttribute('data-id');
    const cityObj = state.cities.find(c => c.id === id);
    if (cityObj && FACES[sel.value]) {
      cityObj.face = sel.value;
      saveState();
      renderBoard();
    }
  });

  // Catalog filter & search
  document.getElementById('categoryFilterBar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    state.catalogCategory = btn.getAttribute('data-cat');
    document.querySelectorAll('#categoryFilterBar .filter-chip').forEach(b => b.classList.toggle('active', b === btn));
    renderCatalog();
  });

  document.getElementById('catalogSearchInput').addEventListener('input', (e) => {
    state.catalogQuery = e.target.value;
    renderCatalog();
  });

  document.getElementById('catalogGrid').addEventListener('click', (e) => {
    const card = e.target.closest('[data-cat-face]');
    if (card) openLoupe(card.getAttribute('data-cat-face'));
  });

  // Loupe modal controls
  document.getElementById('loupeCloseBtn').addEventListener('click', closeLoupe);
  document.getElementById('loupeBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'loupeBackdrop') closeLoupe();
  });

  document.getElementById('loupePrevBtn').addEventListener('click', () => {
    const i = FACE_KEYS.indexOf(state.loupeKey);
    openLoupe(FACE_KEYS[(i - 1 + FACE_KEYS.length) % FACE_KEYS.length]);
  });

  document.getElementById('loupeNextBtn').addEventListener('click', () => {
    const i = FACE_KEYS.indexOf(state.loupeKey);
    openLoupe(FACE_KEYS[(i + 1) % FACE_KEYS.length]);
  });

  document.getElementById('loupeChronoToggleBtn').addEventListener('click', () => {
    const cs = getChronoState('loupe');
    if (cs.running) {
      cs.elapsedMs += performance.now() - cs.startMs;
      cs.running = false;
    } else {
      cs.startMs = performance.now();
      cs.running = true;
    }
  });

  document.getElementById('loupeChronoResetBtn').addEventListener('click', () => {
    chronoStates['loupe'] = { running: false, startMs: performance.now(), elapsedMs: 0 };
    tickAllClocks();
  });

  document.getElementById('loupePoseBar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-pose]');
    if (!btn) return;
    state.loupePose = btn.getAttribute('data-pose');
    document.querySelectorAll('#loupePoseBar .pose-btn').forEach(b => b.classList.toggle('active', b === btn));
    tickAllClocks();
  });

  document.getElementById('loupeDateRange').addEventListener('input', (e) => {
    state.loupeCustomDay = Number(e.target.value);
    document.getElementById('loupeDateVal').textContent = String(state.loupeCustomDay);
    tickAllClocks();
  });

  document.getElementById('loupeDayRange').addEventListener('input', (e) => {
    state.loupeCustomWeekday = Number(e.target.value);
    document.getElementById('loupeDayVal').textContent = SHORT_DAYS[state.loupeCustomWeekday];
    tickAllClocks();
  });

  document.getElementById('loupeAssignBtn').addEventListener('click', () => {
    if (state.cities.length > 0) {
      state.cities[0].face = state.loupeKey;
      saveState();
      renderBoard();
      closeLoupe();
    }
  });

  // High-frame-rate animation loop (respects reduced motion)
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    setInterval(tickAllClocks, 1000);
  } else {
    function loop() {
      tickAllClocks();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
});
  </script>
