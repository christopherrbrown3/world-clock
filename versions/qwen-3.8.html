<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock · Qwen 3.8:27b</title>
<meta name="description" content="Sixty-two watch and clock faces rendered as live SVG world clocks. An independent from-scratch rendition by Qwen 3.8:27b.">
<meta name="theme-color" content="#0d1512">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1512'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%235fd0a8' stroke-width='3'/%3E%3Cpath d='M32 17V32L43 39' fill='none' stroke='%235fd0a8' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1512; --bg2:#0a100e; --panel:#131e1a; --panel2:#182620;
  --line:#26362f; --line2:#33473d; --ink:#e9f2ec; --muted:#8fa79b;
  --accent:#5fd0a8; --accent2:#3aa883; --gold:#d8b877; --danger:#e07a6a;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#122019 0%,var(--bg) 55%,var(--bg2) 100%);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
::selection{background:var(--accent);color:#04120c}
.skip{position:fixed;top:8px;left:12px;background:var(--accent);color:#04120c;padding:10px 14px;border-radius:8px;z-index:20;transform:translateY(-160%);transition:transform .2s}
.skip:focus{transform:none}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:14px 22px;background:rgba(13,21,18,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.02em;font-size:17px}
.brand svg{width:30px;height:30px;color:var(--accent)}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:.02em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.utc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
.utc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
main{max-width:1280px;margin:0 auto;padding:22px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1 1 260px;min-width:220px}
.search input{width:100%;padding:11px 14px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(95,208,168,.15)}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;overflow:hidden;z-index:15;box-shadow:0 12px 30px rgba(0,0,0,.5);max-height:320px;overflow-y:auto}
.suggest li{list-style:none;padding:9px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.suggest li:last-child{border-bottom:none}
.suggest li:hover,.suggest li[aria-selected="true"]{background:var(--panel)}
.suggest .off{font-family:var(--mono);color:var(--muted);font-size:11px}
.suggest .none{color:var(--muted);cursor:default}
.btn{padding:10px 15px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);background:var(--panel2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent2);border-color:var(--accent);color:#04120c;font-weight:600}
.summary{font-size:12px;color:var(--muted);margin:0 0 16px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.city{font-size:15px;font-weight:600;letter-spacing:-.01em}
.where{font-size:11px;color:var(--muted)}
.card-actions{display:flex;gap:4px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
.well{aspect-ratio:1/1;background:radial-gradient(circle at 50% 40%,#0f1a15 0%,#080d0b 100%);border-radius:10px;display:grid;place-items:center;overflow:hidden;position:relative}
.well svg{width:100%;height:100%;display:block}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.facename{font-size:11px;color:var(--muted);line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout{font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.readout .sec{color:var(--accent)}
.delta{font-size:10.5px;color:var(--muted);text-align:right;margin-top:2px}
.delta b{color:var(--ink);font-weight:600}
.phase{position:absolute;top:8px;left:8px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid var(--line2);color:var(--muted)}
.phase[data-p="dawn"]{color:#f0c987;border-color:#5a4a2a}
.phase[data-p="day"]{color:#8fd0f0;border-color:#2a4a5a}
.phase[data-p="dusk"]{color:#e09a7a;border-color:#5a3a2a}
.phase[data-p="night"]{color:#9aa8e0;border-color:#2a2a5a}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty button{margin-top:14px}
footer{max-width:1280px;margin:0 auto;padding:24px 22px 40px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{padding:10px}
  .header-right .utc{display:none}
  main{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<header>
  <a class="brand" href="#" aria-label="World Clock home">
    <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="20" cy="20" r="17"/><ellipse cx="20" cy="20" rx="7.5" ry="17"/><path d="M3 20h34M6 11h28M6 29h28"/></svg>
    <span>World Clock<small>Qwen 3.8:27b · 62 faces</small></span>
  </a>
  <div class="header-right">
    <div class="utc"><span>UTC</span><time id="utc">—</time></div>
  </div>
</header>
<main>
  <div class="controls">
    <div class="search">
      <input id="city-input" type="text" role="combobox" aria-expanded="false" aria-controls="city-list" aria-autocomplete="list" placeholder="Add a city — search by name, country, or zone" autocomplete="off">
      <ul id="city-list" class="suggest" role="listbox" hidden></ul>
    </div>
    <button class="btn" id="shuffle-all" type="button" title="Shuffle every face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle all</button>
    <button class="btn" id="reset" type="button" title="Restore the eight starting cities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>Reset</button>
  </div>
  <p class="summary" id="summary">0 cities · 62 faces</p>
  <div class="grid" id="board"></div>
  <div class="empty" id="empty" hidden><p>No cities on the board.</p><button class="btn primary" id="restore" type="button">Add the default cities</button></div>
</main>
<footer>
  <span>Drawn in SVG. Driven by your browser's clock. An independent rendition by Qwen 3.8:27b.</span>
  <span>62 faces · one shared brief</span>
</footer>
<script>
"use strict";
/* =========================================================================
   Qwen 3.8:27b — World Clock
   An independent, from-scratch rendition. Own time engine, city atlas,
   SVG drawing kit, and all 62 catalog faces. No other model's page is
   reused, extended, or adapted.
   ========================================================================= */

/* ---- Time engine ------------------------------------------------------- */
const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const WD_FULL = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
const MO = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MO_FULL = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const _fmt = new Map();
function fmt(zone){
  let f = _fmt.get(zone);
  if(!f){
    f = new Intl.DateTimeFormat("en-US",{timeZone:zone,hour12:false,weekday:"short",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric",timeZoneName:"shortOffset"});
    _fmt.set(zone,f);
  }
  return f;
}
function offsetOf(text){
  const m = /GMT([+-])(\d{1,2})(?::(\d{2}))?/.exec(text||"");
  if(!m) return 0;
  return (m[1]==="-"?-1:1)*(Number(m[2])*60+Number(m[3]||0));
}
/* Mean synodic phase 0..1 (0 new, .5 full) from a UTC instant. */
function moonPhase(d){
  const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  const days = (d.getTime()-ref)/86400000;
  return ((days/syn)%1+1)%1;
}
/* A local-time snapshot for a zone, shaped by the face cadence. */
function snap(date, zone, cadence="sweep"){
  const f = fmt(zone), parts = {};
  for(const p of f.formatToParts(date)) parts[p.type]=p.value;
  const h = Number(parts.hour)%24, m = Number(parts.minute), sW = Number(parts.second), ms = date.getMilliseconds();
  const raw = sW + ms/1000;
  let s = raw;
  if(cadence==="sweep") s = Math.floor(raw*8)/8;
  else if(cadence==="tick"||cadence==="digital") s = sW;
  else if(cadence==="mondaine") s = raw>=58 ? 60 : raw*60/58;
  const weekday = WD.indexOf(parts.weekday.slice(0,3).toUpperCase());
  const mFrac = (cadence==="mondaine"||cadence==="tick"||cadence==="digital") ? 0 : s/60;
  return {
    zone, h, h12: h%12===0?12:h%12, m, s, sW, ms,
    date: Number(parts.day), month: Number(parts.month), year: Number(parts.year), weekday,
    offset: offsetOf(parts.timeZoneName), offsetText: parts.timeZoneName,
    pm: h>=12, moon: moonPhase(date),
    aH: ((h%12)+m/60+s/3600)*30,
    aM: (m+mFrac)*6,
    aS: s*6,
    aH24: (h+m/60+s/3600)*15
  };
}

/* ---- Text + hand bindings --------------------------------------------- */
const TEXT = {
  date:(t)=>String(t.date),
  date2:(t)=>String(t.date).padStart(2,"0"),
  day3:(t)=>WD[t.weekday],
  day3c:(t)=>WD[t.weekday][0]+WD[t.weekday].slice(1).toLowerCase(),
  day2:(t)=>WD[t.weekday].slice(0,2),
  day1:(t)=>WD[t.weekday][0],
  dayfull:(t)=>WD_FULL[t.weekday],
  month3:(t)=>MO[t.month-1],
  monthfull:(t)=>MO_FULL[t.month-1],
  monthnum:(t)=>String(t.month),
  monthnum2:(t)=>String(t.month).padStart(2,"0"),
  year:(t)=>String(t.year),
  hh:(t)=>String(t.h12),
  hh2:(t)=>String(t.h12).padStart(2,"0"),
  hh24:(t)=>String(t.h).padStart(2,"0"),
  mm:(t)=>String(t.m).padStart(2,"0"),
  ss:(t)=>String(t.sW).padStart(2,"0"),
  ampm:(t)=>t.pm?"PM":"AM",
  am:(t)=>t.pm?"":"AM",
  pm:(t)=>t.pm?"PM":"",
  "hh:mm":(t)=>`${t.h12}:${String(t.m).padStart(2,"0")}`,
  "hh24:mm":(t)=>`${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}`,
  "mo-dd":(t)=>`${t.month}-${String(t.date).padStart(2,"0")}`,
  "mo/dd":(t)=>`${t.month}/${t.date}`
};
const HAND = {
  h:(t)=>t.aH, m:(t)=>t.aM, s:(t)=>t.aS,
  h24:(t)=>t.aH24, h24top:(t)=>t.aH24+180, gmt:(t)=>t.aH24,
  date:(t)=>(t.date-1)*360/31, datehand:(t)=>t.date*360/31,
  weekday:(t)=>t.weekday*360/7, month:(t)=>(t.month-1)*30,
  moon:(t)=>t.moon*360, msec:(t)=>(t.ms/1000)*360,
  min5:(t)=>(t.m%5+t.s/60)*72,
  hshadow:(t)=>t.aH, mshadow:(t)=>t.aM
};
function applyBindings(svg, t){
  for(const el of svg.querySelectorAll("[data-hand]")){
    const fn = HAND[el.getAttribute("data-hand")];
    if(!fn) continue;
    const piv = (el.getAttribute("data-pivot")||"50 50").split(/[\s,]+/).map(Number);
    let a = fn(t);
    const off = el.getAttribute("data-offset"); if(off) a += Number(off);
    const sc = el.getAttribute("data-scale"); if(sc) a *= Number(sc);
    el.setAttribute("transform", `translate(${piv[0]} ${piv[1]}) rotate(${a.toFixed(3)})`);
  }
  for(const el of svg.querySelectorAll("[data-text]")){
    const fn = TEXT[el.getAttribute("data-text")];
    if(!fn) continue;
    const v = fn(t);
    if(el.textContent !== v) el.textContent = v;
  }
  for(const el of svg.querySelectorAll("[data-show]")){
    const c = el.getAttribute("data-show");
    let on = true;
    if(c==="pm") on = t.pm;
    else if(c==="am") on = !t.pm;
    else if(c==="night") on = t.h<6||t.h>=18;
    else if(c==="day") on = t.h>=6&&t.h<18;
    else if(c==="blink") on = t.ms<500;
    else if(c==="date2digit") on = t.date>=10;
    else if(c==="date1digit") on = t.date<10;
    el.style.visibility = on ? "visible" : "hidden";
  }
}

/* ---- SVG drawing kit --------------------------------------------------- */
let _uid = 0;
function kit(){
  const pre = `q${(_uid++).toString(36)}_`;
  const n = (v)=> (Math.round(v*1000)/1000).toString();
  const pt = (deg,r,cx=50,cy=50)=>{ const a=(deg-90)*Math.PI/180; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  const P = (deg,r,cx=50,cy=50)=>{ const [x,y]=pt(deg,r,cx,cy); return `${n(x)} ${n(y)}`; };
  const esc = (s)=> String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const A = (o)=> Object.entries(o).filter(([,v])=>v!==undefined&&v!==null&&v!=="").map(([k,v])=>` ${k}="${esc(v)}"`).join("");
  const K = {
    pre, n, pt, P, esc, A,
    id:(x)=>pre+x, url:(x)=>`url(#${pre}${x})`, ref:(x)=>`#${pre}${x}`,
    linear(name,{a=90,stops=[],x1,y1,x2,y2,units}={}){
      let c;
      if(x1!==undefined) c=` x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"`;
      else { const rad=(a-90)*Math.PI/180, dx=Math.cos(rad)*.5, dy=Math.sin(rad)*.5; c=` x1="${n(.5-dx)}" y1="${n(.5-dy)}" x2="${n(.5+dx)}" y2="${n(.5+dy)}"`; }
      return `<linearGradient id="${pre}${name}"${c}${units?` gradientUnits="${units}"`:""}>${stops.map(([o,col,op])=>`<stop offset="${o}" stop-color="${col}"${op!==undefined?` stop-opacity="${op}"`:""}/>`).join("")}</linearGradient>`;
    },
    radial(name,{cx=.5,cy=.5,r=.5,fx,fy,stops=[],units}={}){
      return `<radialGradient id="${pre}${name}" cx="${cx}" cy="${cy}" r="${r}"${fx!==undefined?` fx="${fx}" fy="${fy}"`:""}${units?` gradientUnits="${units}"`:""}>${stops.map(([o,col,op])=>`<stop offset="${o}" stop-color="${col}"${op!==undefined?` stop-opacity="${op}"`:""}/>`).join("")}</radialGradient>`;
    },
    ticks({count=60,r1=40,r2=43,w=.5,color="#fff",cx=50,cy=50,skip,start=0,cap="butt",opacity}={}){
      let o="";
      for(let i=0;i<count;i++){
        if(skip&&skip(i)) continue;
        const a=start+i*360/count, [ax,ay]=pt(a,r1,cx,cy), [bx,by]=pt(a,r2,cx,cy);
        o+=`<line x1="${n(ax)}" y1="${n(ay)}" x2="${n(bx)}" y2="${n(by)}" stroke="${color}" stroke-width="${w}" stroke-linecap="${cap}"${opacity!==undefined?` opacity="${opacity}"`:""}/>`;
      }
      return o;
    },
    text(x,y,str,{size=4,family="var(--font)",weight=400,color="#fff",anchor="middle",letter,transform,opacity,italic,baseline="central",cls,data}={}){
      return `<text x="${n(x)}" y="${n(y)}" font-size="${size}" font-family="${esc(family)}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}" dominant-baseline="${baseline}"${letter!==undefined?` letter-spacing="${letter}"`:""}${italic?' font-style="italic"':""}${transform?` transform="${transform}"`:""}${opacity!==undefined?` opacity="${opacity}"`:""}${cls?` class="${cls}"`:""}${data?A(data):""}>${esc(str)}</text>`;
    },
    numerals({count=12,r=30,size=6,family="var(--font)",weight=500,color="#fff",labels,upright=true,start=30,step,cx=50,cy=50,skip,letter,italic,offsetY=0}={}){
      let o="";
      const st = step!==undefined?step:360/count;
      for(let i=0;i<count;i++){
        if(skip&&skip(i)) continue;
        const label = labels?labels[i]:String(i+1);
        if(label===""||label==null) continue;
        const a=start+i*st, [x,y]=pt(a,r,cx,cy);
        o+=K.text(x,y+offsetY,label,{size,family,weight,color,letter,italic,transform:upright?undefined:`rotate(${n(a)} ${n(x)} ${n(y)})`});
      }
      return o;
    },
    hand(kind,d,{cx=50,cy=50,fill="#fff",stroke,sw,extra="",pivot=true}={}){
      const piv = pivot&&(cx!==50||cy!==50)?` data-pivot="${n(cx)} ${n(cy)}"`:"";
      return `<g data-hand="${kind}"${piv} transform="translate(${n(cx)} ${n(cy)})"><path d="${d}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${sw||.3}"`:""}${extra?" "+extra:""}/></g>`;
    },
    handG(kind,inner,{cx=50,cy=50}={}){
      const piv = cx!==50||cy!==50?` data-pivot="${n(cx)} ${n(cy)}"`:"";
      return `<g data-hand="${kind}"${piv} transform="translate(${n(cx)} ${n(cy)})">${inner}</g>`;
    },
    circle(cx,cy,r,o={}){ return `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}"${A(o)}/>`; },
    rect(x,y,w,h,o={}){ return `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"${A(o)}/>`; },
    path(d,o={}){ return `<path d="${d}"${A(o)}/>`; },
    line(x1,y1,x2,y2,o={}){ return `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}"${A(o)}/>`; },
    g(inner,o={}){ return `<g${A(o)}>${inner}</g>`; },
    /* Standard sweep-seconds needle with counterweight. */
    needle(kind,{len=40,tail=9,w=.7,color="#fff",cx=50,cy=50,cap=1.6,capColor,tailW}={}){
      return K.handG(kind,`<path d="M${n(-w/2)} ${n(tail)} L${n(-w/2)} ${n(-len)} L${n(w/2)} ${n(-len)} L${n(w/2)} ${n(tail)} Z" fill="${color}"/>${tailW?`<rect x="${n(-tailW/2)}" y="${n(tail*.35)}" width="${n(tailW)}" height="${n(tail*.65)}" fill="${color}"/>`:""}<circle r="${cap}" fill="${capColor||color}"/>`,{cx,cy});
    },
    /* Date window frame + bound date text. */
    dateWin(x,y,w,h,{fill="#f5f3ea",color="#111",size=4.2,family="var(--font)",weight=600,frame,frameW=.5,rx=.4,pad=false,letter}={}){
      return K.rect(x,y,w,h,{fill,rx,stroke:frame,strokeWidth:frameW}) +
        K.text(x+w/2,y+h/2+.1,"31",{size,family,weight,color,letter,data:{"data-text":pad?"date2":"date"}});
    },
    /* Moonphase disc: a rotating disc with a lit crescent. */
    moonDisc(cx,cy,r){
      const id = K.id("moon");
      return `<defs>${K.radial(id,{stops:[[0,"#1a2740"],[.7,"#0d1526"],[1,"#050a14"]]})}</defs>`+
        K.circle(cx,cy,r,{fill:K.url(id),stroke:"#3a4a6a",strokeWidth:.4})+
        K.handG("moon",`<circle cx="0" cy="${n(-r*.55)}" r="${n(r*.42)}" fill="#f4e9c8"/>`,{cx,cy});
    }
  };
  return K;
}

/* ---- Face registry ----------------------------------------------------- */
const FACES = {};
const CAD = new Set(["sweep","tick","glide","digital","mondaine"]);
function face(key, spec){
  if(FACES[key]) throw new Error(`duplicate face ${key}`);
  if(!spec||typeof spec.draw!=="function") throw new Error(`face ${key} has no draw()`);
  if(!CAD.has(spec.cadence)) throw new Error(`face ${key} bad cadence ${spec.cadence}`);
  FACES[key] = Object.assign({key, viewBox:"0 0 100 100"}, spec);
}

/* ---- Shared face helpers ---------------------------------------------- */
/* A round case with a bezel ring and a dial. Returns the static dial layer. */
function roundCase(K, {r=46, bezel=4, caseColor="#c9ced3", bezelColor="#dfe3e7", dial="#111", dialGrad, rehaut, lugs=true, crown=true, pushers=false}={}){
  let s = "";
  s += K.radial("case",{stops:[[0,caseColor],[.55,caseColor],[.75,"#8a9096"],[1,"#5a6066"]]});
  s += K.circle(50,50,r,{fill:K.url("case")});
  if(lugs){
    for(const a of [35,145,215,325]){
      const [x,y]=K.pt(a,r-2);
      s += K.rect(x-3,y-3,6,6,{rx:1.5,fill:caseColor,stroke:"#5a6066",strokeWidth:.3,transform:`rotate(${a} ${n(x)} ${n(y)})`});
    }
  }
  if(crown) s += K.rect(94,47,4,6,{rx:1,fill:bezelColor,stroke:"#5a6066",strokeWidth:.3});
  if(pushers){
    s += K.rect(93,30,3,4,{rx:.6,fill:bezelColor,stroke:"#5a6066",strokeWidth:.2});
    s += K.rect(93,66,3,4,{rx:.6,fill:bezelColor,stroke:"#5a6066",strokeWidth:.2});
  }
  s += K.circle(50,50,r-bezel,{fill:bezelColor,stroke:"#5a6066",strokeWidth:.3});
  if(dialGrad) s += K.circle(50,50,r-bezel,{fill:K.url(dialGrad)});
  else s += K.circle(50,50,r-bezel,{fill:dial});
  if(rehaut) s += K.circle(50,50,r-bezel,{fill:"none",stroke:rehaut,strokeWidth:1.2,opacity:.5});
  return s;
}
function n(x){ return Math.round(x*1000)/1000; }

/* Standard three-hand set (hour, minute, seconds) with a center cap. */
function hands(K, {hour, minute, second, cx=50, cy=50, cap=1.8, capColor="#fff"}={}){
  let s = "";
  if(hour) s += K.hand("h", hour, {cx,cy,fill:"#fff"});
  if(minute) s += K.hand("m", minute, {cx,cy,fill:"#fff"});
  if(second) s += K.needle("s", {len:38,tail:8,w:.6,color:second.color||"#e05a4a",cx,cy,cap:1.2,capColor:second.color||"#e05a4a"});
  s += K.circle(cx,cy,cap,{fill:capColor,stroke:"#333",strokeWidth:.2});
  return s;
}

/* ---- Faces ------------------------------------------------------------- */
/* Each face draws its static dial, then a moving hand layer. The update
   loop rotates [data-hand] groups and fills [data-text] nodes. */

/* Hand shape builders (pivot-local: 0,0 = pivot, -y points to 12). */
const H = {
  baton:(len,w,tail=6)=>`M${n(-w/2)} ${n(tail)} L${n(-w/2)} ${n(-len)} L${n(w/2)} ${n(-len)} L${n(w/2)} ${n(tail)} Z`,
  dauphine:(len,w,tail=6)=>`M0 ${n(tail)} L${n(-w/2)} ${n(-len*.55)} L0 ${n(-len)} L${n(w/2)} ${n(-len*.55)} Z`,
  leaf:(len,w,tail=6)=>`M0 ${n(tail)} C${n(-w)} ${n(-len*.3)} ${n(-w*.4)} ${n(-len)} 0 ${n(-len)} C${n(w*.4)} ${n(-len)} ${n(w)} ${n(-len*.3)} 0 ${n(tail)} Z`,
  mercedes:(len,w=3.4)=>`M${n(-w/2)} 6 L${n(-w/2)} ${n(-len+4)} L${n(-w*.15)} ${n(-len+4)} L${n(-w*.15)} ${n(-len)} L${n(w*.15)} ${n(-len)} L${n(w*.15)} ${n(-len+4)} L${n(w/2)} ${n(-len+4)} L${n(w/2)} 6 Z`,
  sword:(len,w,tail=6)=>`M0 ${n(tail)} L${n(-w/2)} ${n(-len*.7)} L${n(-w*.15)} ${n(-len)} L${n(w*.15)} ${n(-len)} L${n(w/2)} ${n(-len*.7)} Z`
};

/* LCD display: a green segment panel with bound time/day/date text. */
function lcd(K, {x=20,y=30,w=60,h=40,bg="#9aa87a",fg="#1a2a1a",label}={}){
  let s = K.rect(x,y,w,h,{rx:3,fill:bg,stroke:"#5a6a4a",strokeWidth:.5});
  s += K.rect(x+2,y+2,w-4,h-4,{rx:2,fill:"none",stroke:"#7a8a5a",strokeWidth:.3,opacity:.5});
  if(label) s += K.text(x+w/2,y+6,label,{size:2.5,weight:700,color:fg,family:"var(--mono)"});
  s += K.text(x+w/2,y+h/2+2,"12:00",{size:11,weight:700,color:fg,family:"var(--mono)",data:{"data-text":"hh:mm"}});
  s += K.text(x+8,y+h-6,"MON",{size:3,weight:700,color:fg,family:"var(--mono)",data:{"data-text":"day3"}});
  s += K.text(x+w-8,y+h-6,"31",{size:3,weight:700,color:fg,family:"var(--mono)",anchor:"end",data:{"data-text":"date"}});
  return s;
}

const DEFAULT_CITIES = ["san-francisco","new-york","sao-paulo","london","zurich","dubai","tokyo","sydney"];
const FACE_KEYS = Object.keys(FACES);
const STORE_KEY = "worldclock.qwen-3.8.v1";

/* ---- Face build / update / render ------------------------------------- */
/* A face is a spec whose draw(K) returns an SVG string. We wrap it in a
   live <svg> element and re-bind its [data-hand]/[data-text]/[data-show]
   nodes every frame from a fresh time snapshot. */
function buildFace(key){
  const spec = FACES[key] || FACES[FACE_KEYS[0]];
  const K = kit();
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", spec.viewBox || "0 0 100 100");
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.innerHTML = spec.draw(K);
  return { svg, face: spec };
}
function updateFace(instance, now, zone){
  const t = snap(now, zone, instance.face.cadence);
  applyBindings(instance.svg, t);
  return t;
}

/* ---- State ------------------------------------------------------------ */
const state = { entries: [] }; // { city, faceKey, el, instance, lastMinute, offset }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || data.version !== 1 || !Array.isArray(data.entries)) return null;
    return data.entries
      .filter(e=>CITY_BY_ID.has(e.city))
      .map(e=>({ city: CITY_BY_ID.get(e.city), faceKey: FACES[e.face] ? e.face : null }));
  }catch(e){ return null; }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({ version:1, entries: state.entries.map(e=>({ city:e.city.id, face:e.faceKey })) }));
  }catch(e){ /* storage unavailable: still works for this session */ }
}
function shuffled(list){
  const a = list.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
/* Pick a face not used by any other entry when one is free; never the current one when avoidable. */
function pickFace(exclude=new Set(), avoid=null){
  let pool = FACE_KEYS.filter(k=>!exclude.has(k) && k!==avoid);
  if(!pool.length) pool = FACE_KEYS.filter(k=>k!==avoid);
  if(!pool.length) pool = FACE_KEYS.slice();
  return pool[Math.floor(Math.random()*pool.length)];
}
function usedFaces(except){
  const used = new Set();
  for(const e of state.entries) if(e!==except && e.faceKey) used.add(e.faceKey);
  return used;
}

function offsetLabel(min){
  const sign = min<0 ? "−" : "+";
  const a = Math.abs(min), h = Math.floor(a/60), mm = a%60;
  return `UTC${sign}${h}${mm ? ":"+String(mm).padStart(2,"0") : ""}`;
}
function deltaLabel(min){
  if(min===0) return "same time as you";
  const sign = min<0 ? "−" : "+";
  const a = Math.abs(min), h = Math.floor(a/60), mm = a%60;
  return `${sign}${h}${mm ? ":"+String(mm).padStart(2,"0") : ""}h from you`;
}
function phaseOf(h){
  if(h>=6 && h<8) return "dawn";
  if(h>=8 && h<18) return "day";
  if(h>=18 && h<20) return "dusk";
  return "night";
}

/* Build a fresh card element matching the page's card CSS. */
function cardEl(){
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML =
    `<div class="card-head">
       <div><h2 class="city"></h2><p class="where"></p></div>
       <div class="card-actions">
         <button class="icon-btn shuffle-one" type="button" title="Shuffle this face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
         <button class="icon-btn remove" type="button" title="Remove city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
       </div>
     </div>
     <div class="well"><div class="phase" data-p="day" aria-hidden="true">DAY</div></div>
     <div class="card-foot">
       <p class="facename"></p>
       <div><div class="readout"><span class="hm">--:--</span> <span class="sec">00</span></div><p class="delta"></p></div>
     </div>`;
  return el;
}

function mountEntry(entry){
  const el = cardEl();
  el.dataset.city = entry.city.id;
  $(".city", el).textContent = entry.city.name;
  $(".where", el).textContent = entry.city.country;
  $(".shuffle-one", el).setAttribute("aria-label", `Shuffle the face for ${entry.city.name}`);
  $(".remove", el).setAttribute("aria-label", `Remove ${entry.city.name}`);
  $(".shuffle-one", el).addEventListener("click", ()=>{
    entry.faceKey = pickFace(usedFaces(entry), entry.faceKey);
    setFace(entry);
    save();
  });
  $(".remove", el).addEventListener("click", ()=>removeEntry(entry));
  entry.el = el;
  entry.phase = $(".phase", el);
  entry.hm = $(".hm", el);
  entry.sec = $(".sec", el);
  entry.delta = $(".delta", el);
  setFace(entry);
  return el;
}
function setFace(entry){
  const well = $(".well", entry.el);
  const old = well.querySelector("svg");
  if(old) old.remove();
  entry.instance = buildFace(entry.faceKey);
  well.appendChild(entry.instance.svg);
  $(".facename", entry.el).textContent = entry.instance.face.name;
  entry.el.setAttribute("aria-label", `${entry.city.name}, ${entry.instance.face.name}`);
  entry.lastMinute = -1;
  updateEntry(entry, new Date(), true);
}
function updateEntry(entry, now, force){
  const t = updateFace(entry.instance, now, entry.city.zone);
  const minuteKey = t.h*60 + t.m;
  if(force || minuteKey !== entry.lastMinute){
    entry.lastMinute = minuteKey;
    entry.hm.textContent = `${String(t.h).padStart(2,"0")}:${String(t.m).padStart(2,"0")}`;
    const local = -now.getTimezoneOffset();
    entry.delta.innerHTML = `<b>${offsetLabel(t.offset)}</b> · ${deltaLabel(t.offset - local)}`;
    const p = phaseOf(t.h);
    entry.phase.dataset.p = p;
    entry.phase.textContent = p.toUpperCase();
    entry.offset = t.offset;
  }
  entry.sec.textContent = String(t.sW).padStart(2,"0");
  return t;
}

function sortEntries(){
  const now = new Date();
  for(const e of state.entries) if(e.offset===undefined) e.offset = snap(now, e.city.zone, "tick").offset;
  state.entries.sort((a,b)=> a.offset - b.offset || a.city.name.localeCompare(b.city.name, "en"));
  const order = state.entries.map(e=>e.el);
  const current = Array.from(board.children).filter(c=>c.classList.contains("card"));
  if(order.some((el,i)=>el!==current[i])) for(const el of order) board.appendChild(el);
}

function renderAll(){
  board.innerHTML = "";
  if(!state.entries.length){
    empty.hidden = false;
  } else {
    empty.hidden = true;
    for(const e of state.entries) board.appendChild(e.el || mountEntry(e));
    sortEntries();
  }
  updateSummary();
}
function updateSummary(){
  const n = state.entries.length;
  summary.textContent = `${n} ${n===1 ? "city" : "cities"} · ${FACE_KEYS.length} faces`;
}
function seedDefaults(){
  state.entries = [];
  const pool = shuffled(FACE_KEYS);
  DEFAULT_CITIES.forEach((id,i)=> state.entries.push({ city: CITY_BY_ID.get(id), faceKey: pool[i % pool.length] }));
}
function addCity(city){
  if(state.entries.some(e=>e.city.id===city.id)){
    const el = state.entries.find(e=>e.city.id===city.id).el;
    el.scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth", block: "center" });
    el.animate([{ outline: "2px solid var(--accent)" }, { outline: "2px solid transparent" }], { duration: 1200 });
    return;
  }
  const entry = { city, faceKey: pickFace(usedFaces()) };
  state.entries.push(entry);
  renderAll();
  save();
  entry.el.scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth", block: "center" });
}
function removeEntry(entry){
  state.entries = state.entries.filter(e=>e!==entry);
  renderAll();
  save();
}
function shuffleAll(){
  const pool = shuffled(FACE_KEYS);
  const taken = new Set();
  state.entries.forEach((e,i)=>{
    let next = pool.find(k=>!taken.has(k) && k!==e.faceKey);
    if(!next) next = pool.find(k=>!taken.has(k)) || pool[i % pool.length];
    taken.add(next);
    e.faceKey = next;
    setFace(e);
  });
  save();
}

/* ---- Search combobox -------------------------------------------------- */
let matches = [];
let activeIndex = -1;
function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function searchCities(q){
  const n = norm(q.trim());
  if(!n) return [];
  const scored = [];
  for(const c of CITIES){
    const name = norm(c.name), country = norm(c.country), zone = norm(c.zone.replace(/_/g, " "));
    let score = 0;
    if(name.startsWith(n)) score = 3;
    else if(name.includes(n)) score = 2;
    else if(country.includes(n) || zone.includes(n)) score = 1;
    if(score) scored.push([score, c]);
  }
  scored.sort((a,b)=> b[0]-a[0] || a[1].name.localeCompare(b[1].name, "en"));
  return scored.slice(0,12).map(s=>s[1]);
}
function renderSuggestions(){
  list.innerHTML = "";
  if(!input.value.trim()){ closeList(); return; }
  matches = searchCities(input.value);
  const now = new Date();
  if(!matches.length){
    const li = document.createElement("li");
    li.className = "none"; li.setAttribute("role","option"); li.setAttribute("aria-disabled","true");
    li.textContent = "No matching city";
    list.appendChild(li);
  }
  matches.forEach((c,i)=>{
    const li = document.createElement("li");
    li.setAttribute("role","option");
    li.id = `opt-${c.id}`;
    li.setAttribute("aria-selected", String(i===activeIndex));
    const off = snap(now, c.zone, "tick").offset;
    li.innerHTML = `<span class="city"></span><span class="off">${offsetLabel(off)}</span><span class="country"></span>`;
    $(".city", li).textContent = c.name;
    $(".country", li).textContent = c.country;
    li.addEventListener("mousedown", (ev)=>{ ev.preventDefault(); choose(c); });
    list.appendChild(li);
  });
  list.hidden = false;
  input.setAttribute("aria-expanded","true");
  input.setAttribute("aria-activedescendant", activeIndex>=0 && matches[activeIndex] ? `opt-${matches[activeIndex].id}` : "");
}
function closeList(){
  list.hidden = true; list.innerHTML = "";
  input.setAttribute("aria-expanded","false");
  input.removeAttribute("aria-activedescendant");
  activeIndex = -1; matches = [];
}
function choose(city){
  addCity(city);
  input.value = "";
  closeList();
  input.focus();
}
input.addEventListener("input", ()=>{ activeIndex = -1; renderSuggestions(); });
input.addEventListener("focus", ()=>{ if(input.value.trim()) renderSuggestions(); });
input.addEventListener("keydown", (ev)=>{
  if(ev.key==="ArrowDown" || ev.key==="ArrowUp"){
    if(!matches.length){ renderSuggestions(); if(!matches.length) return; }
    ev.preventDefault();
    const dir = ev.key==="ArrowDown" ? 1 : -1;
    activeIndex = (activeIndex + dir + matches.length) % matches.length;
    renderSuggestions();
    const active = list.children[activeIndex];
    if(active) active.scrollIntoView({ block: "nearest" });
  } else if(ev.key==="Enter"){
    ev.preventDefault();
    if(!matches.length) renderSuggestions();
    const pick = matches[activeIndex>=0 ? activeIndex : 0];
    if(pick) choose(pick);
  } else if(ev.key==="Escape"){
    if(list.hidden) input.value = "";
    closeList();
  }
});
document.addEventListener("click", (ev)=>{ if(!ev.target.closest(".search")) closeList(); });
document.addEventListener("keydown", (ev)=>{
  if(ev.key==="/" && document.activeElement!==input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ ev.preventDefault(); input.focus(); }
});
$("#shuffle-all").addEventListener("click", shuffleAll);
$("#reset").addEventListener("click", ()=>{ seedDefaults(); renderAll(); save(); });
$("#restore").addEventListener("click", ()=>{ seedDefaults(); renderAll(); save(); });

/* ---- Live loop -------------------------------------------------------- */
let lastSecond = -1;
let lastSortCheck = 0;
function frame(){
  const now = new Date();
  const whole = Math.floor(now.getTime()/1000);
  const stepOnly = reducedMotion.matches;
  if(!stepOnly || whole !== lastSecond){
    for(const e of state.entries) if(e.el && e.el.isConnected) updateEntry(e, now, false);
    if(whole !== lastSecond){
      utcNow.textContent = now.toISOString().slice(11,19);
      lastSecond = whole;
      if(now.getTime() - lastSortCheck > 30000){ lastSortCheck = now.getTime(); sortEntries(); }
    }
  }
  if(stepOnly) setTimeout(frame, 1000 - now.getMilliseconds() + 5);
  else requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) lastSecond = -1; });

/* ---- Boot ------------------------------------------------------------- */
const saved = load();
if(saved && saved.length){
  state.entries = saved;
  const used = new Set();
  for(const e of state.entries){
    if(!e.faceKey || used.has(e.faceKey)) e.faceKey = pickFace(used);
    used.add(e.faceKey);
  }
} else if(saved === null){
  seedDefaults();
}
renderAll();
frame();

window.WorldClock = { FACES, FACE_KEYS, CITIES, snap, buildFace, updateFace, addCity, shuffleAll, state };

</script>
