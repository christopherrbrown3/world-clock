    const CX = 50, CY = 68, R = 33.5;         // dial centre and opal-glass radius
    const GILT = S.url("gilt"), BLUE = S.url("blue"), INK = "#141312";
    const FRAME = { x: 6.5, y: 24.5, w: 87, h: 87 };

    /* Radial iron frame lines that divide the 312 opal-glass panes. */
    let panes = "";
    for (let i = 0; i < 24; i++) {
      const a = i * 15;
      panes += `<line x1="${S.p(a, 5.2, CX, CY).replace(" ", '" y1="')}" x2="${S.p(a, R - 0.4, CX, CY).replace(" ", '" y2="')}" stroke="#4a4a48" stroke-width="0.32" opacity="0.8"/>`;
    }
    for (let i = 0; i < 48; i++) {
      const a = i * 7.5;
      panes += `<line x1="${S.p(a, 21.5, CX, CY).replace(" ", '" y1="')}" x2="${S.p(a, R - 0.4, CX, CY).replace(" ", '" y2="')}" stroke="#4a4a48" stroke-width="0.22" opacity="0.7"/>`;
    }
    for (const r of [5.2, 10.5, 16, 21.5, 26.2, 30.4]) panes += S.circle(CX, CY, r, { fill: "none", stroke: "#4a4a48", "stroke-width": 0.28, opacity: 0.8 });

    /* Quatrefoil tracery in the four corners of the square frame. */
    const quatre = (x, y) => `<g transform="translate(${x} ${y})">
        <circle r="7.2" fill="none" stroke="${GILT}" stroke-width="0.9"/>
        <path d="M0 -6.8 A2.9 2.9 0 0 1 0 -1 A2.9 2.9 0 0 1 0 -6.8 M6.8 0 A2.9 2.9 0 0 1 1 0 A2.9 2.9 0 0 1 6.8 0 M0 6.8 A2.9 2.9 0 0 1 0 1 A2.9 2.9 0 0 1 0 6.8 M-6.8 0 A2.9 2.9 0 0 1 -1 0 A2.9 2.9 0 0 1 -6.8 0" fill="${BLUE}" stroke="${GILT}" stroke-width="0.75"/>
        <path d="M0 -6.8 A2.9 2.9 0 0 1 0 -1 A2.9 2.9 0 0 1 0 -6.8 M6.8 0 A2.9 2.9 0 0 1 1 0 A2.9 2.9 0 0 1 6.8 0 M0 6.8 A2.9 2.9 0 0 1 0 1 A2.9 2.9 0 0 1 0 6.8 M-6.8 0 A2.9 2.9 0 0 1 -1 0 A2.9 2.9 0 0 1 -6.8 0" fill="none" stroke="${GILT}" stroke-width="0.75" transform="rotate(45)"/>
        <circle r="1.6" fill="${GILT}"/>
      </g>`;

    /* Hands: gothic black. Hour hand with a broad spade, minute hand slender and long. */
    const hourHand = `<path d="M-1.5 4.5 L-1.5 -9 L-4.2 -12.5 L-3.2 -16 L-1.3 -17.5 L0 -24 L1.3 -17.5 L3.2 -16 L4.2 -12.5 L1.5 -9 L1.5 4.5 Z" fill="${INK}"/>
      <path d="M-0.6 -10.5 L0 -21 L0.6 -10.5 Z" fill="#3a3937"/><circle r="2.4" fill="${INK}"/>`;
    /* Gilt lozenge bosses at the midpoint of each frame edge. */
    const boss = (x, y) => `<path d="M${x} ${y - 3.2} L${x + 2.4} ${y} L${x} ${y + 3.2} L${x - 2.4} ${y} Z" fill="${GILT}"/><circle cx="${x}" cy="${y}" r="0.9" fill="#20344f"/>`;
    const minuteHand = `<path d="M-1.1 5 L-0.75 -20 L0 -32 L0.75 -20 L1.1 5 Z" fill="${INK}"/>
      <path d="M-1.4 -21 L0 -25.2 L1.4 -21 L0 -18.4 Z" fill="${INK}"/><circle r="1.6" fill="${INK}"/>`;

    const roman = ["XII", "I", "II", "III", "IIII", "V", "VI", "VII", "VIII", "IX", "X", "XI"];

    return `
      <defs>
        ${S.linear("stone", { a: 90, stops: [[0, "#d9c9a5"], [0.5, "#cbb98f"], [1, "#b8a47c"]] })}
        ${S.linear("stoneDark", { a: 90, stops: [[0, "#b09b73"], [1, "#9c8862"]] })}
        ${S.linear("gilt", { a: 120, stops: [[0, "#fff2b4"], [0.3, "#e3b84d"], [0.6, "#b98a25"], [1, "#f1d078"]] })}
        ${S.linear("blue", { a: 90, stops: [[0, "#3f5876"], [0.5, "#2b4262"], [1, "#1c2f4a"]] })}
        ${S.radial("opal", { cx: 0.42, cy: 0.38, r: 0.9, stops: [[0, "#fffdf6"], [0.6, "#f3efe3"], [1, "#d9d3c4"]] })}
        <clipPath id="${S.id("dial")}"><circle cx="${CX}" cy="${CY}" r="${R}"/></clipPath>
      </defs>

      <!-- Limestone masonry -->
      ${S.rect(0, 0, 100, 135, { fill: S.url("stone") })}
      ${Array.from({ length: 14 }, (_, i) => `<line x1="0" y1="${S.n(i * 9.7 + 3)}" x2="100" y2="${S.n(i * 9.7 + 3)}" stroke="#a89370" stroke-width="0.35" opacity="0.7"/>`).join("")}
      ${Array.from({ length: 14 }, (_, i) => `<line x1="${S.n((i % 2) * 8 + Math.floor(i / 2) * 16 + 4)}" y1="${S.n(i * 9.7 + 3)}" x2="${S.n((i % 2) * 8 + Math.floor(i / 2) * 16 + 4)}" y2="${S.n(i * 9.7 + 12.7)}" stroke="#a89370" stroke-width="0.3" opacity="0.5"/>`).join("")}
      <!-- Belfry hint: pointed louvred openings and gothic arch above the frame -->
      <path d="M0 0 H100 V6 H0 Z" fill="${S.url("stoneDark")}"/>
      ${[18, 38, 58, 78].map((x) => `<path d="M${x} 0 V4 Q${x + 3} -2 ${x + 6} 4 V0 Z" fill="#5a4e3c"/>`).join("")}
      <path d="M2 24.5 L2 21 Q50 -4 98 21 L98 24.5 Z" fill="${S.url("stoneDark")}"/>
      <path d="M8 24.5 L8 22 Q50 2 92 22 L92 24.5 Z" fill="#7c6b4f"/>
      <path d="M12 24.5 L12 22.5 Q50 6 88 22.5 L88 24.5 Z" fill="${S.url("stone")}"/>
      <path d="M0 24.5 V135 H4 V24.5 Z M96 24.5 V135 H100 V24.5 Z" fill="#a08c65" opacity="0.6"/>
      <!-- Pinnacles either side -->
      <path d="M0 24.5 V12 L3 6 L6 12 V24.5 Z M94 24.5 V12 L97 6 L100 12 V24.5 Z" fill="#a08c65"/>

      <!-- Square iron frame: Prussian blue with gilt mouldings -->
      ${S.rect(FRAME.x - 1.5, FRAME.y - 1.5, FRAME.w + 3, FRAME.h + 3, { fill: "#8a7856" })}
      ${S.rect(FRAME.x, FRAME.y, FRAME.w, FRAME.h, { fill: BLUE })}
      ${S.rect(FRAME.x, FRAME.y, FRAME.w, FRAME.h, { fill: "none", stroke: GILT, "stroke-width": 1.1 })}
      ${S.rect(FRAME.x + 2.2, FRAME.y + 2.2, FRAME.w - 4.4, FRAME.h - 4.4, { fill: "none", stroke: GILT, "stroke-width": 0.45 })}
      ${quatre(FRAME.x + 11, FRAME.y + 11)}${quatre(FRAME.x + FRAME.w - 11, FRAME.y + 11)}
      ${quatre(FRAME.x + 11, FRAME.y + FRAME.h - 11)}${quatre(FRAME.x + FRAME.w - 11, FRAME.y + FRAME.h - 11)}
      ${boss(50, FRAME.y + 4.6)}${boss(50, FRAME.y + FRAME.h - 4.6)}${boss(FRAME.x + 4.6, CY)}${boss(FRAME.x + FRAME.w - 4.6, CY)}
      <!-- Gilt surround of the dial -->
      ${S.circle(CX, CY, R + 4.2, { fill: GILT })}
      ${S.circle(CX, CY, R + 2.4, { fill: "#20344f" })}
      ${S.circle(CX, CY, R + 1.2, { fill: GILT })}
      <!-- Opal glass dial and its iron pane frame -->
      ${S.circle(CX, CY, R, { fill: S.url("opal") })}
      <g clip-path="${S.url("dial")}">
        ${panes}
        ${S.circle(CX, CY, 30.4, { fill: "none", stroke: INK, "stroke-width": 0.7 })}
        ${S.circle(CX, CY, 26.2, { fill: "none", stroke: INK, "stroke-width": 0.5 })}
        ${S.ticks({ count: 60, r1: 30.6, r2: 32.4, w: 0.45, color: INK, cx: CX, cy: CY, skip: (i) => i % 5 === 0 })}
        ${S.ticks({ count: 12, r1: 30.6, r2: 33.2, w: 1.1, color: INK, cx: CX, cy: CY })}
        ${S.numerals({ count: 12, r: 28.3, size: 4.6, family: S.FONT.serif, weight: 700, color: INK, labels: roman, cx: CX, cy: CY, upright: false, start: 0, step: 30 })}
        ${S.circle(CX, CY, 5.2, { fill: "none", stroke: INK, "stroke-width": 0.6 })}
      </g>
      <!-- Hands -->
      ${S.handGroup("h", hourHand, { cx: CX, cy: CY })}
      ${S.handGroup("m", minuteHand, { cx: CX, cy: CY })}
      ${S.circle(CX, CY, 1.3, { fill: "#2a2927" })}

      <!-- Gilt inscription band beneath the dial -->
      ${S.rect(FRAME.x - 1.5, FRAME.y + FRAME.h + 1.5, FRAME.w + 3, 9, { fill: BLUE })}
      ${S.rect(FRAME.x - 1.5, FRAME.y + FRAME.h + 1.5, FRAME.w + 3, 9, { fill: "none", stroke: GILT, "stroke-width": 0.7 })}
      ${S.text(50, 119.0, "DOMINE SALVAM FAC REGINAM NOSTRAM VICTORIAM PRIMAM", { size: 2.2, family: S.FONT.serif, weight: 700, color: GILT, letter: 0.05 })}
    `;
  }
});
}

    let bezel = "";
    for (let i = 1; i < 60; i++) {

      if (i % 5 === 0) { if (i % 10) bezel += L(a, 37.0, 41.0, "#eef1f3", 1.5); }

      ${crown}

/* ==== face: navitimer ==== */
{
registerFace("navitimer", {
  name: "Breitling Navitimer B01 Chronograph 43",
  cadence: "sweep",
  draw(S) {
    const W = "#f2f3ef", K = "#15171a", RED = "#d42a2a";
    const LUME = S.url("lume");
    const LG = (v, ref) => 360 * Math.log10(v / ref);           // log scale angle, ref value at 12
    const line = (a, r1, r2, col, w) => `<line x1="${S.p(a, r1).replace(" ", '" y1="')}" x2="${S.p(a, r2).replace(" ", '" y2="')}" stroke="${col}" stroke-width="${w}"/>`;
    const LABELS = [10, 11, 12, 13, 14, 15, 16, 17, 18, 20, 25, 30, 35, 40, 45, 50, 55, 60, 70, 80, 90];

    /* One logarithmic scale: graduations + radially-oriented numerals. */
    const scale = (ref, rIn, rOut, col, numR, numSize, redAt) => {
      let s = "";
      const step = (v) => (v < 20 ? 0.2 : v < 50 ? 0.5 : 1);
      for (let v = 10; v < 100 - 1e-9; v = +(v + step(v)).toFixed(2)) {
        const major = Math.abs(v - Math.round(v)) < 1e-6 && (v < 20 || v % (v < 50 ? 1 : 2) === 0);
        const isLab = LABELS.includes(v);
        const len = isLab ? rOut - rIn : major ? (rOut - rIn) * 0.62 : (rOut - rIn) * 0.36;
        s += line(LG(v, ref), rOut - len, rOut, col, isLab ? 0.4 : 0.28);
      }
      for (const v of LABELS) {
        const a = LG(v, ref), [x, y] = S.pt(a, numR);
        s += S.text(x, y, String(v), { size: numSize, family: S.FONT.cond, weight: 600, color: v === redAt ? RED : col, transform: `rotate(${S.n(a)} ${S.n(x)} ${S.n(y)})`, baseline: "middle" });
      }
      return s;
    };

    /* Beaded bezel edge. */
    let beads = "";
    for (let i = 0; i < 96; i++) { const [x, y] = S.pt(i * 3.75, 44.3); beads += S.circle(x, y, 0.9, { fill: i % 2 ? "#8c949c" : "#f0f3f5" }); }

    /* Applied baton hour indices with lume (skip 3, 6, 9 which are covered by registers; 12 is a double baton). */
    let idx = "";
    for (let i = 0; i < 12; i++) {
      if (i === 3 || i === 6 || i === 9) continue;
      const a = i * 30, [x, y] = S.pt(a, 27.4);
      const w = i === 0 ? 0 : 0;

        ? S.rect(x - 1.9, y - 3.2, 1.5, 6.4, { fill: S.url("hand") }) + S.rect(x + 0.4, y - 3.2, 1.5, 6.4, { fill: S.url("hand") }) + S.rect(x - 1.55, y - 2.8, 0.8, 5.6, { fill: LUME }) + S.rect(x + 0.75, y - 2.8, 0.8, 5.6, { fill: LUME })

{

    /* Rainbow hue around the bezel: red at 12, yellow at 3, green ~5, blue ~7, violet ~8, magenta ~10. */
    const table = [[0, 0], [60, 32], [90, 55], [150, 120], [200, 205], [250, 268], [300, 315], [360, 360]];
    const hue = (a) => { a = ((a % 360) + 360) % 360; for (let i = 1; i < table.length; i++) if (a <= table[i][0]) { const [a0, h0] = table[i - 1], [a1, h1] = table[i]; return h0 + (h1 - h0) * (a - a0) / (a1 - a0); } return 0; };
    const stone = (a, r1, r2, hw1, hw2) => {
      const h = hue(a);

    }

    /* Everose hands with lume. */

    const minuteHand = `<path d="M-1.45 3 L-1.45 -22.5 L0 -30.6 L1.45 -22.5 L1.45 3 Z" fill="${ROSE2}"/><path d="M-0.85 -2.6 L-0.85 -22 L0 -27.6 L0.85 -22 L0.85 -2.6 Z" fill="${LUME}"/>`;
    const chrono = `<g transform="translate(50 50)"><path d="M-0.38 7.8 L-0.38 -31.6 L0.38 -31.6 L0.38 7.8 Z" fill="${ROSE2}"/><path d="M-0.9 4 L-0.9 8.8 L0.9 8.8 L0.9 4 Z" fill="${ROSE2}"/><circle r="1.55" fill="${ROSE2}"/><circle r="0.6" fill="#3a2620"/></g>`;

    let diamonds = "";
    [[28.5, 22], [30.5, 17.5], [33.5, 13.5], [37.5, 10.5], [71.5, 22], [69.5, 17.5], [66.5, 13.5], [62.5, 10.5]].forEach(([x, y]) => { diamonds += dia(x, y) + dia(x, 100 - y); });
    [[90.4, 45.4], [90.4, 50], [90.4, 54.6]].forEach(([x, y]) => { diamonds += dia(x, y, 0.75); });

    return `

        ${S.linear("roseV", { a: 90, stops: [[0, "#8a5540"], [0.2, "#f3d3bf"], [0.5, "#d3a086"], [0.85, "#f0cdb8"], [1, "#7e4c39"]] })}

      <path d="M88.5 43.2 Q95.4 42.2 95.6 50 Q95.4 57.8 88.5 56.8 Z" fill="${ROSE}"/>
      <path d="M92.4 46.4 H94.6 V53.6 H92.4 Z" fill="#a8704f"/>

      ${S.circle(50, 50, 44.6, { fill: ROSE })}

/* ==== face: kingkhaki ==== */
{

        ${S.radial("lume", { cx: 0.35, cy: 0.3, r: 0.9, stops: [[0, "#fdfcf0"], [0.6, "#eae7cc"], [1, "#c9c4a3"]] })}

/* ==== face: bigtic ==== */
{
registerFace("bigtic", {
  name: "Fossil Big Tic JR-7845",
  cadence: "tick",
  draw(S) {
    const INK = "#15171a";
    const R_CASE = 44.6, R_DIAL = 37.2;
    const LCD = { x: 29.5, y: 51.5, w: 41, h: 26 };

    /* Seven-segment digit: hexagonal segments, slight italic slant like a real LCD.
       Each segment carries data-seg so update() can light it from t.sWhole. */
    const W = 11.2, H = 17.6, T = 2.5, G = 0.35;
    const hseg = (x0, x1, y) => `${S.n(x0 + G)} ${S.n(y)} ${S.n(x0 + G + T / 2)} ${S.n(y - T / 2)} ${S.n(x1 - G - T / 2)} ${S.n(y - T / 2)} ${S.n(x1 - G)} ${S.n(y)} ${S.n(x1 - G - T / 2)} ${S.n(y + T / 2)} ${S.n(x0 + G + T / 2)} ${S.n(y + T / 2)}`;
    const vseg = (x, y0, y1) => `${S.n(x)} ${S.n(y0 + G)} ${S.n(x + T / 2)} ${S.n(y0 + G + T / 2)} ${S.n(x + T / 2)} ${S.n(y1 - G - T / 2)} ${S.n(x)} ${S.n(y1 - G)} ${S.n(x - T / 2)} ${S.n(y1 - G - T / 2)} ${S.n(x - T / 2)} ${S.n(y0 + G + T / 2)}`;
    const digit = (name, dx, dy) => {
      const m = dy + H / 2;
      const segs = {
        a: hseg(dx, dx + W, dy), g: hseg(dx, dx + W, m), d: hseg(dx, dx + W, dy + H),
        f: vseg(dx, dy, m), b: vseg(dx + W, dy, m), e: vseg(dx, m, dy + H), c: vseg(dx + W, m, dy + H)
      };
      return `<g id="${S.id(name)}" fill="${INK}" transform="skewX(-5) translate(${S.n((dy + H / 2) * Math.tan(5 * Math.PI / 180))} 0)">` +
        Object.keys(segs).map((k) => `<polygon data-seg="${k}" points="${segs[k]}" fill-opacity="0.07"/>`).join("") + `</g>`;
    };

    /* Hands, pivot-local: black-edged steel batons with lume stripes. No seconds hand; seconds are digital. */
    const hourHand = `<path d="M-1.7 3.8 L-1.7 -20.8 L0 -23.6 L1.7 -20.8 L1.7 3.8 Z" fill="${INK}"/><path d="M-0.75 -3 L-0.75 -19.4 L0.75 -19.4 L0.75 -3 Z" fill="#eef0e6"/>`;
    const minuteHand = `<path d="M-1.4 4.2 L-1.4 -30.6 L0 -33.4 L1.4 -30.6 L1.4 4.2 Z" fill="${INK}"/><path d="M-0.6 -3 L-0.6 -29 L0.6 -29 L0.6 -3 Z" fill="#eef0e6"/><circle r="2.1" fill="${INK}"/><circle r="0.8" fill="#8a9098"/>`;

    return `
      <defs>
        ${S.linear("brace", { a: 90, stops: [[0, "#6a727a"], [0.14, "#e6eaed"], [0.5, "#a8b0b8"], [0.86, "#e6eaed"], [1, "#656d75"]] })}
        ${S.linear("case", { a: 135, stops: [[0, "#ffffff"], [0.32, "#d3d9de"], [0.66, "#868e96"], [1, "#dde2e6"]] })}
        ${S.radial("dialg", { cx: 0.4, cy: 0.3, r: 0.95, stops: [[0, "#f4f5f2"], [0.5, "#dadcd8"], [1, "#b9bcb8"]] })}
        ${S.linear("lcd", { a: 100, stops: [[0, "#c3cab4"], [0.5, "#b1b9a4"], [1, "#9ea695"]] })}
        ${S.linear("lcdFrame", { a: 90, stops: [[0, "#2a2d31"], [0.5, "#4a4f55"], [1, "#1d2023"]] })}
        ${S.linear("crown", { a: 90, stops: [[0, "#7f868d"], [0.25, "#f0f3f5"], [0.6, "#aeb5bb"], [1, "#6e757c"]] })}
        <clipPath id="${S.id("dialclip")}"><circle cx="50" cy="50" r="${R_DIAL}"/></clipPath>
      </defs>

      <!-- Steel bracelet -->
      ${S.rect(30, 0, 40, 13, { fill: S.url("brace") })}${S.rect(30, 87, 40, 13, { fill: S.url("brace") })}
      ${S.rect(42, 0, 16, 13, { fill: "#d3d9de", opacity: 0.5 })}${S.rect(42, 87, 16, 13, { fill: "#d3d9de", opacity: 0.5 })}
      <path d="M42 0 V13 M58 0 V13 M42 87 V100 M58 87 V100 M30 6.5 H70 M30 93.5 H70" stroke="#454c54" stroke-width="0.55"/>
      <!-- Lugs, crown, case -->
      <path d="M27 30 Q29 11 36.5 8.5 L63.5 8.5 Q71 11 73 30 Z" fill="${S.url("case")}"/>
      <path d="M27 70 Q29 89 36.5 91.5 L63.5 91.5 Q71 89 73 70 Z" fill="${S.url("case")}"/>
      ${S.rect(93.4, 46.4, 5, 7.2, { rx: 1.2, fill: S.url("crown") })}
      ${Array.from({ length: 5 }, (_, i) => `<line x1="${S.n(94.4 + i * 0.8)}" y1="47" x2="${S.n(94.4 + i * 0.8)}" y2="53" stroke="#61686f" stroke-width="0.3"/>`).join("")}
      ${S.circle(50, 50, R_CASE, { fill: S.url("case") })}
      ${S.circle(50, 50, R_CASE - 4.2, { fill: "none", stroke: "#f6f8f9", "stroke-width": 0.5, opacity: 0.8 })}
      ${S.circle(50, 50, R_DIAL + 1.2, { fill: "#2b2f34" })}
      <!-- Dial -->
      ${S.circle(50, 50, R_DIAL, { fill: S.url("dialg") })}
      <g clip-path="${S.url("dialclip")}">
        ${S.ticks({ count: 60, r1: 34.2, r2: 36.2, w: 0.45, color: INK, skip: (i) => i % 5 === 0 || (i > 20 && i < 40) })}
        ${S.ticks({ count: 12, r1: 33.2, r2: 36.2, w: 1.2, color: INK, skip: (i) => i > 4 && i < 8 })}
        ${S.numerals({ count: 12, r: 28.4, size: 8, family: S.FONT.sans, weight: 700, color: INK, skip: (i) => i !== 11 && i !== 2 && i !== 8 })}
        ${S.text(50, 33.6, "FOSSIL", { size: 3.6, family: S.FONT.sans, weight: 700, color: INK, letter: 0.9 })}
        <!-- Digital seconds window: framed LCD with two seven-segment digits -->
        ${S.rect(LCD.x - 1.4, LCD.y - 1.4, LCD.w + 2.8, LCD.h + 2.8, { rx: 1.6, fill: S.url("lcdFrame") })}
        ${S.rect(LCD.x, LCD.y, LCD.w, LCD.h, { rx: 0.8, fill: S.url("lcd") })}
        ${S.rect(LCD.x, LCD.y, LCD.w, LCD.h * 0.45, { rx: 0.8, fill: "#ffffff", opacity: 0.12 })}
        ${digit("dg0", 36.2, LCD.y + 4.2)}
        ${digit("dg1", 52.6, LCD.y + 4.2)}
        ${S.text(50, LCD.y + LCD.h - 1.6, "SEC", { size: 1.6, family: S.FONT.sans, weight: 700, color: INK, opacity: 0.55, letter: 0.4 })}
      </g>
      <!-- Hands -->
      ${S.handGroup("h", hourHand)}
      ${S.handGroup("m", minuteHand)}
      ${S.crystal(50, 50, R_DIAL + 1, { opacity: 0.1 })}
    `;
  },
  update(svg, t, S) {
    const MAP = { 0: "abcdef", 1: "bc", 2: "abdeg", 3: "abcdg", 4: "bcfg", 5: "acdfg", 6: "acdefg", 7: "abc", 8: "abcdefg", 9: "abcdfg" };
    const s = String(t.sWhole).padStart(2, "0");
    for (let i = 0; i < 2; i++) {
      const g = svg.querySelector(S.ref("dg" + i));
      if (!g) continue;
      const on = MAP[s[i]];
      for (const p of g.children) p.setAttribute("fill-opacity", on.indexOf(p.getAttribute("data-seg")) >= 0 ? "1" : "0.07");
    }
  }
});
}

  ["kiritimati", "Kiritimati", "Kiribati", "Pacific/Kiritimati"]
].map(([id, name, country, zone]) => ({ id, name, country, zone }));
const CITY_BY_ID = new Map(CITIES.map((c) => [c.id, c]));
const DEFAULT_CITIES = ["san-francisco", "new-york", "sao-paulo", "london", "zurich", "dubai", "tokyo", "sydney"];
const STORE_KEY = "worldclock.fable-5.1.v1";

/* ---- State -------------------------------------------------------------- */
const state = { entries: [] }; // { city, faceKey, el, instance, lastMinute }

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1 || !Array.isArray(data.entries)) return null;
    const entries = data.entries
      .filter((e) => CITY_BY_ID.has(e.city))
      .map((e) => ({ city: CITY_BY_ID.get(e.city), faceKey: FACES[e.face] ? e.face : null }));
    return entries;
  } catch (e) { return null; }
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ version: 1, entries: state.entries.map((e) => ({ city: e.city.id, face: e.faceKey })) }));
  } catch (e) { /* storage unavailable: still works for this session */ }
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Pick a face not used by any other entry when one is free; never the current one when avoidable. */
function pickFace(exclude = new Set(), avoid = null) {
  let pool = FACE_KEYS.filter((k) => !exclude.has(k) && k !== avoid);
  if (!pool.length) pool = FACE_KEYS.filter((k) => k !== avoid);
  if (!pool.length) pool = FACE_KEYS.slice();
  return pool[Math.floor(Math.random() * pool.length)];
}
function usedFaces(except) {
  const used = new Set();
  for (const e of state.entries) if (e !== except && e.faceKey) used.add(e.faceKey);
  return used;
}

/* ---- DOM ---------------------------------------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const grid = $("#grid");
const tpl = $("#card-tpl");
const input = $("#city-input");
const list = $("#city-list");
const summary = $("#summary");
const utcNow = $("#utc-now");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function offsetLabel(min) {
  const sign = min < 0 ? "−" : "+";
  const a = Math.abs(min);
  const h = Math.floor(a / 60), mm = a % 60;
  return `UTC${sign}${h}${mm ? ":" + String(mm).padStart(2, "0") : ""}`;
}
function deltaLabel(min) {
  if (min === 0) return "same time as you";
  const sign = min < 0 ? "−" : "+";
  const a = Math.abs(min), h = Math.floor(a / 60), mm = a % 60;
  return `${sign}${h}${mm ? ":" + String(mm).padStart(2, "0") : ""}h from you`;
}
function phaseOf(h) {
  if (h >= 6 && h < 8) return "dawn";
  if (h >= 8 && h < 18) return "day";
  if (h >= 18 && h < 20) return "dusk";
  return "night";
}

function mountEntry(entry) {
  const el = tpl.content.firstElementChild.cloneNode(true);
  el.dataset.city = entry.city.id;
  $(".city", el).textContent = entry.city.name;
  $(".where", el).textContent = entry.city.country;
  $(".shuffle-one", el).setAttribute("aria-label", `Shuffle the face for ${entry.city.name}`);
  $(".shuffle-one", el).title = "Shuffle this face";
  $(".remove", el).setAttribute("aria-label", `Remove ${entry.city.name}`);
  $(".remove", el).title = "Remove city";
  $(".shuffle-one", el).addEventListener("click", () => {
    entry.faceKey = pickFace(usedFaces(entry), entry.faceKey);
    setFace(entry);
    save();
  });
  $(".remove", el).addEventListener("click", () => removeEntry(entry));
  entry.el = el;
  setFace(entry);
  return el;
}
function setFace(entry) {
  const well = $(".well", entry.el);
  well.innerHTML = "";
  entry.instance = buildFace(entry.faceKey);
  well.appendChild(entry.instance.svg);
  $(".facename", entry.el).textContent = entry.instance.face.name;
  entry.el.setAttribute("aria-label", `${entry.city.name}, ${entry.instance.face.name}`);
  entry.lastMinute = -1;
  updateEntry(entry, new Date(), true);
}
function updateEntry(entry, now, force) {
  const t = updateFace(entry.instance, now, entry.city.zone);
  const minuteKey = t.h * 60 + t.m;
  if (force || minuteKey !== entry.lastMinute) {
    entry.lastMinute = minuteKey;
    $(".hm", entry.el).textContent = `${String(t.h).padStart(2, "0")}:${String(t.m).padStart(2, "0")}`;
    $(".day", entry.el).textContent = `${WEEKDAYS[t.weekday][0]}${WEEKDAYS[t.weekday].slice(1).toLowerCase()} ${t.date} ${MONTHS[t.month - 1][0]}${MONTHS[t.month - 1].slice(1).toLowerCase()}`;
    const local = -now.getTimezoneOffset();
    $(".delta", entry.el).innerHTML = `<b>${offsetLabel(t.offset)}</b> · ${deltaLabel(t.offset - local)}`;
    entry.el.dataset.phase = phaseOf(t.h);
    entry.offset = t.offset;
  }
  $(".sec", entry.el).textContent = String(t.sWhole).padStart(2, "0");
  return t;
}

function sortEntries() {
  const now = new Date();
  for (const e of state.entries) if (e.offset === undefined) e.offset = snapshot(now, e.city.zone, "tick").offset;
  state.entries.sort((a, b) => a.offset - b.offset || a.city.name.localeCompare(b.city.name, "en"));
  const order = state.entries.map((e) => e.el);
  const current = Array.from(grid.children).filter((c) => c.classList.contains("card"));
  if (order.some((el, i) => el !== current[i])) for (const el of order) grid.appendChild(el);
}

function renderAll() {
  grid.innerHTML = "";
  if (!state.entries.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `<p>No cities on the board.</p><button class="btn" type="button" id="restore">Add the default cities</button>`;
    grid.appendChild(empty);
    $("#restore", empty).addEventListener("click", () => { seedDefaults(); renderAll(); save(); });
  } else {
    for (const e of state.entries) grid.appendChild(e.el || mountEntry(e));
    sortEntries();
  }
  updateSummary();
}
function updateSummary() {
  const n = state.entries.length;
  summary.textContent = `${n} ${n === 1 ? "city" : "cities"} · ${FACE_KEYS.length} faces`;
}
function seedDefaults() {
  state.entries = [];
  const pool = shuffled(FACE_KEYS);
  DEFAULT_CITIES.forEach((id, i) => state.entries.push({ city: CITY_BY_ID.get(id), faceKey: pool[i % pool.length] }));
}
function addCity(city) {
  if (state.entries.some((e) => e.city.id === city.id)) {
    const el = state.entries.find((e) => e.city.id === city.id).el;
    el.scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth", block: "center" });
    el.animate([{ outline: "2px solid var(--accent)" }, { outline: "2px solid transparent" }], { duration: 1200 });
    return;
  }
  const entry = { city, faceKey: pickFace(usedFaces()) };
  state.entries.push(entry);
  renderAll();
  save();
  entry.el.scrollIntoView({ behavior: reducedMotion.matches ? "auto" : "smooth", block: "center" });
}
function removeEntry(entry) {
  state.entries = state.entries.filter((e) => e !== entry);
  renderAll();
  save();
}
function shuffleAll() {
  const pool = shuffled(FACE_KEYS);
  const taken = new Set();
  state.entries.forEach((e, i) => {
    let next = pool.find((k) => !taken.has(k) && k !== e.faceKey);
    if (!next) next = pool.find((k) => !taken.has(k)) || pool[i % pool.length];
    taken.add(next);
    e.faceKey = next;
    setFace(e);
  });
  save();
}

/* ---- Search combobox ---------------------------------------------------- */
let matches = [];
let activeIndex = -1;
function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function searchCities(q) {
  const n = norm(q.trim());
  if (!n) return [];
  const scored = [];
  for (const c of CITIES) {
    const name = norm(c.name), country = norm(c.country), zone = norm(c.zone.replace(/_/g, " "));
    let score = 0;
    if (name.startsWith(n)) score = 3;
    else if (name.includes(n)) score = 2;
    else if (country.includes(n) || zone.includes(n)) score = 1;
    if (score) scored.push([score, c]);
  }
  scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name, "en"));
  return scored.slice(0, 12).map((s) => s[1]);
}
function renderSuggestions() {
  list.innerHTML = "";
  if (!input.value.trim()) { closeList(); return; }
  matches = searchCities(input.value);
  const now = new Date();
  if (!matches.length) {
    const li = document.createElement("li");
    li.className = "none"; li.setAttribute("role", "option"); li.setAttribute("aria-disabled", "true");
    li.textContent = "No matching city";
    list.appendChild(li);
  }
  matches.forEach((c, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.id = `opt-${c.id}`;
    li.setAttribute("aria-selected", String(i === activeIndex));
    const off = snapshot(now, c.zone, "tick").offset;
    li.innerHTML = `<span class="city"></span><span class="off">${offsetLabel(off)}</span><span class="country"></span>`;
    $(".city", li).textContent = c.name;
    $(".country", li).textContent = c.country;
    li.addEventListener("mousedown", (ev) => { ev.preventDefault(); choose(c); });
    list.appendChild(li);
  });
  list.hidden = false;
  input.setAttribute("aria-expanded", "true");
  input.setAttribute("aria-activedescendant", activeIndex >= 0 && matches[activeIndex] ? `opt-${matches[activeIndex].id}` : "");
}
function closeList() {
  list.hidden = true; list.innerHTML = "";
  input.setAttribute("aria-expanded", "false");
  input.removeAttribute("aria-activedescendant");
  activeIndex = -1; matches = [];
}
function choose(city) {
  addCity(city);
  input.value = "";
  closeList();
  input.focus();
}
input.addEventListener("input", () => { activeIndex = -1; renderSuggestions(); });
input.addEventListener("focus", () => { if (input.value.trim()) renderSuggestions(); });
input.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    if (!matches.length) { renderSuggestions(); if (!matches.length) return; }
    ev.preventDefault();
    const dir = ev.key === "ArrowDown" ? 1 : -1;
    activeIndex = (activeIndex + dir + matches.length) % matches.length;
    renderSuggestions();
    const active = list.children[activeIndex];
    if (active) active.scrollIntoView({ block: "nearest" });
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    if (!matches.length) renderSuggestions();
    const pick = matches[activeIndex >= 0 ? activeIndex : 0];
    if (pick) choose(pick);
  } else if (ev.key === "Escape") {
    if (list.hidden) input.value = "";
    closeList();
  }
});
$("#search-form").addEventListener("submit", (ev) => ev.preventDefault());
document.addEventListener("click", (ev) => { if (!ev.target.closest(".search")) closeList(); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement !== input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); input.focus(); }
});
$("#shuffle-all").addEventListener("click", shuffleAll);

/* ---- Live loop ---------------------------------------------------------- */
let lastSecond = -1;
let lastSortCheck = 0;
function frame() {
  const now = new Date();
  const whole = Math.floor(now.getTime() / 1000);
  const stepOnly = reducedMotion.matches;
  if (!stepOnly || whole !== lastSecond) {
    for (const e of state.entries) if (e.el && e.el.isConnected) updateEntry(e, now, false);
    if (whole !== lastSecond) {
      utcNow.textContent = now.toISOString().slice(11, 19);
      lastSecond = whole;
      if (now.getTime() - lastSortCheck > 30000) { lastSortCheck = now.getTime(); sortEntries(); }
    }
  }
  if (stepOnly) setTimeout(frame, 1000 - now.getMilliseconds() + 5);
  else requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastSecond = -1; } });

/* ---- Boot ---------------------------------------------------------------- */
const saved = load();
if (saved && saved.length) {
  state.entries = saved;
  const used = new Set();
  for (const e of state.entries) {
    if (!e.faceKey || used.has(e.faceKey)) e.faceKey = pickFace(used);
    used.add(e.faceKey);
  }
} else if (saved === null) {
  seedDefaults();
}
renderAll();
frame();

window.WorldClock = { FACES, FACE_KEYS, CITIES, snapshot, buildFace, updateFace, renderFaceInto, addCity, shuffleAll, state };
