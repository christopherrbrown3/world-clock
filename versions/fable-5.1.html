<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock — Claude Fable 5.1</title>
<meta name="description" content="A standalone world clock rendering 62 iconic watch and clock faces as live inline SVG. Claude Fable 5.1 checkpoint.">
<meta name="theme-color" content="#111316">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23111316' stroke='%23ff8a4c' stroke-width='6'/%3E%3Cpath d='M50 50V22M50 50l20 12' stroke='%23ecebe6' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23ff8a4c'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #111316;
  --bg-2: #16191d;
  --card: #1a1d22;
  --card-2: #1f2329;
  --line: #2a2f36;
  --line-2: #363c45;
  --ink: #ecebe6;
  --ink-2: #c9c9c3;
  --muted: #9aa1a9;
  --faint: #6b727a;
  --accent: #ff8a4c;
  --accent-ink: #1a0f08;
  --steel: #8fb4d9;
  --night: #2b3f7a;
  --dawn: #e2803c;
  --day: #8ec5ff;
  --focus: #ffd2b8;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-width: 300px;
  color: var(--ink); background: radial-gradient(120% 70% at 50% -20%, #1d2128 0%, var(--bg) 60%);
  font-family: var(--sans); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- Top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: auto minmax(200px, 1fr) auto; align-items: center; gap: 16px;
  padding: 12px clamp(14px, 3vw, 32px);
  background: rgba(17, 19, 22, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.plate { display: flex; align-items: center; gap: 12px; min-width: 0; }
.plate .mark { width: 34px; height: 34px; flex: none; }
.plate h1 {
  margin: 0; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.1;
}
.plate .sub { margin: 3px 0 0; color: var(--muted); font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.04em; white-space: nowrap; }
.plate .sub b { color: var(--accent); font-weight: 600; }

.search { position: relative; width: min(520px, 100%); justify-self: center; }
.search input {
  width: 100%; height: 46px; padding: 0 44px 0 42px;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; color: var(--ink);
}
.search input::placeholder { color: var(--faint); }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(255, 138, 76, 0.18); }
.search .glyph { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); font-family: var(--mono); font-size: 0.68rem; border: 1px solid var(--line-2); border-radius: 5px; padding: 2px 6px; pointer-events: none; }
.suggest {
  position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; max-height: min(380px, 60vh); overflow-y: auto;
  margin: 0; padding: 6px; list-style: none;
  background: var(--card-2); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
}
.suggest[hidden] { display: none; }
.suggest li {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  min-height: 44px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
}
.suggest li .city { font-weight: 600; }
.suggest li .country { grid-column: 1; color: var(--muted); font-size: 0.78rem; }
.suggest li .off { grid-row: 1 / span 2; color: var(--steel); font-family: var(--mono); font-size: 0.74rem; }
.suggest li[aria-selected="true"], .suggest li:hover { background: rgba(255, 138, 76, 0.14); }
.suggest .none { color: var(--muted); cursor: default; }
.suggest .none:hover { background: none; }

.actions { display: flex; align-items: center; gap: 8px; justify-self: end; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 16px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; font-weight: 700; font-size: 0.86rem; letter-spacing: 0.02em;
}
.btn:hover { filter: brightness(1.08); }
.btn svg { width: 18px; height: 18px; }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line-2); }
.btn.ghost:hover { border-color: var(--ink-2); filter: none; }

/* ---- Meta strip ---- */
.strip {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 18px;
  padding: 10px clamp(14px, 3vw, 32px); color: var(--muted); font-family: var(--mono); font-size: 0.72rem;
}
.strip .utc b { color: var(--ink-2); font-weight: 500; }

/* ---- Grid ---- */
main { padding: 6px clamp(14px, 3vw, 32px) 56px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.card {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  background: linear-gradient(180deg, var(--card-2), var(--card) 40%); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 16px 40px rgba(0, 0, 0, 0.28);
}
.card .phase { height: 3px; background: linear-gradient(90deg, var(--night), var(--dawn), var(--day)); background-size: 300% 100%; }
.card[data-phase="night"] .phase { background-position: 0% 0; }
.card[data-phase="dawn"] .phase, .card[data-phase="dusk"] .phase { background-position: 50% 0; }
.card[data-phase="day"] .phase { background-position: 100% 0; }
.card header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px 16px 6px; align-items: start; }
.card .city { margin: 0; font-size: 1.16rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .where { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .clock { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
.card .clock .hm { font-size: 1.36rem; font-weight: 500; color: var(--ink); }
.card .clock .sec { font-size: 0.8rem; color: var(--steel); margin-left: 3px; }
.card .clock .ap { font-size: 0.7rem; color: var(--muted); margin-left: 4px; }
.card .clock .day { display: block; margin-top: 3px; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.02em; }
.card .delta { grid-column: 1 / -1; color: var(--faint); font-family: var(--mono); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .delta b { color: var(--muted); font-weight: 500; }
.well {
  position: relative; aspect-ratio: 1 / 1; margin: 6px 16px 0;
  background: radial-gradient(60% 60% at 50% 45%, #22262c 0%, #15181c 100%); border-radius: 12px; border: 1px solid #252a31;
}
.well .face { position: absolute; inset: 6%; width: 88%; height: 88%; display: block; }
.card footer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 10px 10px 10px 16px; }
.card .facename { margin: 0; color: var(--ink-2); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon {
  display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--muted);
}
.icon:hover { color: var(--ink); border-color: var(--line-2); background: rgba(255, 255, 255, 0.04); }
.icon.danger:hover { color: #ff9c9c; }
.icon svg { width: 18px; height: 18px; }

.empty {
  grid-column: 1 / -1; padding: 56px 20px; text-align: center; color: var(--muted);
  border: 1px dashed var(--line-2); border-radius: var(--radius);
}
.empty p { margin: 0 0 16px; }

@media (max-width: 760px) {
  .topbar { grid-template-columns: 1fr auto; }
  .search { grid-column: 1 / -1; grid-row: 2; width: 100%; }
  .plate .sub { white-space: normal; }
  .btn .label { display: none; }
  .btn { padding: 0 12px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
  .search .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>

<header class="topbar">
  <div class="plate">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="#1a1d22" stroke="#ff8a4c" stroke-width="5"/>
      <g stroke="#6b727a" stroke-width="3" stroke-linecap="round"><path d="M50 14v8M50 78v8M14 50h8M78 50h8"/></g>
      <path d="M50 50V24" stroke="#ecebe6" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 50l19 13" stroke="#ecebe6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="4.5" fill="#ff8a4c"/>

    <div>

  <form class="search" id="search-form" role="search" autocomplete="off">

    <input id="city-input" type="text" placeholder="Add a city…" role="combobox" aria-expanded="false" aria-controls="city-list" aria-autocomplete="list" aria-haspopup="listbox">

</div>
<main>
  <section class="grid" id="grid" aria-live="polite" aria-label="City clocks"></section>
</main>
<template id="card-tpl">
  <article class="card">
    <div class="phase" aria-hidden="true"></div>
    <header>
      <div>
        <h2 class="city"></h2>
        <p class="where"></p>
      </div>
      <div class="clock" aria-live="off"><span class="hm">--:--</span><span class="sec"></span><span class="ap"></span><span class="day"></span></div>
      <p class="delta"></p>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button class="icon danger remove" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </footer>
  </article>
</template>
<script>
/* =========================================================================
   World Clock — Claude Fable 5.1 checkpoint
   Part 1: face registry, SVG drawing kit, time engine.
   Everything in this file is self-contained and dependency free.
   ========================================================================= */
"use strict";

/* ---- Face registry ---------------------------------------------------- */
const FACES = {};
const CADENCES = new Set(["sweep", "tick", "glide", "digital", "mondaine"]);

function registerFace(key, spec) {
  if (FACES[key]) throw new Error(`duplicate face key ${key}`);
  if (!spec || typeof spec.draw !== "function") throw new Error(`face ${key} has no draw()`);
  if (!CADENCES.has(spec.cadence)) throw new Error(`face ${key} has unknown cadence ${spec.cadence}`);
  FACES[key] = Object.assign({ key, viewBox: "0 0 100 100" }, spec);
}

/* ---- Drawing kit ------------------------------------------------------- */
const FONT = {
  sans: "'Helvetica Neue', Helvetica, Arial, sans-serif",
  cond: "'Helvetica Neue Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif",
  serif: "Georgia, 'Times New Roman', Times, serif",
  mono: "Menlo, Consolas, 'Liberation Mono', monospace",
  lcd: "'Courier New', Menlo, Consolas, monospace"
};

let instanceCounter = 0;

/* Every face draws through a kit bound to one SVG instance, so gradient,
   mask and clip ids stay unique when many faces share a document. */
function makeKit() {
  const prefix = `f${(instanceCounter++).toString(36)}_`;
  const n = (v) => (Math.round(v * 1000) / 1000).toString();
  const pt = (deg, r, cx = 50, cy = 50) => {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  const p = (deg, r, cx = 50, cy = 50) => { const [x, y] = pt(deg, r, cx, cy); return `${n(x)} ${n(y)}`; };
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const attrs = (o) => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => ` ${k}="${esc(v)}"`).join("");

  const kit = {
    FONT, n, pt, p, esc, attrs,
    id: (name) => prefix + name,
    url: (name) => `url(#${prefix}${name})`,
    ref: (name) => `#${prefix}${name}`,

    /* Gradients. stops: [[offset0to1, color, opacity?], ...] */
    linear(name, { a = 90, stops = [], x1, y1, x2, y2, units } = {}) {
      let coords;
      if (x1 !== undefined) coords = ` x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"`;
      else {
        const rad = (a - 90) * Math.PI / 180, cx = 0.5, cy = 0.5, dx = Math.cos(rad) * 0.5, dy = Math.sin(rad) * 0.5;
        coords = ` x1="${n(cx - dx)}" y1="${n(cy - dy)}" x2="${n(cx + dx)}" y2="${n(cy + dy)}"`;
      }
      return `<linearGradient id="${prefix}${name}"${coords}${units ? ` gradientUnits="${units}"` : ""}>${stops.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op !== undefined ? ` stop-opacity="${op}"` : ""}/>`).join("")}</linearGradient>`;
    },
    radial(name, { cx = 0.5, cy = 0.5, r = 0.5, fx, fy, stops = [], units } = {}) {
      return `<radialGradient id="${prefix}${name}" cx="${cx}" cy="${cy}" r="${r}"${fx !== undefined ? ` fx="${fx}" fy="${fy}"` : ""}${units ? ` gradientUnits="${units}"` : ""}>${stops.map(([o, c, op]) => `<stop offset="${o}" stop-color="${c}"${op !== undefined ? ` stop-opacity="${op}"` : ""}/>`).join("")}</radialGradient>`;
    },
    /* Brushed-metal conic ring: a fan of thin segments alternating tone. */
    brushedRing(cx, cy, rOuter, rInner, { segments = 180, light = "#e6eaee", dark = "#8f979f", mid = "#bfc6cc" } = {}) {
      let out = "";
      const tones = [light, mid, dark, mid];
      for (let i = 0; i < segments; i++) {
        const a0 = i * 360 / segments, a1 = (i + 1) * 360 / segments + 0.4;
        out += `<path d="M${p(a0, rOuter, cx, cy)} A${rOuter} ${rOuter} 0 0 1 ${p(a1, rOuter, cx, cy)} L${p(a1, rInner, cx, cy)} A${rInner} ${rInner} 0 0 0 ${p(a0, rInner, cx, cy)} Z" fill="${tones[i % 4]}"/>`;
      }
      return out;
    },
    /* Radial ticks. skip(i) returns true to omit an index. */
    ticks({ count = 60, r1 = 40, r2 = 43, w = 0.5, color = "#fff", cx = 50, cy = 50, skip, start = 0, cap = "butt", opacity } = {}) {
      let out = "";
      for (let i = 0; i < count; i++) {
        if (skip && skip(i)) continue;
        const a = start + i * 360 / count;
        const [ax, ay] = pt(a, r1, cx, cy), [bx, by] = pt(a, r2, cx, cy);
        out += `<line x1="${n(ax)}" y1="${n(ay)}" x2="${n(bx)}" y2="${n(by)}" stroke="${color}" stroke-width="${w}" stroke-linecap="${cap}"${opacity !== undefined ? ` opacity="${opacity}"` : ""}/>`;
      }
      return out;
    },
    /* Text helper. anchor defaults middle; baseline central. */
    text(x, y, str, { size = 4, family = FONT.sans, weight = 400, color = "#fff", anchor = "middle", letter, transform, opacity, italic, baseline = "central", cls, data } = {}) {
      return `<text x="${n(x)}" y="${n(y)}" font-size="${size}" font-family="${esc(family)}" font-weight="${weight}" fill="${color}" text-anchor="${anchor}" dominant-baseline="${baseline}"${letter !== undefined ? ` letter-spacing="${letter}"` : ""}${italic ? ' font-style="italic"' : ""}${transform ? ` transform="${transform}"` : ""}${opacity !== undefined ? ` opacity="${opacity}"` : ""}${cls ? ` class="${cls}"` : ""}${data ? attrs(data) : ""}>${esc(str)}</text>`;
    },
    /* Numerals around a circle. labels overrides the generated 1..count list.
       upright=true keeps glyphs vertical; false rotates them radially. */
    numerals({ count = 12, r = 30, size = 6, family = FONT.sans, weight = 500, color = "#fff", labels, upright = true, start = 30, step, cx = 50, cy = 50, skip, letter, italic, offsetY = 0 } = {}) {
      let out = "";
      const stepDeg = step !== undefined ? step : 360 / count;
      for (let i = 0; i < count; i++) {
        if (skip && skip(i)) continue;
        const label = labels ? labels[i] : String(i + 1);
        if (label === "" || label === null || label === undefined) continue;
        const a = start + i * stepDeg;
        const [x, y] = pt(a, r, cx, cy);
        out += kit.text(x, y + offsetY, label, { size, family, weight, color, letter, italic, transform: upright ? undefined : `rotate(${n(a)} ${n(x)} ${n(y)})` });
      }
      return out;
    },
    /* Text on an arc from a0 to a1 degrees (clockwise from 12) at radius r.
       flip=true lays the text along the bottom reading left to right. */
    arcText({ str, r, a0, a1, size = 3, family = FONT.sans, weight = 500, color = "#fff", letter, cx = 50, cy = 50, flip = false, opacity, name }) {
      const id = prefix + (name || `arc${Math.random().toString(36).slice(2, 7)}`);
      const [sx, sy] = pt(flip ? a1 : a0, r, cx, cy), [ex, ey] = pt(flip ? a0 : a1, r, cx, cy);
      const span = Math.abs(a1 - a0);
      const large = span > 180 ? 1 : 0;
      const sweep = flip ? 0 : 1;
      return `<defs><path id="${id}" d="M${n(sx)} ${n(sy)} A${r} ${r} 0 ${large} ${sweep} ${n(ex)} ${n(ey)}"/></defs><text font-size="${size}" font-family="${esc(family)}" font-weight="${weight}" fill="${color}"${letter !== undefined ? ` letter-spacing="${letter}"` : ""}${opacity !== undefined ? ` opacity="${opacity}"` : ""}><textPath href="#${id}" startOffset="50%" text-anchor="middle" dominant-baseline="central">${esc(str)}</textPath></text>`;
    },
    /* Rectangle helper with rounded corners. */
    rect(x, y, w, h, o = {}) {
      return `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"${attrs(o)}/>`;
    },
    circle(cx, cy, r, o = {}) {
      return `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}"${attrs(o)}/>`;
    },
    /* A hand drawn pointing to 12 from pivot (cx,cy). shape: path d in local
       coordinates where (0,0) is the pivot and negative y points to 12. */
    hand(kind, d, { cx = 50, cy = 50, fill = "#fff", stroke, sw, extra = "", pivotAttr = true } = {}) {
      const piv = pivotAttr && (cx !== 50 || cy !== 50) ? ` data-pivot="${n(cx)} ${n(cy)}"` : "";
      return `<g data-hand="${kind}"${piv} transform="translate(${n(cx)} ${n(cy)})"><path d="${d}" fill="${fill}"${stroke ? ` stroke="${stroke}" stroke-width="${sw || 0.3}"` : ""}${extra ? " " + extra : ""}/></g>`;
    },
    /* Group whose contents rotate as a hand. Children are in pivot-local
       coordinates (0,0 = pivot, -y = 12). */
    handGroup(kind, inner, { cx = 50, cy = 50 } = {}) {
      const piv = cx !== 50 || cy !== 50 ? ` data-pivot="${n(cx)} ${n(cy)}"` : "";
      return `<g data-hand="${kind}"${piv} transform="translate(${n(cx)} ${n(cy)})">${inner}</g>`;
    },
    /* Soft glass reflection across a round crystal. */
    crystal(cx = 50, cy = 50, r = 34, { opacity = 0.14, name = "crystal" } = {}) {
      return `<defs>${kit.linear(name, { a: 135, stops: [[0, "#fff", 0.55], [0.42, "#fff", 0.08], [0.55, "#fff", 0], [1, "#fff", 0.18]] })}<clipPath id="${prefix}${name}clip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs><g clip-path="url(#${prefix}${name}clip)" opacity="${opacity}" pointer-events="none"><ellipse cx="${n(cx - r * 0.25)}" cy="${n(cy - r * 0.45)}" rx="${n(r * 0.95)}" ry="${n(r * 0.55)}" fill="url(#${prefix}${name})" transform="rotate(-28 ${cx} ${cy})"/></g>`;
    },
    /* Date window frame + bound date text. */
    dateWindow(x, y, w, h, { fill = "#f5f3ea", color = "#111", size = 4.2, family = FONT.sans, weight = 600, frame, frameW = 0.5, rx = 0.4, pad = false, letter } = {}) {

        kit.text(x + w / 2, y + h / 2 + 0.1, "31", { size, family, weight, color, letter, data: { "data-text": pad ? "date2" : "date" } });
    },
    /* Standard sweep-seconds hand as a thin needle with counterweight. */

}

/* ---- Time engine ------------------------------------------------------- */
const partsCache = new Map();
function partsFormatter(zone) {
  let f = partsCache.get(zone);
  if (!f) {
    f = new Intl.DateTimeFormat("en-US", {
      timeZone: zone, hour12: false, weekday: "short", year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "numeric", second: "numeric", timeZoneName: "shortOffset"
    });
    partsCache.set(zone, f);
  }
  return f;
}

const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const WEEKDAY_FULL = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const MONTH_FULL = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

function parseOffset(text) {
  const m = /GMT([+-])(\d{1,2})(?::(\d{2}))?/.exec(text || "");
  if (!m) return 0;
  return (m[1] === "-" ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3] || 0));
}

/* Synodic moon phase 0..1 from a UTC instant (0 = new, 0.5 = full). */
function moonPhase(date) {
  const synodic = 29.530588853;
  const ref = Date.UTC(2000, 0, 6, 18, 14); // known new moon
  const days = (date.getTime() - ref) / 86400000;
  return ((days / synodic) % 1 + 1) % 1;
}

/* Local time snapshot for a zone, shaped by a face cadence. */
function snapshot(date, zone, cadence = "sweep") {
  const f = partsFormatter(zone);
  const parts = {};
  for (const part of f.formatToParts(date)) parts[part.type] = part.value;
  const h = Number(parts.hour) % 24;
  const m = Number(parts.minute);
  const sWhole = Number(parts.second);
  const ms = date.getMilliseconds();
  const raw = sWhole + ms / 1000;
  let s = raw;
  if (cadence === "sweep") s = Math.floor(raw * 8) / 8;
  else if (cadence === "tick" || cadence === "digital") s = sWhole;
  else if (cadence === "mondaine") s = raw >= 58 ? 60 : raw * 60 / 58;
  const weekday = WEEKDAYS.indexOf(parts.weekday.slice(0, 3).toUpperCase());
  const minuteFrac = cadence === "mondaine" || cadence === "tick" || cadence === "digital" ? 0 : s / 60;
  return {
    zone, h, h12: h % 12 === 0 ? 12 : h % 12, m, s, sWhole, raw, ms,
    date: Number(parts.day), month: Number(parts.month), year: Number(parts.year), weekday,
    offset: parseOffset(parts.timeZoneName), offsetText: parts.timeZoneName,
    pm: h >= 12, moon: moonPhase(date),
    /* hand angles */
    aH: ((h % 12) + m / 60 + s / 3600) * 30,
    aM: (m + minuteFrac) * 6,
    aS: s * 6,
    aH24: (h + m / 60 + s / 3600) * 15
  };
}

/* ---- Face rendering ---------------------------------------------------- */
const TEXT_BINDINGS = {
  date: (t) => String(t.date),
  date2: (t) => String(t.date).padStart(2, "0"),
  day3: (t) => WEEKDAYS[t.weekday],
  day3c: (t) => WEEKDAYS[t.weekday][0] + WEEKDAYS[t.weekday].slice(1).toLowerCase(),
  day2: (t) => WEEKDAYS[t.weekday].slice(0, 2),
  day1: (t) => WEEKDAYS[t.weekday][0],
  dayfull: (t) => WEEKDAY_FULL[t.weekday],
  month3: (t) => MONTHS[t.month - 1],
  monthfull: (t) => MONTH_FULL[t.month - 1],
  monthnum: (t) => String(t.month),
  monthnum2: (t) => String(t.month).padStart(2, "0"),
  year: (t) => String(t.year),
  hh: (t) => String(t.h12),
  hh2: (t) => String(t.h12).padStart(2, "0"),
  hh24: (t) => String(t.h).padStart(2, "0"),
  mm: (t) => String(t.m).padStart(2, "0"),
  ss: (t) => String(t.sWhole).padStart(2, "0"),
  ampm: (t) => (t.pm ? "PM" : "AM"),
  am: (t) => (t.pm ? "" : "AM"),
  pm: (t) => (t.pm ? "PM" : ""),
  "hh:mm": (t) => `${t.h12}:${String(t.m).padStart(2, "0")}`,
  "hh24:mm": (t) => `${String(t.h).padStart(2, "0")}:${String(t.m).padStart(2, "0")}`,
  "mo-dd": (t) => `${t.month}-${String(t.date).padStart(2, "0")}`,
  "mo/dd": (t) => `${t.month}/${t.date}`
};

const HAND_ANGLES = {
  h: (t) => t.aH,
  m: (t) => t.aM,
  s: (t) => t.aS,
  h24: (t) => t.aH24,                          // 24h hand, 24 at 12 o'clock position => noon at bottom
  h24top: (t) => t.aH24 + 180,                 // 24h hand with noon at the top
  gmt: (t) => t.aH24,
  date: (t) => (t.date - 1) * 360 / 31,        // pointer date, 1 at top
  datehand: (t) => t.date * 360 / 31,
  weekday: (t) => t.weekday * 360 / 7,
  month: (t) => (t.month - 1) * 30,
  moon: (t) => t.moon * 360,
  msec: (t) => (t.ms / 1000) * 360,
  min5: (t) => (t.m % 5 + t.s / 60) * 72,      // five-minute regatta style
  hshadow: (t) => t.aH,
  mshadow: (t) => t.aM
};

function applyBindings(svg, t) {
  for (const el of svg.querySelectorAll("[data-hand]")) {
    const kind = el.getAttribute("data-hand");
    const fn = HAND_ANGLES[kind];
    if (!fn) continue;
    const piv = (el.getAttribute("data-pivot") || "50 50").split(/[\s,]+/).map(Number);
    let angle = fn(t);
    const offset = el.getAttribute("data-offset");
    if (offset) angle += Number(offset);
    const scale = el.getAttribute("data-scale");
    if (scale) angle *= Number(scale);
    el.setAttribute("transform", `translate(${piv[0]} ${piv[1]}) rotate(${angle.toFixed(3)})`);
  }
  for (const el of svg.querySelectorAll("[data-text]")) {
    const fn = TEXT_BINDINGS[el.getAttribute("data-text")];
    if (!fn) continue;
    const v = fn(t);
    if (el.textContent !== v) el.textContent = v;
  }
  for (const el of svg.querySelectorAll("[data-show]")) {
    const cond = el.getAttribute("data-show");
    let on = true;
    if (cond === "pm") on = t.pm;
    else if (cond === "am") on = !t.pm;
    else if (cond === "night") on = t.h < 6 || t.h >= 18;
    else if (cond === "day") on = t.h >= 6 && t.h < 18;
    else if (cond === "blink") on = t.ms < 500;
    else if (cond === "date2digit") on = t.date >= 10;
    else if (cond === "date1digit") on = t.date < 10;
    el.style.visibility = on ? "visible" : "hidden";
  }
}

/* Build an SVG element for a face. Returns { svg, kit, face }. */
function buildFace(key) {
  const face = FACES[key];
  if (!face) throw new Error(`unknown face ${key}`);
  const kit = makeKit();
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", face.viewBox);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", face.name);
  svg.setAttribute("class", "face");
  svg.innerHTML = face.draw(kit);
  return { svg, kit, face };
}

function updateFace(instance, date, zone) {
  const t = snapshot(date, zone, instance.face.cadence);
  applyBindings(instance.svg, t);
  if (instance.face.update) instance.face.update(instance.svg, t, instance.kit);
  return t;
}

/* Render a face into a host element once (used by the render harness). */
function renderFaceInto(host, key, date = new Date(), zone = "UTC") {
  const instance = buildFace(key);
  host.appendChild(instance.svg);
  updateFace(instance, date, zone);
  return instance;
}

});
}

/* ==== face: speedmaster ==== */
{
registerFace("speedmaster", {
  name: "Omega Speedmaster Moonwatch Professional 310.30.42.50.01.001",
  cadence: "sweep",
  draw(S) {
    const P = "#f2f3f0";                 // dial printing
    const LUME = S.url("lume");
    const R_DIAL = 34.6, R_STEP = 29.4;  // stepped dial: outer track sits lower
    const line = (a, r1, r2, color, w, cx = 50, cy = 50, op = 1) => {
      const [x1, y1] = S.pt(a, r1, cx, cy), [x2, y2] = S.pt(a, r2, cx, cy);
      return `<line x1="${S.n(x1)}" y1="${S.n(y1)}" x2="${S.n(x2)}" y2="${S.n(y2)}" stroke="${color}" stroke-width="${w}" opacity="${op}" stroke-linecap="butt"/>`;
    };

    /* Tachymeter bezel: value v sits at t = 3600/v seconds -> angle t*6. */
    let bezel = "";
    const labels = [500, 400, 350, 300, 275, 250, 225, 200, 190, 180, 170, 160, 150, 140, 130, 120, 110, 100, 90, 80, 75, 70, 65, 60];
    const labAng = labels.map((v) => (3600 / v) * 6);
    for (let i = 0; i < labels.length; i++) {
      const a = labAng[i];
      bezel += S.text(50, 50 - 38.4, String(labels[i]), { size: 2.35, family: S.FONT.cond, weight: 600, color: "#eef0ee", transform: `rotate(${S.n(a)} 50 50)` });
      bezel += line(a, 40.6, 41.9, "#e6e8e6", 0.45);
    }
    for (let t = 12; t <= 60; t++) {
      const a = t * 6;
      if (labAng.some((b) => Math.abs(b - a) < 2.5)) continue;
      bezel += line(a, 40.9, 41.9, "#cfd2cf", 0.35);
    }
    bezel += S.circle(...S.pt(241.6, 40.2), 0.55, { fill: "#eef0ee" }); // Dot over Ninety
    bezel += S.arcText({ str: "TACHYMÈTRE", r: 38.2, a0: 3, a1: 34, size: 2.2, family: S.FONT.sans, weight: 600, color: "#eef0ee", letter: 0.35, name: "tachy" });
    bezel += line(0, 36.4, 41.9, "#eef0ee", 0.7);

    /* Outer minute/seconds track on the lower step; lume batons at hours. */
    let track = "";
    for (let i = 0; i < 300; i++) {
      const a = i * 1.2;
      if (i % 5 === 0) track += line(a, 31.4, 33.9, "#d8dad8", 0.42);
      else track += line(a, 32.9, 33.9, "#a9aca9", 0.25);
    }
    let marks = "";
    for (let h = 0; h < 12; h++) {
      const a = h * 30;
      if (h === 0) { marks += line(-1.35, 29.9, 33.6, LUME, 1.15) + line(1.35, 29.9, 33.6, LUME, 1.15); }
      else marks += line(a, 29.9, 33.6, LUME, 1.25);
    }

    /* Sunken registers at 3 (30 min), 6 (12 h), 9 (running seconds). */
    const R_SUB = 8.4, D_SUB = 15.6;
    const sub = (cx, cy, labs) => {
      let s = S.circle(cx, cy, R_SUB + 0.5, { fill: "#050505" }) + S.circle(cx, cy, R_SUB, { fill: S.url("subg") });
      for (let i = 0; i < 60; i++) s += line(i * 6, i % 5 === 0 ? R_SUB - 2.2 : R_SUB - 1.3, R_SUB - 0.5, i % 5 === 0 ? "#e2e4e2" : "#8d908d", i % 5 === 0 ? 0.4 : 0.25, cx, cy);
      for (const [a, str] of labs) { const [x, y] = S.pt(a, R_SUB - 4.1, cx, cy); s += S.text(x, y + 0.85, str, { size: 2.2, family: S.FONT.cond, weight: 600, color: P }); }
      return s;
    };
    const subHand = `<path d="M-0.42 2.6 L-0.42 -${S.n(R_SUB - 1.4)} L0 -${S.n(R_SUB - 0.7)} L0.42 -${S.n(R_SUB - 1.4)} L0.42 2.6 Z" fill="#f4f5f3"/><circle r="0.85" fill="#f4f5f3"/><circle r="0.35" fill="#2a2c2a"/>`;

    /* Hands: flat white batons with lume stripe; thin chrono needle parked at 12. */
    const hourHand = `<path d="M-1.55 3.2 L-1.55 -18.6 L-1.05 -20.4 L1.05 -20.4 L1.55 -18.6 L1.55 3.2 Z" fill="${S.url("hand")}"/><path d="M-0.75 -3.5 L-0.75 -18.3 L0.75 -18.3 L0.75 -3.5 Z" fill="${LUME}"/>`;
    const minuteHand = `<path d="M-1.35 3.4 L-1.35 -29.8 L-0.85 -31.4 L0.85 -31.4 L1.35 -29.8 L1.35 3.4 Z" fill="${S.url("hand")}"/><path d="M-0.65 -3.5 L-0.65 -29.4 L0.65 -29.4 L0.65 -3.5 Z" fill="${LUME}"/>`;
    const chronoHand = `<path d="M-0.35 7.8 L-0.35 -33.2 L0 -34 L0.35 -33.2 L0.35 7.8 Z" fill="#f4f5f3"/><path d="M-1.1 5.2 L0 9.6 L1.1 5.2 L0 2.4 Z" fill="#f4f5f3"/><circle r="1.5" fill="#f4f5f3"/><circle r="0.6" fill="#2a2c2a"/>`;

    return `
      <defs>
        ${S.linear("brace", { a: 90, stops: [[0, "#6a727a"], [0.14, "#e6eaed"], [0.5, "#a7afb7"], [0.86, "#e6eaed"], [1, "#666e76"]] })}
        ${S.linear("case", { a: 135, stops: [[0, "#fbfcfd"], [0.35, "#ccd3d9"], [0.7, "#858d95"], [1, "#d3d9de"]] })}
        ${S.linear("bzl", { a: 90, stops: [[0, "#f2f5f7"], [0.5, "#8e969e"], [1, "#e6eaee"]] })}
        ${S.linear("insert", { a: 160, stops: [[0, "#2c2e31"], [0.3, "#121315"], [0.62, "#040405"], [1, "#1d1f22"]] })}
        ${S.radial("dialg", { cx: 0.42, cy: 0.3, r: 0.95, stops: [[0, "#232527"], [0.45, "#0d0e10"], [1, "#000"]] })}
        ${S.radial("subg", { cx: 0.5, cy: 0.5, r: 0.5, stops: [[0, "#070808"], [0.7, "#0b0c0d"], [1, "#1d1f21"]] })}
        ${S.radial("lume", { cx: 0.35, cy: 0.3, r: 0.9, stops: [[0, "#ffffff"], [0.5, "#f1f3ec"], [1, "#c8cfc6"]] })}
        ${S.linear("hand", { a: 120, stops: [[0, "#ffffff"], [0.45, "#e9edf0"], [0.65, "#b3bac0"], [1, "#f1f4f6"]] })}
        ${S.linear("crown", { a: 90, stops: [[0, "#7f878f"], [0.22, "#f1f4f6"], [0.55, "#a9b1b9"], [1, "#6e767e"]] })}
        <clipPath id="${S.id("dialclip")}"><circle cx="50" cy="50" r="${R_DIAL}"/></clipPath>
      </defs>
      <!-- Flat-link bracelet -->
      <g>
        ${S.rect(31, 0, 38, 14, { fill: S.url("brace") })}${S.rect(31, 86, 38, 14, { fill: S.url("brace") })}
        ${S.rect(41, 0, 18, 14, { fill: "#d2d8dd", opacity: 0.5 })}${S.rect(41, 86, 18, 14, { fill: "#d2d8dd", opacity: 0.5 })}
        <path d="M41 0 V14 M59 0 V14 M41 86 V100 M59 86 V100 M31 5 H69 M31 10.5 H69 M31 89.5 H69 M31 95 H69" stroke="#454c54" stroke-width="0.5"/>
      </g>
      <!-- Twisted lyre lugs: a polished facet catches light along the twist -->
      <path d="M21 32 Q22 13 34 5.6 L66 5.6 Q78 13 79 32 Z" fill="${S.url("case")}"/>
      <path d="M21 68 Q22 87 34 94.4 L66 94.4 Q78 87 79 68 Z" fill="${S.url("case")}"/>
      <path d="M26 14 Q29.5 9 34 5.6 L37.5 5.6 Q32 12 28 20 Z M74 14 Q70.5 9 66 5.6 L62.5 5.6 Q68 12 72 20 Z M26 86 Q29.5 91 34 94.4 L37.5 94.4 Q32 88 28 80 Z M74 86 Q70.5 91 66 94.4 L62.5 94.4 Q68 88 72 80 Z" fill="#ffffff" opacity="0.55"/>
      <path d="M31 5.6 L32.5 14 M69 5.6 L67.5 14 M31 94.4 L32.5 86 M69 94.4 L67.5 86" stroke="#4e565e" stroke-width="0.6"/>
      <!-- Pump pushers and crown; right flank carries the crown guard -->
      <g transform="rotate(32 50 50)">${S.rect(90.5, 46.6, 6.6, 6.8, { rx: 1.4, fill: S.url("crown") })}${S.rect(89.2, 47.6, 3, 4.8, { fill: "#8c949c" })}</g>
      <g transform="rotate(-32 50 50)">${S.rect(90.5, 46.6, 6.6, 6.8, { rx: 1.4, fill: S.url("crown") })}${S.rect(89.2, 47.6, 3, 4.8, { fill: "#8c949c" })}</g>
      ${S.rect(93.4, 44.6, 5.4, 10.8, { rx: 1.3, fill: S.url("crown") })}
      ${Array.from({ length: 8 }, (_, i) => `<line x1="${S.n(94.1 + i * 0.6)}" y1="45.2" x2="${S.n(94.1 + i * 0.6)}" y2="54.8" stroke="#5c646c" stroke-width="0.28" opacity="0.85"/>`).join("")}
      <path d="M50 6.7 A43.3 43.3 0 0 0 50 93.3 A43.3 43.3 0 0 0 84 77 Q94.6 64 94.6 50 Q94.6 36 84 23 A43.3 43.3 0 0 0 50 6.7 Z" fill="${S.url("case")}"/>
      <path d="M86 28 Q93 40 93 50 Q93 60 86 72" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
      <!-- Polished bezel ring and black anodised tachymeter insert -->
      ${S.circle(50, 50, 42.6, { fill: S.url("bzl") })}
      ${S.circle(50, 50, 41.9, { fill: S.url("insert") })}
      ${bezel}
      ${S.circle(50, 50, 36.4, { fill: "none", stroke: "#8e969e", "stroke-width": 0.9 })}
      ${S.circle(50, 50, 35.9, { fill: "none", stroke: "#1a1c1e", "stroke-width": 0.6 })}
      <!-- Stepped dial -->
      ${S.circle(50, 50, R_DIAL, { fill: S.url("dialg") })}
      <g clip-path="${S.url("dialclip")}">
        ${track}
        ${S.circle(50, 50, R_STEP, { fill: "none", stroke: "#2c2e30", "stroke-width": 0.5 })}
        ${S.circle(50, 50, R_STEP - 0.3, { fill: "none", stroke: "#000", "stroke-width": 0.35 })}
        ${marks}
        <!-- Omega mark and printing, below the hands -->
        <g fill="none" stroke="${P}" stroke-width="0.8" transform="translate(50 36.6)"><path d="M-1.8 1.6 A2.4 2.4 0 1 1 1.8 1.6"/><path d="M-2.6 1.6 H-1.2 M1.2 1.6 H2.6" /></g>
        ${S.text(50, 40.9, "OMEGA", { size: 2.7, family: S.FONT.sans, weight: 600, color: P, letter: 0.45 })}
        ${S.text(50, 43.9, "Speedmaster", { size: 2.8, family: S.FONT.serif, weight: 400, color: P, italic: true, letter: 0.1 })}
        ${S.text(50, 46.1, "PROFESSIONAL", { size: 1.45, family: S.FONT.sans, weight: 500, color: P, letter: 0.45 })}
        ${S.text(44.9, 81.9, "SWISS", { size: 1.2, family: S.FONT.sans, weight: 500, color: P })}
        ${S.text(55.2, 81.9, "MADE", { size: 1.2, family: S.FONT.sans, weight: 500, color: P })}
        ${sub(50 + D_SUB, 50, [[0, "30"], [120, "10"], [240, "20"]])}
        ${sub(50, 50 + D_SUB, [[0, "12"], [90, "3"], [180, "6"], [270, "9"]])}
        ${sub(50 - D_SUB, 50, [[0, "60"], [120, "20"], [240, "40"]])}
        <!-- Static chronograph registers at zero -->
        <g transform="translate(${S.n(50 + D_SUB)} 50)">${subHand}</g>
        <g transform="translate(50 ${S.n(50 + D_SUB)})">${subHand}</g>
      </g>
      <!-- Live running seconds at 9 -->
      ${S.handGroup("s", subHand, { cx: 50 - D_SUB, cy: 50 })}
      ${S.handGroup("h", hourHand)}
      ${S.handGroup("m", minuteHand)}
      <g transform="translate(50 50)">${chronoHand}</g>
      ${S.crystal(50, 50, R_DIAL + 1.5, { opacity: 0.14 })}

  }
});
}

/* ==== face: nautilus ==== */
{
registerFace("nautilus", {
  name: "Patek Philippe Nautilus 5811/1G-001",
  cadence: "sweep",
  draw(S) {
    const WG = S.url("wg");        // white-gold marker/hand surrounds
    const LUME = S.url("lume");
    const P = "#eef0f2";           // dial printing
    /* Rounded octagon: horizontal flats half-length hx, vertical flats half-length vy, corners cut by fraction t. */
    const roct = (cx, cy, rx, ry, hx, vy, t) => {
      const v = [[hx, -ry], [rx, -vy], [rx, vy], [hx, ry], [-hx, ry], [-rx, vy], [-rx, -vy], [-hx, -ry]];
      let d = "";
      for (let i = 0; i < 8; i++) {
        const a = v[(i + 7) % 8], b = v[i], c = v[(i + 1) % 8];
        const p1 = [b[0] + (a[0] - b[0]) * t, b[1] + (a[1] - b[1]) * t];
        const p2 = [b[0] + (c[0] - b[0]) * t, b[1] + (c[1] - b[1]) * t];
        d += (i ? "L" : "M") + S.n(cx + p1[0]) + " " + S.n(cy + p1[1]) + "Q" + S.n(cx + b[0]) + " " + S.n(cy + b[1]) + " " + S.n(cx + p2[0]) + " " + S.n(cy + p2[1]);
      }
      return d + "Z";
    };
    const dialPath = roct(50, 50, 33.4, 32.6, 15, 12, 0.6);

    /* Horizontal embossed relief grooves. */
    let grooves = "";
    for (let y = 17.6; y < 84; y += 1.55) {
      grooves += `<line x1="14" y1="${S.n(y)}" x2="86" y2="${S.n(y)}" stroke="#000" stroke-width="0.42" opacity="0.42"/>`;
      grooves += `<line x1="14" y1="${S.n(y + 0.6)}" x2="86" y2="${S.n(y + 0.6)}" stroke="#8fb0d8" stroke-width="0.2" opacity="0.22"/>`;
    }

    /* Applied batons with lume; double baton at 12. Minute dots between them. */
    let marks = "";
    const baton = (deg, dx) => {
      const [x, y] = S.pt(deg, 26.2);
      return `<g transform="rotate(${deg} ${S.n(x)} ${S.n(y)}) translate(${dx} 0)">${S.rect(x - 1.05, y - 3.4, 2.1, 6.8, { rx: 0.2, fill: WG })}${S.rect(x - 0.55, y - 2.9, 1.1, 5.8, { fill: LUME })}</g>`;
    };
    for (let i = 1; i < 12; i++) if (i !== 3) marks += baton(i * 30, 0);
    marks += baton(0, -1.7) + baton(0, 1.7);
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0 || i === 14 || i === 16) continue;
      const [x, y] = S.pt(i * 6, 30.6);
      marks += S.circle(x, y, 0.34, { fill: "#d8dde2" });
    }

    /* Hands: white-gold batons with lume stripes; slim centre seconds. */
    const hourHand = `<path d="M-1.7 4.2 L-1.7 -17.4 L0 -19.4 L1.7 -17.4 L1.7 4.2 Z" fill="${S.url("hand")}"/>${S.rect(-0.85, -16.6, 1.7, 15.4, { fill: LUME })}`;
    const minuteHand = `<path d="M-1.5 4.8 L-1.5 -26.4 L0 -28.4 L1.5 -26.4 L1.5 4.8 Z" fill="${S.url("hand")}"/>${S.rect(-0.75, -25.6, 1.5, 24.4, { fill: LUME })}`;
    const secondHand = `${S.rect(-0.35, -30, 0.7, 38, { fill: S.url("hand") })}<circle r="1.5" fill="${S.url("hand")}"/><circle r="0.5" fill="#2a2e33"/>`;

    /* Bracelet links: brushed outer links, polished raised centre links. */
    const links = (y0, dir) => {
      let s = "";
      for (let i = 0; i < 3; i++) {
        const y = y0 + dir * i * 5.6;
        const yy = dir > 0 ? y : y - 5.2;
        s += S.rect(26, yy, 48, 5.2, { fill: S.url("brace") });
        s += S.rect(38.5, yy + 0.35, 23, 4.5, { rx: 1.4, fill: S.url("clink") });
      }
      return s;
    };

    return `
      <defs>
        ${S.linear("brace", { a: 90, stops: [[0, "#7c838a"], [0.2, "#e7eaec"], [0.5, "#b8bec4"], [0.8, "#e7eaec"], [1, "#6f767d"]] })}
        ${S.linear("clink", { a: 90, stops: [[0, "#f8f9f9"], [0.35, "#cfd4d8"], [0.55, "#8e959b"], [1, "#eef0f1"]] })}
        ${S.linear("case", { a: 90, stops: [[0, "#fafbfb"], [0.3, "#cfd4d7"], [0.65, "#8d9499"], [1, "#d8dcdf"]] })}
        ${S.linear("bezel", { a: 78, stops: [[0, "#ffffff"], [0.25, "#dfe3e6"], [0.5, "#aeb4b9"], [0.75, "#e6e9eb"], [1, "#9aa1a6"]] })}
        ${S.linear("bezelEdge", { a: 90, stops: [[0, "#6a7076"], [0.5, "#c4c9cd"], [1, "#5d636a"]] })}
        ${S.linear("ear", { a: 90, stops: [[0, "#8a9196"], [0.3, "#e3e7e9"], [0.5, "#b4babe"], [0.7, "#e6e9eb"], [1, "#7f868b"]] })}
        ${S.radial("dialg", { cx: 0.5, cy: 0.42, r: 0.62, stops: [[0, "#27497a"], [0.5, "#142b4e"], [0.85, "#060e1b"], [1, "#02040a"]] })}
        ${S.linear("wg", { a: 135, stops: [[0, "#ffffff"], [0.5, "#dde2e6"], [1, "#9ea6ad"]] })}
        ${S.radial("lume", { cx: 0.4, cy: 0.3, r: 0.9, stops: [[0, "#ffffff"], [0.5, "#eef2ec"], [1, "#c2cac2"]] })}
        ${S.linear("hand", { a: 120, stops: [[0, "#ffffff"], [0.45, "#e6eaee"], [0.65, "#a2aab1"], [1, "#f0f3f5"]] })}
        ${S.linear("crown", { a: 90, stops: [[0, "#858d95"], [0.25, "#f3f6f8"], [0.55, "#aeb6be"], [1, "#747c84"]] })}
        <clipPath id="${S.id("dialclip")}"><path d="${dialPath}"/></clipPath>
      </defs>

      <!-- Integrated bracelet -->
      ${links(0, 1)}${links(100, -1)}
      <!-- Case body with the two hinge ears at 9 and 3 -->
      <path d="M14 32 L8.4 36 Q4.6 50 8.4 64 L14 68 Z" fill="${S.url("ear")}" stroke="#5f666c" stroke-width="0.35"/>
      <path d="M86 32 L91.6 36 Q95.4 50 91.6 64 L86 68 Z" fill="${S.url("ear")}" stroke="#5f666c" stroke-width="0.35"/>
      <line x1="9.6" y1="38" x2="9.6" y2="62" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.5"/>
      <line x1="90.4" y1="38" x2="90.4" y2="62" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.5"/>
      ${S.rect(94.4, 45.2, 4.4, 9.6, { rx: 1.2, fill: S.url("crown") })}
      ${Array.from({ length: 6 }, (_, i) => `<line x1="${S.n(95.2 + i * 0.6)}" y1="45.9" x2="${S.n(95.2 + i * 0.6)}" y2="53.9" stroke="#61686f" stroke-width="0.28" opacity="0.85"/>`).join("")}
      <path d="${roct(50, 50, 41.6, 41.2, 20, 13, 0.46)}" fill="${S.url("case")}"/>
      <path d="${roct(50, 50, 41.6, 41.2, 20, 13, 0.46)}" fill="none" stroke="#4f565c" stroke-width="0.35"/>
      <!-- Porthole bezel: rounded octagon, satin brushed with polished chamfer -->
      <path d="${roct(50, 50, 40.2, 39.6, 19, 12.5, 0.5)}" fill="${S.url("bezel")}"/>
      <path d="${roct(50, 50, 40.2, 39.6, 19, 12.5, 0.5)}" fill="none" stroke="${S.url("bezelEdge")}" stroke-width="0.55"/>
      <path d="${roct(50, 50, 34.6, 33.8, 15.5, 12.5, 0.6)}" fill="#0b1119"/>
      <path d="${roct(50, 50, 34.6, 33.8, 15.5, 12.5, 0.6)}" fill="none" stroke="#2b3238" stroke-width="0.4"/>
      <!-- Dial -->
      <g clip-path="${S.url("dialclip")}">
        ${S.rect(10, 10, 80, 80, { fill: S.url("dialg") })}
        ${grooves}
        ${S.text(50, 36.6, "PATEK PHILIPPE", { size: 2.75, family: S.FONT.sans, weight: 500, color: P, letter: 0.12 })}
        ${S.text(50, 39.6, "GENEVE", { size: 1.55, family: S.FONT.sans, weight: 500, color: P, letter: 0.2 })}
        ${S.text(50, 82.3, "SWISS MADE", { size: 1.0, family: S.FONT.sans, weight: 500, color: P, letter: 0.08 })}
        ${marks}
        <!-- Framed date at 3, replacing the hour marker, hard against the dial edge -->
        ${S.dateWindow(73.6, 47.3, 7.4, 5.4, { fill: "#f4f4ef", color: "#151515", size: 3.9, family: S.FONT.sans, weight: 600, frame: "#d9dee2", frameW: 0.6, rx: 0.3 })}
      </g>
      <!-- Hands -->
      ${S.handGroup("h", hourHand)}
      ${S.handGroup("m", minuteHand)}
      ${S.handGroup("s", secondHand)}
      ${S.crystal(50, 50, 35, { opacity: 0.09 })}
    `;
  }
});
}

/* ==== face: calatrava ==== */
{
registerFace("calatrava", {
  name: "Patek Philippe Calatrava 5227G-015",
  cadence: "sweep",
  draw(S) {
    const INK = "#2a2b2e";        // dial printing
    const R_DIAL = 38.6;
    const WG = S.url("wg");

    /* Railway minute track: two concentric rings with 60 spokes, thicker at 5s. */
    let rail = S.circle(50, 50, 33.4, { fill: "none", stroke: INK, "stroke-width": 0.22 }) +
               S.circle(50, 50, 35.6, { fill: "none", stroke: INK, "stroke-width": 0.22 });
    rail += S.ticks({ count: 60, r1: 33.4, r2: 35.6, w: 0.22, color: INK, skip: (i) => i % 5 === 0 });
    rail += S.ticks({ count: 12, r1: 33.4, r2: 35.6, w: 0.5, color: INK });

    /* Applied white-gold baton markers, faceted; 3 o'clock omitted for the date. */
    let batons = "";
    for (let i = 0; i < 12; i++) {
      if (i === 3) continue;
      const a = i * 30;
      const [x, y] = S.pt(a, 28.9);
      batons += `<g transform="rotate(${a} ${S.n(x)} ${S.n(y)})">${S.rect(x - 0.95, y - 3.9, 1.9, 7.8, { fill: "#7a7f86" })}${S.rect(x - 0.95, y - 3.9, 0.95, 7.8, { fill: WG })}${S.rect(x, y - 3.9, 0.95, 7.8, { fill: "#c9ced3" })}</g>`;
    }

    /* Dauphine hands: two facets each, pivot-local, 12 = -y. */
    const dauphine = (len, w, tail) =>
      `<path d="M0 ${S.n(tail)} L${S.n(-w)} 0 L0 ${S.n(-len)} Z" fill="${S.url("hl")}"/>
       <path d="M0 ${S.n(tail)} L${S.n(w)} 0 L0 ${S.n(-len)} Z" fill="${S.url("hr")}"/>`;
    const hourHand = dauphine(21.5, 1.9, 3.2);
    const minuteHand = dauphine(31.5, 1.6, 3.6);
    const secondHand = `<path d="M-0.32 8.5 L-0.32 -33.4 L0.32 -33.4 L0.32 8.5 Z" fill="#c7ccd1"/>
      <path d="M-0.7 8.5 L-0.7 2.5 L0.7 2.5 L0.7 8.5 Z" fill="#c7ccd1"/><circle r="1.4" fill="#dfe3e6"/><circle r="0.5" fill="#6d737a"/>`;

    return `
      <defs>
        ${S.linear("case", { a: 135, stops: [[0, "#ffffff"], [0.3, "#dfe3e7"], [0.65, "#9ea5ad"], [1, "#e3e7ea"]] })}
        ${S.linear("bez", { a: 120, stops: [[0, "#f4f6f8"], [0.4, "#b9c0c6"], [0.7, "#8d959c"], [1, "#eef1f3"]] })}
        ${S.linear("wg", { a: 90, stops: [[0, "#ffffff"], [0.5, "#e6eaee"], [1, "#b5bcc3"]] })}
        ${S.linear("hl", { a: 60, stops: [[0, "#ffffff"], [0.5, "#d9dee3"], [1, "#a3aab1"]] })}
        ${S.linear("hr", { a: 60, stops: [[0, "#8a9198"], [0.5, "#5d646b"], [1, "#9aa1a8"]] })}
        ${S.radial("dialg", { cx: 0.4, cy: 0.3, r: 0.9, stops: [[0, "#f7f5ee"], [0.6, "#ece9df"], [1, "#d9d5c9"]] })}
        ${S.linear("strap", { a: 0, stops: [[0, "#0c0a09"], [0.2, "#26201c"], [0.5, "#181411"], [0.8, "#26201c"], [1, "#0b0908"]] })}
        <clipPath id="${S.id("dialclip")}"><circle cx="50" cy="50" r="${R_DIAL}"/></clipPath>
      </defs>

      <!-- Black alligator strap, scaled squares -->
      <g>
        ${S.rect(32.5, 0, 35, 16, { fill: S.url("strap") })}
        ${S.rect(32.5, 84, 35, 16, { fill: S.url("strap") })}
        ${[2, 7, 12].map(y => `<line x1="34" y1="${y}" x2="66" y2="${y + 0.3}" stroke="#3a312b" stroke-width="0.35" opacity="0.8"/>`).join("")}
        ${[88, 93, 98].map(y => `<line x1="34" y1="${y}" x2="66" y2="${y + 0.3}" stroke="#3a312b" stroke-width="0.35" opacity="0.8"/>`).join("")}
        <line x1="42" y1="0" x2="42.5" y2="16" stroke="#3a312b" stroke-width="0.3" opacity="0.7"/><line x1="58" y1="0" x2="57.5" y2="16" stroke="#3a312b" stroke-width="0.3" opacity="0.7"/>
        <line x1="42.5" y1="84" x2="42" y2="100" stroke="#3a312b" stroke-width="0.3" opacity="0.7"/><line x1="57.5" y1="84" x2="58" y2="100" stroke="#3a312b" stroke-width="0.3" opacity="0.7"/>
        <line x1="50" y1="0" x2="50" y2="4" stroke="#d9c9a0" stroke-width="0.5"/><line x1="50" y1="96" x2="50" y2="100" stroke="#d9c9a0" stroke-width="0.5"/>
      </g>
      <!-- Officer's-style straight lugs with screwed bars -->
      <path d="M27.5 30 L30.6 6.2 Q31 4.2 33 4.2 L38.6 4.2 L40 24 Z M72.5 30 L69.4 6.2 Q69 4.2 67 4.2 L61.4 4.2 L60 24 Z" fill="${S.url("case")}"/>
      <path d="M27.5 70 L30.6 93.8 Q31 95.8 33 95.8 L38.6 95.8 L40 76 Z M72.5 70 L69.4 93.8 Q69 95.8 67 95.8 L61.4 95.8 L60 76 Z" fill="${S.url("case")}"/>
      <path d="M30.6 6.2 L34 6.2 M69.4 6.2 L66 6.2 M30.6 93.8 L34 93.8 M69.4 93.8 L66 93.8" stroke="#6b7278" stroke-width="0.3"/>
      ${[[34.6, 8.6], [65.4, 8.6], [34.6, 91.4], [65.4, 91.4]].map(([x, y]) => S.circle(x, y, 1.25, { fill: "#d5dade", stroke: "#7c848b", "stroke-width": 0.25 }) + `<line x1="${x - 0.8}" y1="${y}" x2="${x + 0.8}" y2="${y}" stroke="#5f666d" stroke-width="0.3"/>`).join("")}
      <!-- Crown -->
      ${S.rect(93.6, 46.4, 4.2, 7.2, { rx: 1, fill: S.url("case") })}
      ${Array.from({ length: 5 }, (_, i) => `<line x1="${S.n(94.4 + i * 0.7)}" y1="47" x2="${S.n(94.4 + i * 0.7)}" y2="52.9" stroke="#7b838a" stroke-width="0.25"/>`).join("")}
      <!-- Polished round case, thin bezel -->
      ${S.circle(50, 50, 44.4, { fill: S.url("case") })}
      ${S.circle(50, 50, 41.6, { fill: S.url("bez") })}
      ${S.circle(50, 50, 43.2, { fill: "none", stroke: "#ffffff", "stroke-width": 0.45, opacity: 0.85 })}
      ${S.circle(50, 50, 39.6, { fill: "#6e757c" })}
      ${S.circle(50, 50, 39.1, { fill: "#c9cdd1" })}
      <!-- Dial -->
      ${S.circle(50, 50, R_DIAL, { fill: S.url("dialg") })}
      <g clip-path="${S.url("dialclip")}">
        ${rail}
        ${batons}
        ${S.text(50, 25.4, "PATEK PHILIPPE", { size: 2.75, family: S.FONT.serif, weight: 500, color: INK, letter: 0.35 })}
        ${S.text(50, 28.6, "GENEVE", { size: 1.75, family: S.FONT.serif, weight: 400, color: INK, letter: 0.55 })}
        ${S.text(50, 79.2, "SWISS MADE", { size: 1.35, family: S.FONT.sans, weight: 500, color: INK, letter: 0.2 })}
        <!-- Framed date at 3 -->
        ${S.rect(71.6, 47.2, 6.6, 5.6, { fill: "#4b5157" })}
        ${S.rect(71.9, 47.5, 6.0, 5.0, { fill: "#f4f2ea" })}
        ${S.rect(71.3, 46.9, 7.2, 6.2, { fill: "none", stroke: WG, "stroke-width": 0.6 })}
        ${S.text(74.9, 50.1, "31", { size: 3.7, family: S.FONT.sans, weight: 500, color: "#1a1b1d", data: { "data-text": "date" } })}
      </g>
      <!-- Hands -->
      ${S.handGroup("h", hourHand)}
      ${S.handGroup("m", minuteHand)}
      ${S.handGroup("s", secondHand)}
      ${S.crystal(50, 50, R_DIAL + 1, { opacity: 0.12 })}

  }
});
}

/* ==== face: tank ==== */
{
registerFace("tank", {
  name: "Cartier Tank Louis Cartier WGTA0342",
  cadence: "tick",
  draw(S) {
    const INK = "#1a1a1c";
    const GOLD = S.url("gold"), GOLD2 = S.url("gold2");
    /* Geometry: case x 24-76, y 15-85; dial x 31-69, y 22-78; railway x 39-61, y 31-69 */
    const DX0 = 31, DX1 = 69, DY0 = 19.5, DY1 = 80.5;
    const RX0 = 39.5, RX1 = 60.5, RY0 = 30.5, RY1 = 69.5;

    /* Elongated Roman numerals along the rectangle perimeter. [label, x, y, sx, sy] */
    const nums = [
      ["XII", 50, 25, 0.8, 2.0], ["XI", 36.6, 25, 0.8, 2.0], ["I", 63.8, 25, 0.8, 2.0],
      ["VI", 50, 75, 0.8, 2.0], ["VII", 36.6, 75, 0.8, 2.0], ["V", 63.8, 75, 0.8, 2.0],
      ["II", 64.8, 38, 1.05, 1.35], ["III", 64.8, 50, 1.0, 1.35], ["IIII", 64.8, 62, 0.8, 1.35],
      ["X", 35.2, 38, 1.05, 1.35], ["IX", 35.2, 50, 1.0, 1.35], ["VIII", 35.2, 62, 0.8, 1.35],
    ];
    let numerals = "";
    for (const [t, x, y, sx, sy] of nums) {
      numerals += `<text x="0" y="0" transform="translate(${x} ${y}) scale(${sx} ${sy})" font-family="${S.FONT.serif}" font-size="5.8" font-weight="500" fill="${INK}" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.3">${t}</text>`;
    }

    /* Chemin-de-fer: two rectangles with minute ticks between them. */
    const perimPt = (u) => {  /* u in [0,1) clockwise from top-left corner along the outer railway rect */
      const w = RX1 - RX0, h = RY1 - RY0, P = 2 * (w + h);
      let d = u * P;
      if (d < w) return [RX0 + d, RY0, 0];
      d -= w; if (d < h) return [RX1, RY0 + d, 1];
      d -= h; if (d < w) return [RX1 - d, RY1, 2];
      d -= w; return [RX0, RY1 - d, 3];
    };
    const G = 1.4; // gap between the two rails
    let rail = `<rect x="${RX0}" y="${RY0}" width="${RX1 - RX0}" height="${RY1 - RY0}" fill="none" stroke="${INK}" stroke-width="0.35"/>`;
    rail += `<rect x="${RX0 + G}" y="${RY0 + G}" width="${RX1 - RX0 - 2 * G}" height="${RY1 - RY0 - 2 * G}" fill="none" stroke="${INK}" stroke-width="0.35"/>`;
    // 60 minute ticks: 17 per long side, 13 per short side (approx. proportional)
    const nTop = 13, nSide = 17;
    const tick = (x0, y0, x1, y1) => `<line x1="${S.n(x0)}" y1="${S.n(y0)}" x2="${S.n(x1)}" y2="${S.n(y1)}" stroke="${INK}" stroke-width="0.32"/>`;
    for (let i = 0; i <= nTop; i++) {
      const x = RX0 + (RX1 - RX0) * i / nTop;
      rail += tick(x, RY0, x, RY0 + G) + tick(x, RY1 - G, x, RY1);
    }
    for (let i = 0; i <= nSide; i++) {
      const y = RY0 + (RY1 - RY0) * i / nSide;
      rail += tick(RX0, y, RX0 + G, y) + tick(RX1 - G, y, RX1, y);
    }

    /* Blued-steel sword hands, pivot-local. */
    const hourHand = `<path d="M-1.9 1.4 L-1.9 -2.5 L0 -16 L1.9 -2.5 L1.9 1.4 Z" fill="${S.url("blue")}"/><circle r="1.7" fill="${S.url("blue")}"/>`;
    const minuteHand = `<path d="M-1.5 1.4 L-1.5 -3 L0 -24 L1.5 -3 L1.5 1.4 Z" fill="${S.url("blue")}"/><circle r="1.05" fill="#0e1a3a"/>`;

    /* Alligator strap scales. */
    let scales = "";
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const w = 9.2, h = 3.6, x = 31.6 + c * 9.5, y0 = 0.4 + r * 3.9, y1 = 86.2 + r * 3.9;
      scales += S.rect(x, y0, w, h, { rx: 1.1, fill: S.url("scale") }) + S.rect(x, y1, w, h, { rx: 1.1, fill: S.url("scale") });
    }

    return `
      <defs>
        ${S.linear("gold", { a: 100, stops: [[0, "#fff1b8"], [0.25, "#e3bf62"], [0.55, "#b8903c"], [0.8, "#f3d98a"], [1, "#a97f2e"]] })}
        ${S.linear("gold2", { a: 0, stops: [[0, "#8d6a25"], [0.2, "#f2d791"], [0.5, "#c59d48"], [0.8, "#f6e2a5"], [1, "#8d6a25"]] })}
        ${S.radial("dial", { cx: 0.45, cy: 0.35, r: 0.9, stops: [[0, "#f7f5ee"], [0.6, "#ebe8df"], [1, "#d9d5ca"]] })}
        ${S.linear("blue", { a: 110, stops: [[0, "#4a6fc8"], [0.4, "#1d3a8a"], [0.7, "#0b1d4d"], [1, "#2e4fa3"]] })}
        ${S.radial("cab", { cx: 0.35, cy: 0.3, r: 0.8, stops: [[0, "#7ea1ff"], [0.5, "#1f3fae"], [1, "#0a1650"]] })}
        ${S.linear("strap", { a: 0, stops: [[0, "#2a170d"], [0.5, "#4a2c1a"], [1, "#24130a"]] })}
        ${S.linear("scale", { a: 90, stops: [[0, "#5e3a22"], [0.5, "#3f2413"], [1, "#2c170b"]] })}
        <clipPath id="${S.id("dclip")}"><rect x="${DX0}" y="${DY0}" width="${DX1 - DX0}" height="${DY1 - DY0}"/></clipPath>
      </defs>

      <!-- Alligator strap stubs -->
      ${S.rect(30.5, 0, 39, 16, { fill: S.url("strap") })}
      ${S.rect(30.5, 84, 39, 16, { fill: S.url("strap") })}
      ${scales}
      <!-- Case body behind dial, then brancards running into the strap -->
      ${S.rect(29, 15, 42, 70, { fill: GOLD })}
      ${S.rect(24, 11, 6.6, 78, { rx: 2.4, fill: GOLD2 })}
      ${S.rect(69.4, 11, 6.6, 78, { rx: 2.4, fill: GOLD2 })}
      <line x1="25.4" y1="13" x2="25.4" y2="87" stroke="#fff5c8" stroke-width="0.35" opacity="0.7"/>
      <line x1="74.6" y1="13" x2="74.6" y2="87" stroke="#fff5c8" stroke-width="0.35" opacity="0.7"/>
      <!-- Crown with sapphire cabochon -->
      ${S.rect(75.6, 47.0, 3.8, 6.0, { rx: 0.7, fill: S.url("gold2") })}
      ${S.circle(80.4, 50, 2.3, { fill: S.url("cab") })}
      ${S.circle(79.7, 49.2, 0.6, { fill: "#cfe0ff", opacity: 0.8 })}
      <!-- Bezel step and dial -->
      ${S.rect(DX0 - 0.8, DY0 - 0.8, DX1 - DX0 + 1.6, DY1 - DY0 + 1.6, { fill: "#8a6a2a" })}
      ${S.rect(DX0, DY0, DX1 - DX0, DY1 - DY0, { fill: S.url("dial") })}
      <g clip-path="${S.url("dclip")}">
        ${rail}
        ${numerals}
        ${S.text(50, 35.6, "Cartier", { size: 3.6, family: S.FONT.serif, weight: 400, color: INK, italic: true, letter: -0.05 })}
        ${S.text(50, 79.6, "SWISS MADE", { size: 1.0, family: S.FONT.sans, weight: 500, color: INK, letter: 0.1 })}
      </g>
      ${S.handGroup("h", hourHand)}
      ${S.handGroup("m", minuteHand)}
      <rect x="${DX0}" y="${DY0}" width="${DX1 - DX0}" height="${DY1 - DY0}" fill="${S.url("cab")}" opacity="0"/>
      <path d="M${DX0} ${DY0} L${DX1} ${DY0} L${DX0} ${DY0 + 30} Z" fill="#fff" opacity="0.07"/>
    `;
  }
});
}

/* ==== face: lange1 ==== */
{
registerFace("lange1", {
  name: "A. Lange & Söhne Lange 1",
  cadence: "sweep",
  draw(S) {
    const INK = "#2b2a2c";
    const R_DIAL = 38.2;
    const GOLD = S.url("gold");
    const TC = [37.6, 44.6], TR = 21.2;       // time subdial centre / radius
    const SC = [64.6, 68.6], SR = 11.4;       // small seconds
    const PC = [66.5, 50.2], PR = 10.2;       // power reserve pivot / scale radius

    /* Time subdial: Roman numerals + railway minute track. */
    let timeDial = S.circle(TC[0], TC[1], TR, { fill: S.url("sub") });
    timeDial += S.circle(TC[0], TC[1], TR - 0.6, { fill: "none", stroke: INK, "stroke-width": 0.2 });
    timeDial += S.circle(TC[0], TC[1], TR - 2.1, { fill: "none", stroke: INK, "stroke-width": 0.2 });
    timeDial += S.ticks({ count: 60, r1: TR - 2.1, r2: TR - 0.6, w: 0.2, color: INK, cx: TC[0], cy: TC[1], skip: (i) => i % 5 === 0 });
    timeDial += S.ticks({ count: 12, r1: TR - 2.1, r2: TR - 0.6, w: 0.5, color: INK, cx: TC[0], cy: TC[1] });
    timeDial += S.numerals({ count: 12, r: TR - 4.6, size: 3.3, family: S.FONT.serif, weight: 500, color: INK, cx: TC[0], cy: TC[1],
      labels: ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"], start: 0, upright: true });

    /* Small seconds: railway track, arabic 15/30/45/60. */
    let secDial = S.circle(SC[0], SC[1], SR, { fill: S.url("sub") });
    secDial += S.circle(SC[0], SC[1], SR - 0.5, { fill: "none", stroke: INK, "stroke-width": 0.18 });
    secDial += S.circle(SC[0], SC[1], SR - 1.6, { fill: "none", stroke: INK, "stroke-width": 0.18 });
    secDial += S.ticks({ count: 60, r1: SR - 1.6, r2: SR - 0.5, w: 0.16, color: INK, cx: SC[0], cy: SC[1], skip: (i) => i % 5 === 0 });
    secDial += S.ticks({ count: 12, r1: SR - 1.6, r2: SR - 0.5, w: 0.4, color: INK, cx: SC[0], cy: SC[1] });
    secDial += S.numerals({ count: 4, r: SR - 3.6, size: 2.2, family: S.FONT.sans, weight: 400, color: INK, cx: SC[0], cy: SC[1], labels: ["60", "15", "30", "45"], start: 0 });

    /* Power reserve: arc scale opening to the right, AUF at top, AB at bottom, red low segment. */
    const a0 = 42, a1 = 138;
    const arc = (r, s, e, w, col) => `<path d="M${S.p(s, r, PC[0], PC[1])} A${r} ${r} 0 0 1 ${S.p(e, r, PC[0], PC[1])}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
    let pr = arc(PR, a0, a1, 0.25, INK) + arc(PR - 1.6, a0, a1, 0.25, INK) + arc(PR - 0.8, a1 - 18, a1, 1.6, "#c0392b");
    pr += S.ticks({ count: 13, r1: PR - 1.6, r2: PR, w: 0.25, color: INK, cx: PC[0], cy: PC[1], start: a0, step: (a1 - a0) / 12 });
    pr += S.text(...S.pt(a0 - 6, PR + 2.3, PC[0], PC[1]), "AUF", { size: 1.55, family: S.FONT.sans, weight: 600, color: INK, letter: 0.2 });
    pr += S.text(...S.pt(a1 + 6, PR + 3.2, PC[0], PC[1]), "AB", { size: 1.55, family: S.FONT.sans, weight: 600, color: INK, letter: 0.2 });
    pr += `<g transform="translate(${PC[0]} ${PC[1]}) rotate(${a0 + 12})"><path d="M-0.5 1.4 L-0.35 -${PR - 2.6} L0 -${PR - 1.2} L0.35 -${PR - 2.6} L0.5 1.4 Z" fill="${GOLD}"/><circle r="0.9" fill="${GOLD}"/></g>`;

    /* Hands: lance shapes, pivot-local. */
    const lance = (len, w, tail) => `<path d="M0 ${S.n(tail)} L${S.n(-w)} ${S.n(-len * 0.55)} L0 ${S.n(-len)} L${S.n(w)} ${S.n(-len * 0.55)} Z" fill="${GOLD}"/>
      <path d="M0 ${S.n(tail)} L${S.n(-w)} ${S.n(-len * 0.55)} L0 ${S.n(-len)} Z" fill="#7a5a3a" opacity="0.35"/><circle r="1.1" fill="${GOLD}"/>`;

    return `
      <defs>
        ${S.linear("case", { a: 135, stops: [[0, "#fbe9d6"], [0.3, "#e2b48c"], [0.65, "#a8734a"], [1, "#efcaa6"]] })}
        ${S.linear("gold", { a: 60, stops: [[0, "#f6d9b8"], [0.5, "#d19c6c"], [1, "#a06a42"]] })}
        ${S.radial("dialg", { cx: 0.45, cy: 0.35, r: 0.9, stops: [[0, "#f3f2ee"], [0.6, "#e6e5df"], [1, "#d4d3cc"]] })}
        ${S.radial("sub", { cx: 0.5, cy: 0.4, r: 0.8, stops: [[0, "#fbfaf7"], [1, "#e9e8e2"]] })}
        ${S.linear("strap", { a: 0, stops: [[0, "#2a1509"], [0.25, "#6b3a1c"], [0.5, "#4a2711"], [0.75, "#6b3a1c"], [1, "#2a1509"]] })}
        <clipPath id="${S.id("dialclip")}"><circle cx="50" cy="50" r="${R_DIAL}"/></clipPath>
      </defs>
      <!-- Brown alligator strap -->
      ${S.rect(33, 0, 34, 15, { fill: S.url("strap") })}${S.rect(33, 85, 34, 15, { fill: S.url("strap") })}
      ${[3, 8, 13, 87, 92, 97].map(y => `<line x1="33" y1="${y}" x2="67" y2="${y + 0.4}" stroke="#2a1509" stroke-width="0.4" opacity="0.8"/>`).join("")}
      <line x1="45" y1="0" x2="45.5" y2="15" stroke="#2a1509" stroke-width="0.35"/><line x1="55" y1="0" x2="54.5" y2="15" stroke="#2a1509" stroke-width="0.35"/>
      <line x1="45.5" y1="85" x2="45" y2="100" stroke="#2a1509" stroke-width="0.35"/><line x1="54.5" y1="85" x2="55" y2="100" stroke="#2a1509" stroke-width="0.35"/>
      <!-- Lugs, crown at 3, date pusher at 10 -->
      <path d="M27 30 Q29 8 37 5 L63 5 Q71 8 73 30 Z" fill="${S.url("case")}"/>
      <path d="M27 70 Q29 92 37 95 L63 95 Q71 92 73 70 Z" fill="${S.url("case")}"/>
      ${S.rect(93.4, 46.2, 4.6, 7.6, { rx: 1, fill: S.url("case") })}

    const d = String(t.date).padStart(2, "0");
    const a = svg.querySelector(S.ref("d10")), b = svg.querySelector(S.ref("d1"));
    if (a && a.textContent !== d[0]) a.textContent = d[0];
    if (b && b.textContent !== d[1]) b.textContent = d[1];
  }
});
}

/* ==== face: daytona ==== */
{

    /* Tachymeter bezel: 60 at 12, UNITS PER HOUR, then 400..65. Angle = 21600 / N. */
    const tach = [60, 400, 300, 240, 200, 180, 160, 140, 130, 120, 110, 100, 90, 80, 70, 65];
    let bezel = "";
    tach.forEach((n, i) => {
      const a = (21600 / n) % 360;
      const [x, y] = S.pt(a, 39.4);
      bezel += `<text x="${S.n(x)}" y="${S.n(y)}" transform="rotate(${S.n(a)} ${S.n(x)} ${S.n(y)})" font-family="${S.FONT.cond}" font-weight="700" font-size="4" fill="${S.url("plat")}" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.15">${n}</text>`;
      if (i > 0) {

    const subHand = `<path d="M-0.42 1.8 L-0.42 -4.4 L0 -5.6 L0.42 -4.4 L0.42 1.8 Z" fill="${HAND}"/><circle r="0.75" fill="${HAND}"/><circle r="0.3" fill="#2a2d31"/>`;

    const minuteHand = `<path d="M-1.45 3 L-1.45 -22.5 L0 -30.6 L1.45 -22.5 L1.45 3 Z" fill="${HAND}"/><path d="M-0.85 -2.6 L-0.85 -22 L0 -27.6 L0.85 -22 L0.85 -2.6 Z" fill="${LUME}"/>`;

    return `

        ${S.radial("subface", { cx: 0.4, cy: 0.35, r: 0.9, stops: [[0, "#ffffff"], [1, "#e6e6e2"]] })}
        ${S.radial("lume", { cx: 0.35, cy: 0.3, r: 0.9, stops: [[0, "#ffffff"], [0.6, "#f4f6f1"], [1, "#d8ddd6"]] })}
        ${S.linear("hand", { a: 120, stops: [[0, "#f4f6f8"], [0.4, "#b9c1c8"], [0.62, "#6c747c"], [1, "#c9d0d6"]] })}
        ${S.linear("wg", { a: 135, stops: [[0, "#f6f8fa"], [0.45, "#aab2ba"], [0.7, "#7b838b"], [1, "#d3d9de"]] })}
        ${S.linear("crown", { a: 90, stops: [[0, "#858d95"], [0.22, "#f3f6f8"], [0.55, "#aeb6be"], [1, "#747c84"]] })}
        <clipPath id="${S.id("dialclip")}"><circle cx="50" cy="50" r="${R_DIAL}"/></clipPath>

      <path d="M43.2 0 V13.5 M56.8 0 V13.5 M43.2 86.5 V100 M56.8 86.5 V100" stroke="#4d545c" stroke-width="0.5"/>
      <path d="M31.5 6.2 H68.5 M31.5 93.8 H68.5" stroke="#3f464e" stroke-width="0.7"/>
      <!-- Lugs, case, pushers, crown -->
      <path d="M25.5 27 Q28 9.5 42 6.4 L58 6.4 Q72 9.5 74.5 27 Z" fill="${S.url("case")}"/>
      <path d="M25.5 73 Q28 90.5 42 93.6 L58 93.6 Q72 90.5 74.5 73 Z" fill="${S.url("case")}"/>
      ${[-30, 30].map((r) => `<g transform="rotate(${r} 50 50)"><path d="M89 45.6 H93.8 V54.4 H89 Z" fill="#8a929a"/>${S.rect(93.4, 46.1, 3.9, 7.8, { rx: 1.1, fill: S.url("crown") })}${Array.from({ length: 5 }, (_, i) => `<line x1="${S.n(94.2 + i * 0.65)}" y1="46.6" x2="${S.n(94.2 + i * 0.65)}" y2="53.4" stroke="#61686f" stroke-width="0.28"/>`).join("")}</g>`).join("")}
      <path d="M88.5 43.2 Q95.4 42.2 95.6 50 Q95.4 57.8 88.5 56.8 Z" fill="${S.url("case")}"/>
      <path d="M92.4 46.4 H94.6 V53.6 H92.4 Z" fill="#7d858d"/>
      ${S.rect(94.4, 45, 4.6, 10, { rx: 1.3, fill: S.url("crown") })}
      ${Array.from({ length: 7 }, (_, i) => `<line x1="${S.n(95 + i * 0.6)}" y1="45.7" x2="${S.n(95 + i * 0.6)}" y2="54.3" stroke="#61686f" stroke-width="0.28" opacity="0.85"/>`).join("")}
      ${S.circle(50, 50, 44.6, { fill: S.url("case") })}
      ${S.circle(50, 50, 43.7, { fill: "none", stroke: "#f2f5f7", "stroke-width": 0.5 })}

      ${S.circle(50, 50, 35.7, { fill: "none", stroke: S.url("plat"), "stroke-width": 0.7 })}
      ${S.circle(50, 50, 35.3, { fill: "#2a2d31" })}

/* ==== face: gmt ==== */
{
registerFace("gmt", {
  name: "Rolex GMT-Master II",
  cadence: "sweep",
  draw(S) {
    const WG = "#e8ecef";
    const LUME = S.url("lume");
    const P = "#f1f2ee";
    const R_DIAL = 33.2, R_MK = 24.6;
    const ln = (a, r1, r2, stroke, w) => `<line x1="${S.p(a, r1).replace(" ", '" y1="')}" x2="${S.p(a, r2).replace(" ", '" y2="')}" stroke="${stroke}" stroke-width="${w}"/>`;

    /* 24-hour bichrome bezel: blue 18->24->6 (top), red 6->12->18 (bottom). */
    const tri = (deg, rO, rI, half, fill) => `<path d="M${S.p(deg, rO)} L${S.p(deg - half, rI)} L${S.p(deg + half, rI)} Z" fill="${fill}"/>`;
    let bezel = "";
    for (let h = 1; h < 24; h++) {
      const a = h * 15;
      if (h % 2) bezel += tri(a, 41.0, 38.2, 2.4, S.url("plat"));
    }
    const labels = [], skip = [];
    for (let h = 2; h <= 22; h += 2) labels.push(String(h));
    const bznum = S.numerals({ count: 11, start: 30, step: 30, r: 39.2, size: 5.4, family: S.FONT.cond, weight: 700, color: S.url("plat"), upright: false, labels, letter: -0.3 });

    let knurl = "";
    for (let i = 0; i < 120; i++) knurl += ln(i * 3, 42.5, 44.6, i % 2 ? "#6d757d" : "#e4e8ec", 1.1);

    /* Maxi plots. */
    let plots = "";
    for (const i of [1, 2, 4, 5, 7, 8, 10, 11]) {
      const [x, y] = S.pt(i * 30, R_MK);
      plots += S.circle(x, y, 2.85, { fill: WG }) + S.circle(x, y, 2.2, { fill: LUME });
    }
    const baton = (deg) => {
      const [x, y] = S.pt(deg, R_MK - 0.4);
      return `<g transform="rotate(${deg} ${S.n(x)} ${S.n(y)})">${S.rect(x - 2.3, y - 4.6, 4.6, 9.2, { rx: 0.5, fill: WG })}${S.rect(x - 1.65, y - 3.95, 3.3, 7.9, { rx: 0.3, fill: LUME })}</g>`;
    };
    plots += baton(180) + baton(270);
    plots += `<path d="M45.2 21.2 H54.8 L50 29.6 Z" fill="${WG}"/><path d="M46.5 22 H53.5 L50 28.2 Z" fill="${LUME}"/>`;

    /* Hands. */
    const H = S.url("hand");
    const hourHand = `<path d="M-1.6 2.6 L-1.6 -11 L-2.4 -11 L0 -21.6 L2.4 -11 L1.6 -11 L1.6 2.6 Z" fill="${H}"/>
      <circle cx="0" cy="-13.6" r="3.35" fill="${H}"/>
      <path d="M0 -13.6 L0 -16.5 A2.9 2.9 0 0 1 2.5 -12.1 Z M0 -13.6 L2.5 -12.1 A2.9 2.9 0 0 1 -2.5 -12.1 Z M0 -13.6 L-2.5 -12.1 A2.9 2.9 0 0 1 0 -16.5 Z" fill="${LUME}"/>
      <path d="M0 -13.6 L0 -16.5 M0 -13.6 L2.5 -12.1 M0 -13.6 L-2.5 -12.1" stroke="${H}" stroke-width="0.55"/>`;
    const minuteHand = `<path d="M-1.5 3 L-1.5 -20 L0 -31.6 L1.5 -20 L1.5 3 Z" fill="${H}"/>
      <path d="M-0.8 -2 L-0.8 -19.6 L0 -27.5 L0.8 -19.6 L0.8 -2 Z" fill="${LUME}"/>`;
    const secondHand = `<path d="M-0.45 8.5 L-0.45 -30.2 L0.45 -30.2 L0.45 8.5 Z" fill="${H}"/>
      <circle cx="0" cy="-22.5" r="2.05" fill="${H}"/><circle cx="0" cy="-22.5" r="1.45" fill="${LUME}"/>
      <circle r="1.9" fill="${H}"/><circle r="0.7" fill="#2b2f34"/>`;
    const gmtHand = `<path d="M-0.75 3.5 L-0.75 -22.5 L0.75 -22.5 L0.75 3.5 Z" fill="${S.url("red")}"/>
      <path d="M-3.4 -22 L0 -29.6 L3.4 -22 Z" fill="${S.url("red")}"/>
      <path d="M-2.4 -22.7 L0 -28 L2.4 -22.7 Z" fill="${LUME}"/>
      <circle r="1.5" fill="${S.url("red")}"/>`;

    /* Jubilee bracelet: two brushed outer links, three polished centre links. */
    const jub = (y0, y1) => {
      let g = S.rect(31.5, y0, 37, y1 - y0, { fill: S.url("brace") });
      g += S.rect(40.4, y0, 19.2, y1 - y0, { fill: S.url("jubc") });
      for (const x of [40.4, 46.8, 53.2, 59.6]) g += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="#3f464e" stroke-width="0.45"/>`;
      for (let y = y0 + 0.5; y < y1; y += 4.4) {
        g += `<line x1="31.5" y1="${S.n(y)}" x2="40.4" y2="${S.n(y)}" stroke="#3f464e" stroke-width="0.55"/><line x1="59.6" y1="${S.n(y)}" x2="68.5" y2="${S.n(y)}" stroke="#3f464e" stroke-width="0.55"/>`;
        g += `<line x1="40.4" y1="${S.n(y + 2.2)}" x2="59.6" y2="${S.n(y + 2.2)}" stroke="#5a626a" stroke-width="0.4"/>`;
      }
      return g;
    };

    return `
      <defs>

/* ==== face: seiko5 ==== */
{
registerFace("seiko5", {
  name: "Seiko 5 Sports SRPD51",

    const LUME = S.url("lume");
    const RIM = "#dfe4e8";          // polished marker surrounds
    const P = "#f2f3f0";            // dial printing
    const R_DIAL = 32.6, R_MK = 25.2;
    const L = (a, r1, r2, col, w) => { const [x1, y1] = S.pt(a, r1), [x2, y2] = S.pt(a, r2); return `<line x1="${S.n(x1)}" y1="${S.n(y1)}" x2="${S.n(x2)}" y2="${S.n(y2)}" stroke="${col}" stroke-width="${w}"/>`; };

    /* Bezel: 60-minute scale, big numerals 10..50, batons at other 5s, dots on 1..14. */
    let bezel = "";
    for (let i = 1; i < 60; i++) {
      const a = i * 6;
      if (i % 5 === 0) { if (i % 10) bezel += L(a, 37.0, 41.0, "#eef1f3", 1.5); }
      else if (i < 15) { const [x, y] = S.pt(a, 39.3); bezel += S.circle(x, y, 0.55, { fill: "#e8ecef" }); }
    }
    const bznum = S.numerals({ count: 5, start: 60, step: 60, r: 38.9, size: 5.4, family: S.FONT.cond, weight: 700, color: "#f4f6f8", upright: false, labels: ["10", "20", "30", "40", "50"], letter: -0.2 });
    let knurl = "";
    for (let i = 0; i < 120; i++) knurl += L(i * 3, 42.6, 44.6, i % 2 ? "#5d656d" : "#e6eaee", 1.15);

    /* Markers: inverted triangle at 12, circles, rounded batons at 6 and 9; all rimmed. */
    let plots = "";
    for (const i of [1, 2, 4, 5, 7, 8, 10, 11]) {
      const [x, y] = S.pt(i * 30, R_MK);
      plots += S.circle(x, y, 2.75, { fill: RIM }) + S.circle(x, y, 2.2, { fill: LUME });
    }
    const baton = (deg) => {
      const [x, y] = S.pt(deg, R_MK - 0.3);
      return `<g transform="rotate(${deg} ${S.n(x)} ${S.n(y)})">${S.rect(x - 2.25, y - 4.3, 4.5, 8.6, { rx: 1.6, fill: RIM })}${S.rect(x - 1.7, y - 3.75, 3.4, 7.5, { rx: 1.3, fill: LUME })}</g>`;

    plots += baton(180) + baton(270);
    plots += `<path d="M45 20.6 H55 L50 29.8 Z" fill="${RIM}"/><path d="M46.2 21.4 H53.8 L50 28.4 Z" fill="${LUME}"/>`;

    /* Hands: broad arrow hour, pointed minute, red-tail seconds with lume dot. */
    const hourHand = `<path d="M-1.5 3.2 L-1.5 -11.5 L-4.3 -11.5 L0 -20.6 L4.3 -11.5 L1.5 -11.5 L1.5 3.2 Z" fill="${S.url("hand")}"/>

      <path d="M-0.8 -2.5 L-0.8 -22.6 L0 -27.6 L0.8 -22.6 L0.8 -2.5 Z" fill="${LUME}"/>`;
    const secondHand = `<path d="M-0.4 9.5 L-0.4 -30.5 L0.4 -30.5 L0.4 9.5 Z" fill="${S.url("hand")}"/>
      <path d="M-0.55 9.5 L-0.55 1.5 L0.55 1.5 L0.55 9.5 Z" fill="#d1232a"/>
      <circle cx="0" cy="-25" r="1.5" fill="${S.url("hand")}"/><circle cx="0" cy="-25" r="1.0" fill="${LUME}"/>
      <circle r="1.7" fill="${S.url("hand")}"/><circle r="0.6" fill="#3a3f45"/>`;

    /* Crown at 4 o'clock. */
    const crown = `<g transform="rotate(30 50 50)">
      <path d="M88 47 L94.4 46.2 L94.4 53.8 L88 53 Z" fill="${S.url("case")}"/>
      ${S.rect(94.2, 45.4, 4.2, 9.2, { rx: 1.2, fill: S.url("crown") })}
      ${Array.from({ length: 6 }, (_, i) => `<line x1="${S.n(94.9 + i * 0.6)}" y1="46" x2="${S.n(94.9 + i * 0.6)}" y2="54" stroke="#5d646b" stroke-width="0.28"/>`).join("")}
    </g>`;

    return `
      <defs>
        ${S.linear("brace", { a: 90, stops: [[0, "#6a727a"], [0.14, "#e6eaee"], [0.5, "#a8b0b8"], [0.86, "#e6eaee"], [1, "#666e76"]] })}

      <!-- White chapter ring with minute track -->

/* ==== face: bigbang ==== */
{
registerFace("bigbang", {

    /* H-shaped titanium screws on the bezel (12, 2, 4, 6, 8, 10). */
    const hScrew = (deg, r, sz = 2.1, rot = 0) => {
      const [x, y] = S.pt(deg, r);
      const s = sz, b = s * 0.36;
      return `<g transform="translate(${S.n(x)} ${S.n(y)}) rotate(${rot})">

        <rect x="${S.n(-s * 0.72)}" y="${S.n(-s * 0.62)}" width="${S.n(b)}" height="${S.n(s * 1.24)}" fill="#33373b"/>
        <rect x="${S.n(s * 0.72 - b)}" y="${S.n(-s * 0.62)}" width="${S.n(b)}" height="${S.n(s * 1.24)}" fill="#33373b"/>
        <rect x="${S.n(-s * 0.72 + b)}" y="${S.n(-b / 2)}" width="${S.n(s * 1.44 - 2 * b)}" height="${S.n(b)}" fill="#33373b"/></g>`;
    };
    let screws = "";
    for (let i = 0; i < 6; i++) screws += hScrew(i * 60, 40.4, 2.05, 14);

    /* Rubber strap with the Big Bang's longitudinal structured lines. */
    const strap = (y0, y1) => {
      let g = S.rect(32.5, y0, 35, y1 - y0, { fill: S.url("rubber") });
      for (let i = 0; i < 7; i++) {
        const x = 35.5 + i * 4.85;
        g += S.rect(x, y0, 1.6, y1 - y0, { fill: "#050505" }) + S.rect(x + 1.6, y0, 0.5, y1 - y0, { fill: "#2c2d2f" });

    };

    /* Movement parts seen through the skeleton dial. */
    const gear = (cx, cy, r, teeth, fill) => {
      let d = "";
      for (let i = 0; i < teeth; i++) {

        d += `${i ? "L" : "M"}${S.p(a0, r, cx, cy)} L${S.p(a0 + 360 / teeth * 0.25, r * 0.87, cx, cy)} L${S.p(a1, r * 0.87, cx, cy)} L${S.p(a1 + 360 / teeth * 0.25, r, cx, cy)} `;

      ${S.circle(50, 66.5, 1.0, { fill: "#c9cdd1" })}
      <!-- bridges -->
      <path d="M31 58 Q34 51 39 50 L40.5 58.5 Q36 64 33.5 63 Z" fill="${S.url("bridge")}" stroke="#14151a" stroke-width="0.35"/>
      <path d="M69 58 Q66 51 61 50 L59.5 58.5 Q64 64 66.5 63 Z" fill="${S.url("bridge")}" stroke="#14151a" stroke-width="0.35"/>
      <path d="M38 24.5 L62 24.5 L59 30.5 Q50 27.5 41 30.5 Z" fill="${S.url("bridge")}" stroke="#14151a" stroke-width="0.35"/>
      <path d="M43.5 72.5 L56.5 72.5 L57.5 77.5 L42.5 77.5 Z" fill="${S.url("bridge")}" stroke="#14151a" stroke-width="0.35"/>
      ${S.circle(35.5, 55.5, 0.8, { fill: "#d93a3a" })}${S.circle(64.5, 55.5, 0.8, { fill: "#d93a3a" })}${S.circle(45.5, 75, 0.7, { fill: "#d93a3a" })}${S.circle(54.5, 75, 0.7, { fill: "#d93a3a" })}

    /* Registers: 60-minute chrono counter at 3 (red hand), small seconds at 9. */

    /* Numerals: skeleton-style applied Arabics at 12, 2, 4, 6, 8, 10; batons at 1, 5, 7, 11. */
    const nums = S.numerals({ count: 12, r: 25.6, size: 7.4, family: S.FONT.cond, weight: 700, color: "#1a1b1e", labels: ["12", "", "2", "", "4", "", "6", "", "8", "", "10", ""], start: 0, step: 30, skip: (i) => [1, 3, 5, 7, 9, 11].includes(i) });
    const numsOutline = nums.replace(/<text /g, `<text stroke="${GRY}" stroke-width="0.45" paint-order="stroke" `);
    let batons = "";

/* ==== face: bigpilot ==== */
{

/* ==== face: carrera ==== */
{
registerFace("carrera", {

    /* Tachymeter bezel: 60 at 12, values placed at 3600/v seconds. */
    const tach = [[500, 1], [400, 1], [300, 1], [250, 0], [200, 1], [180, 0], [160, 1], [140, 0], [120, 1], [110, 0], [100, 1], [90, 1], [80, 1], [75, 0], [70, 1], [65, 0]];
    let bezel = "";
    for (const [v, big] of tach) {
      const a = (3600 / v) * 6;
      const [x, y] = S.pt(a, 39.0);
      bezel += `<line x1="${S.p(a, 41.3).replace(" ", '" y1="')}" x2="${S.p(a, 40.4).replace(" ", '" y2="')}" stroke="#d9dde1" stroke-width="0.45"/>`;
      bezel += S.text(x, y + (big ? 0.95 : 0.7), String(v), { size: big ? 2.7 : 2.05, family: S.FONT.cond, weight: 600, color: P, transform: `rotate(${S.n(a)} ${S.n(x)} ${S.n(y)})` });
    }
    // fine graduations 400..60 every second between 9s and 60s
    for (let s = 9; s < 60; s++) {
      const a = s * 6;
      bezel += `<line x1="${S.p(a, 41.3).replace(" ", '" y1="')}" x2="${S.p(a, 40.7).replace(" ", '" y2="')}" stroke="#a9aeb3" stroke-width="0.28"/>`;

    const secHand = `<path d="M-0.4 2.4 L-0.4 -6.8 L0 -7.6 L0.4 -6.8 L0.4 2.4 Z" fill="${S.url("hand")}"/><circle r="0.85" fill="${S.url("hand")}"/>`;

    const minuteHand = `<path d="M-1.5 3.2 L-1.5 -22 L0 -30.6 L1.5 -22 L1.5 3.2 Z" fill="${S.url("hand")}"/><path d="M-0.65 -3 L-0.65 -21.4 L0.65 -21.4 L0.65 -3 Z" fill="${LUME}"/>`;
