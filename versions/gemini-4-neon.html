/* === GEMINI 4 NEON — WORLD CLOCK APPLICATION RUNTIME === */

const FACES = Object.assign({}, FACES_BATCH_1, FACES_BATCH_2, FACES_BATCH_3);
const FACE_KEYS = Object.keys(FACES);
const CITY_BY_ID = new Map(CITY_ATLAS.map(c => [c.id, c]));
const STORAGE_KEY = "g4neon_world_clock_v1";

let _uidSeq = 0;
function nextUid(prefix) {
  _uidSeq += 1;
  return `${prefix || "g4n"}_${_uidSeq}`;
}

function renderClockMarkup(faceKey, t, uid, chrono) {
  const face = FACES[faceKey] || FACES.submariner;
  const u = uid || nextUid(faceKey);
  const motion = computeCadenceMotion(t, face.cadence, { hz: face.hz });
  const cState = computeChronoAngles(chrono, faceKey);
  return face.render(u, t, motion, cState);
}

function setLcdChar(groupEl, ch) {
  if (!groupEl) return;
  const mask = K.SEG_MAP[String(ch).toUpperCase()] || K.SEG_MAP[" "];
  const onCol = groupEl.getAttribute("data-on") || "#151a14";
  const offCol = groupEl.getAttribute("data-off") || "rgba(21,26,20,0.09)";
  const segs = groupEl.querySelectorAll("[data-seg]");
  for (let i = 0; i < segs.length; i++) {
    const idx = parseInt(segs[i].getAttribute("data-seg"), 10);
    segs[i].setAttribute("fill", mask[idx] ? onCol : offCol);
  }
}

function updateClockDom(svgEl, faceKey, t, chrono) {
  if (!svgEl) return;
  const face = FACES[faceKey];
  if (!face) return;
  const m = computeCadenceMotion(t, face.cadence, { hz: face.hz });
  const c = computeChronoAngles(chrono, faceKey);

  // Rotate all hands by role
  const hands = svgEl.querySelectorAll("[data-hand]");
  for (let i = 0; i < hands.length; i++) {
    const el = hands[i];
    const role = el.getAttribute("data-hand");
    const pv = (el.getAttribute("data-pivot") || "120,120").split(",");
    const cx = pv[0], cy = pv[1];
    let deg = 0;
    if (role === "hour") deg = m.hourDeg;
    else if (role === "minute") deg = m.minDeg;
    else if (role === "second" || role === "sub-sec") deg = faceKey === "freak" ? m.secDeg * 3 : m.secDeg;
    else if (role === "gmt") deg = m.hour24Deg;
    else if (role === "chrono-sec" || role === "chrono-sec-sub") deg = c.secDeg;
    else if (role === "chrono-tenth") deg = c.tenthDeg;
    else if (role === "chrono-min") deg = (faceKey === "richardmille" || faceKey === "elprimero" || faceKey === "bigbang" || faceKey === "jorggray") ? c.min30Deg * 0.5 : c.min30Deg;
    else if (role === "chrono-min15") deg = c.min15Deg;
    else if (role === "chrono-hr") deg = c.hour12Deg;
    else if (role === "regatta") deg = c.regattaDeg;
    else if (role === "date-ptr") deg = ((t.day - 0.5) / 31) * 360;
    else if (role === "sub-date") deg = ((t.day - 1) / 31) * 360;
    else if (role === "power") {
      if (faceKey === "lange1") deg = 90 + (40 - t.powerReserve * 80);
      else if (faceKey === "snowflake") deg = 225 + t.powerReserve * 75;
      else deg = -55 + t.powerReserve * 110;
    } else if (role === "sun") deg = ((t.hour + t.minute / 60 - 12) * 15 + 360) % 360;
    else if (role === "moon-arm") deg = (((t.hour + t.minute / 60 - 12) * 15 + 360) + t.moon.angle) % 360;
    else if (role === "zodiac") deg = (((t.hour + t.minute / 60 - 12) * 15 + 360) + (t.month - 3) * 30) % 360;
    else if (role === "pendulum") deg = (t.second % 2 === 0 ? 1 : -1) * 9;
    el.setAttribute("transform", `rotate(${K.f(deg)} ${cx} ${cy})`);
  }

  // Update moonphase discs
  const moons = svgEl.querySelectorAll("[data-moon]");
  for (let i = 0; i < moons.length; i++) {
    const el = moons[i];
    const pv = (el.getAttribute("data-pivot") || "120,152").split(",");
    const rot = (t.moon.angle / 2) - 90;
    el.setAttribute("transform", `rotate(${K.f(rot)} ${pv[0]} ${pv[1]})`);
  }

  // Update text apertures
  const dayStr = String(t.day).padStart(2, "0");
  const texts = svgEl.querySelectorAll("[data-text]");
  for (let i = 0; i < texts.length; i++) {
    const el = texts[i];
    const field = el.getAttribute("data-text");
    let val = "";
    if (field === "date") val = faceKey === "richardmille" ? dayStr : String(t.day);
    else if (field === "date-tens") val = dayStr[0] === "0" ? "" : dayStr[0];
    else if (field === "date-ones") val = dayStr[1];
    else if (field === "day" || field === "aw-day") val = t.weekdayShort;
    else if (field === "day-full") val = t.weekdayFull;
    else if (field === "month") val = t.monthShort;
    else if (field === "month-num") val = String(t.month).padStart(2, "0");
    else if (field === "daydate") val = `${t.weekdayShort} ${t.day}`;
    else if (field === "lcd-day") val = t.weekday2;
    else if (field === "lcd-date") val = String(t.day).padStart(2, " ");
    else if (field === "lcd-md") val = `${String(t.month).padStart(2, " ")}-${String(t.day).padStart(2, " ")}`;
    else if (field === "aw-time") val = `${String(t.hour).padStart(2, "0")}:${String(t.minute).padStart(2, "0")}`;
    if (el.textContent !== val) el.textContent = val;
  }

  // Update 7-segment LCD digits (G-Shock, F-91W, Fossil Big Tic)
  const lcdDigits = svgEl.querySelectorAll("[data-lcd-digit]");
  if (lcdDigits.length) {
    const showChrono = (faceKey === "gshock" || faceKey === "f91w") && c && (c.running || c.elapsedMs > 0);
    let hh, mm, ss;
    if (showChrono) {
      const cs = Math.floor(c.elapsedMs / 10) % 100;
      const totS = Math.floor(c.elapsedMs / 1000);
      hh = String(Math.floor(totS / 60) % 60).padStart(2, "0");
      mm = String(totS % 60).padStart(2, "0");
      ss = String(cs).padStart(2, "0");
    } else {
      hh = String(t.hour).padStart(2, "0");
      mm = String(t.minute).padStart(2, "0");
      ss = String(t.second).padStart(2, "0");
    }
    const charMap = { h1: hh[0], h2: hh[1], m1: mm[0], m2: mm[1], s1: ss[0], s2: ss[1], bt1: ss[0], bt2: ss[1] };
    for (let i = 0; i < lcdDigits.length; i++) {
      const slot = lcdDigits[i].getAttribute("data-lcd-digit");
      if (charMap[slot] !== undefined) setLcdChar(lcdDigits[i], charMap[slot]);
    }
    const colons = svgEl.querySelectorAll("[data-lcd-colon]");
    const blink = showChrono ? true : (t.ms < 550);
    for (let i = 0; i < colons.length; i++) {
      colons[i].setAttribute("opacity", blink ? "1" : "0.18");
    }
  }

  // Update Apple Watch activity rings
  const rings = svgEl.querySelectorAll("[data-ring]");
  if (rings.length) {
    const dayFrac = (t.hour * 60 + t.minute) / 1440;
    const vals = {
      move: [46, Math.min(0.96, 0.22 + dayFrac * 0.78)],
      exercise: [35.5, Math.min(0.92, 0.16 + dayFrac * 0.72)],
      stand: [25, Math.min(0.95, 0.28 + dayFrac * 0.68)]
    };
    for (let i = 0; i < rings.length; i++) {
      const key = rings[i].getAttribute("data-ring");
      if (vals[key]) {
        const [r, pct] = vals[key];
        const circ = 2 * Math.PI * r;
        rings[i].setAttribute("stroke-dasharray", `${K.f(circ * pct)} ${K.f(circ)}`);
      }
    }
  }
}

/* === APPLICATION STATE, PERSISTENCE & UI CONTROLLER === */

const App = (() => {
  const state = {
    view: "board", // board | collection
    lume: false,
    cities: [],
    storageNotice: "",
    filterCat: "All",
    filterQuery: "",
    inspector: {
      open: false,
      faceKey: "submariner",
      loupe: false,
      poseMode: "live", // live | fixed
      fixedDate: "2026-11-19",
      fixedTime: "10:10:36"
    },
    chronos: new Map() // key -> { running, startPerf, accMs, regattaMinutes }
  };

  function getChronoState(key) {
    let ch = state.chronos.get(key);
    if (!ch) {
      ch = { running: false, startPerf: 0, accMs: 0, regattaMinutes: 10 };
      state.chronos.set(key, ch);
    }
    const elapsedMs = ch.running ? (ch.accMs + (performance.now() - ch.startPerf)) : ch.accMs;
    return { ...ch, elapsedMs };
  }

  function toggleChrono(key) {
    const ch = state.chronos.get(key) || { running: false, startPerf: 0, accMs: 0, regattaMinutes: 10 };
    if (ch.running) {
      ch.accMs += performance.now() - ch.startPerf;
      ch.running = false;
    } else {
      ch.startPerf = performance.now();
      ch.running = true;
    }
    state.chronos.set(key, ch);
    renderInspectorChronoReadout();
  }

  function resetChrono(key) {
    const prev = state.chronos.get(key);
    state.chronos.set(key, {
      running: false,
      startPerf: 0,
      accMs: 0,
      regattaMinutes: prev ? prev.regattaMinutes : 10
    });
    renderInspectorChronoReadout();
  }

  function setRegattaMinutes(min) {
    const mVal = Math.max(1, Math.min(10, parseInt(min, 10) || 10));
    state.chronos.set("yachtmaster2", {
      running: false,
      startPerf: 0,
      accMs: 0,
      regattaMinutes: mVal
    });
    renderInspectorChronoReadout();
  }

  function pickUnusedFace(excludeSet, avoidKey) {
    const pool = FACE_KEYS.filter(k => !excludeSet.has(k) && k !== avoidKey);
    if (pool.length > 0) return pool[Math.floor(Math.random() * pool.length)];
    const fallback = FACE_KEYS.filter(k => k !== avoidKey);
    return fallback[Math.floor(Math.random() * fallback.length)] || FACE_KEYS[0];
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) {
        state.cities = DEFAULT_BOARD_CITIES.map(c => ({ ...c }));
        return;
      }
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.cities)) {
        throw new Error("Invalid saved board format");
      }
      // Preserve intentionally empty board!
      const seenCities = new Set();
      const valid = [];
      for (const item of parsed.cities) {
        if (!item || !CITY_BY_ID.has(item.cityId) || seenCities.has(item.cityId)) continue;
        seenCities.add(item.cityId);
        const fKey = FACES[item.faceKey] ? item.faceKey : FACE_KEYS[valid.length % FACE_KEYS.length];
        valid.push({ cityId: item.cityId, faceKey: fKey });
      }
      state.cities = valid;
      if (typeof parsed.lume === "boolean") state.lume = parsed.lume;
    } catch (err) {
      state.cities = DEFAULT_BOARD_CITIES.map(c => ({ ...c }));
      state.storageNotice = "Saved board data was unreadable and has been reset to defaults.";
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        lume: state.lume,
        cities: state.cities
      }));
    } catch (_) {
      // Ignore private-mode storage restrictions
    }
  }

  function shuffleAllFaces() {
    const shuffled = [...FACE_KEYS];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    state.cities.forEach((item, idx) => {
      let pick = shuffled[idx % shuffled.length];
      if (pick === item.faceKey && shuffled.length > 1) {
        pick = shuffled[(idx + 1) % shuffled.length];
      }
      item.faceKey = pick;
    });
    // Ensure uniqueness across all cities when count <= 62
    if (state.cities.length <= FACE_KEYS.length) {
      const used = new Set();
      state.cities.forEach(item => {
        if (used.has(item.faceKey)) {
          item.faceKey = pickUnusedFace(used, item.faceKey);
        }
        used.add(item.faceKey);
      });
    }
    saveState();
    renderBoard();
  }

  function shuffleSingleCity(cityId) {
    const entry = state.cities.find(c => c.cityId === cityId);
    if (!entry) return;
    const used = new Set(state.cities.map(c => c.faceKey));
    entry.faceKey = pickUnusedFace(used, entry.faceKey);
    saveState();
    renderBoard();
  }

  function addCity(cityId) {
    if (!CITY_BY_ID.has(cityId)) return false;
    if (state.cities.some(c => c.cityId === cityId)) return false;
    const used = new Set(state.cities.map(c => c.faceKey));
    const faceKey = pickUnusedFace(used, null);
    state.cities.push({ cityId, faceKey });
    saveState();
    renderBoard();
    return true;
  }

  function removeCity(cityId) {
    state.cities = state.cities.filter(c => c.cityId !== cityId);
    saveState();
    renderBoard();
  }

  function assignFaceToCity(cityId, faceKey) {
    const entry = state.cities.find(c => c.cityId === cityId);
    if (!entry || !FACES[faceKey]) return;
    entry.faceKey = faceKey;
    saveState();
    renderBoard();
  }

  function toggleLume(force) {
    state.lume = typeof force === "boolean" ? force : !state.lume;
    document.documentElement.classList.toggle("lume-active", state.lume);
    const btn = document.getElementById("btn-lume");
    if (btn) btn.setAttribute("aria-pressed", String(state.lume));
    const iBtn = document.getElementById("insp-lume");
    if (iBtn) iBtn.setAttribute("aria-pressed", String(state.lume));
    saveState();
  }

  function setView(view) {
    state.view = view === "collection" ? "collection" : "board";
    document.getElementById("view-board").hidden = state.view !== "board";
    document.getElementById("view-collection").hidden = state.view !== "collection";
    document.getElementById("tab-board").setAttribute("aria-pressed", String(state.view === "board"));
    document.getElementById("tab-collection").setAttribute("aria-pressed", String(state.view === "collection"));
    if (state.view === "collection") renderCollection();
  }

  function renderMeridianStrip(sortedCities, now) {
    const strip = document.getElementById("meridian-strip");
    if (!strip) return;
    if (!sortedCities.length) {
      strip.innerHTML = `<div class="meridian-empty">Add cities below to plot local solar longitudes across the 24-hour meridian.</div>`;
      return;
    }
    const items = sortedCities.map(item => {
      const c = CITY_BY_ID.get(item.cityId);
      const t = buildTimeState(now, c.tz);
      const pct = ((t.hour * 60 + t.minute) / 1440) * 100;
      return `<button type="button" class="meridian-pin sky-${t.sky.id}" data-jump-city="${c.id}" style="left:${K.f(Math.max(4, Math.min(96, pct)))}%" title="${c.name} · ${String(t.hour).padStart(2,"0")}:${String(t.minute).padStart(2,"0")} (${t.offsetLabel})">
        <span class="pin-dot"></span>
        <span class="pin-name">${c.name}</span>
      </button>`;
    }).join("");
    strip.innerHTML = `
      <div class="meridian-scale">
        <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
      <div class="meridian-track">${items}</div>
    `;
  }

  function renderBoard() {
    const grid = document.getElementById("city-grid");
    const notice = document.getElementById("storage-notice");
    if (notice) {
      notice.hidden = !state.storageNotice;
      notice.textContent = state.storageNotice;
    }
    const now = new Date();
    const sorted = sortCitiesWestToEast(state.cities, now);
    renderMeridianStrip(sorted, now);

    const countEl = document.getElementById("board-count");
    if (countEl) countEl.textContent = `${sorted.length} ${sorted.length === 1 ? "city" : "cities"} · sorted west to east`;

    if (!sorted.length) {
      grid.innerHTML = `<div class="empty-board">
        <h3>Your horological bench is clear</h3>
        <p>Search any of 196 global cities above to add a live timepiece, or restore the default 9-city world line.</p>
        <button type="button" class="btn primary" id="btn-restore-defaults">Restore Default Cities</button>
      </div>`;
      const rBtn = document.getElementById("btn-restore-defaults");
      if (rBtn) rBtn.addEventListener("click", () => {
        state.cities = DEFAULT_BOARD_CITIES.map(c => ({ ...c }));
        state.storageNotice = "";
        saveState();
        renderBoard();
      });
      return;
    }

    grid.innerHTML = sorted.map(item => {
      const city = CITY_BY_ID.get(item.cityId);
      const face = FACES[item.faceKey];
      const t = buildTimeState(now, city.tz);
      const uid = nextUid(`card_${item.faceKey}`);
      const chrono = getChronoState(item.faceKey);
      const hhmmss = `${String(t.hour).padStart(2, "0")}:${String(t.minute).padStart(2, "0")}:${String(t.second).padStart(2, "0")}`;
      const dateStr = `${t.weekdayShort}, ${t.day} ${t.monthShort}`;
      return `<article class="city-card sky-${t.sky.id}" data-city-id="${city.id}" data-face-key="${item.faceKey}">
        <header class="card-head">
          <div class="card-loc">
            <h3>${city.name}</h3>
            <span class="card-region">${city.region}</span>
          </div>
          <div class="card-meta">
            <span class="sky-pill sky-${t.sky.id}" data-card-sky>${t.sky.label}</span>
            <span class="offset-pill" data-card-offset>${t.offsetLabel}</span>
          </div>
        </header>
        <div class="dial-stage" data-inspect-face="${item.faceKey}" role="button" tabindex="0" aria-label="Inspect ${face.name}">
          ${renderClockMarkup(item.faceKey, t, uid, chrono)}
        </div>
        <div class="card-readout">
          <time class="card-time" data-card-time>${hhmmss}</time>
          <span class="card-date" data-card-date>${dateStr} · ${t.relDay}</span>
        </div>
        <footer class="card-foot">
          <div class="watch-meta">
            <span class="watch-name" title="${face.name}">${face.name}</span>
            <span class="cadence-tag">${face.cadence}</span>
          </div>
          <div class="card-actions">
            <button type="button" class="icon-btn" data-action="inspect" data-face="${item.faceKey}" title="Inspect watch">Loupe</button>
            <button type="button" class="icon-btn" data-action="shuffle" data-city="${city.id}" title="Shuffle watch face">Shuffle</button>
            <button type="button" class="icon-btn danger" data-action="remove" data-city="${city.id}" title="Remove ${city.name}" aria-label="Remove ${city.name}">✕</button>
          </div>
        </footer>
      </article>`;
    }).join("");
  }

  function renderCollection() {
    const grid = document.getElementById("collection-grid");
    if (!grid) return;
    const now = new Date();
    const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const t = buildTimeState(now, localTz);
    const q = state.filterQuery.trim().toLowerCase();
    const cat = state.filterCat;

    const filtered = FACE_KEYS.filter(key => {
      const f = FACES[key];
      if (cat !== "All" && f.category !== cat) return false;
      if (!q) return true;
      return key.toLowerCase().includes(q) ||
        f.name.toLowerCase().includes(q) ||
        f.brand.toLowerCase().includes(q) ||
        f.category.toLowerCase().includes(q) ||
        f.cadence.toLowerCase().includes(q);
    });

    const stat = document.getElementById("collection-count");
    if (stat) stat.textContent = `${filtered.length} of ${FACE_KEYS.length} timepieces`;

    grid.innerHTML = filtered.map((key, idx) => {
      const f = FACES[key];
      const uid = nextUid(`col_${key}`);
      const chrono = getChronoState(key);
      return `<article class="col-card" data-face-key="${key}">
        <div class="col-dial" data-inspect-face="${key}" role="button" tabindex="0" aria-label="Inspect ${f.name}">
          ${renderClockMarkup(key, t, uid, chrono)}
        </div>
        <div class="col-info">
          <div class="col-top">
            <span class="col-idx">#${String(FACE_KEYS.indexOf(key) + 1).padStart(2, "0")}</span>
            <span class="cadence-tag">${f.cadence}</span>
          </div>
          <h4>${f.name}</h4>
          <p>${f.category}${f.chrono ? " · Chronograph" : ""}${f.regatta ? " · Regatta" : ""}</p>
        </div>
      </article>`;
    }).join("");
  }

  function buildInspectorTime() {
    const ins = state.inspector;
    if (ins.poseMode === "live") {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      return buildTimeState(new Date(), tz);
    }
    const [yr, mo, dy] = (ins.fixedDate || "2026-11-19").split("-").map(n => parseInt(n, 10));
    const [hr, mn, sc] = (ins.fixedTime || "10:10:36").split(":").map(n => parseInt(n, 10) || 0);
    const fakeDate = new Date(Date.UTC(yr || 2026, (mo || 11) - 1, dy || 19, hr || 0, mn || 0, sc || 0));
    const weekday = fakeDate.getUTCDay();
    return buildTimeState(fakeDate, "UTC", {
      year: yr || 2026,
      month: mo || 11,
      day: dy || 19,
      weekday,
      hour: hr % 24,
      minute: mn % 60,
      second: sc % 60,
      ms: 0,
      offsetMinutes: 0,
      dayNumber: Math.floor(Date.UTC(yr || 2026, (mo || 11) - 1, dy || 19) / 86400000),
      leapPos: ((yr % 4) === 0 && ((yr % 100) !== 0 || (yr % 400) === 0)) ? 4 : (yr % 4)
    });
  }

  function renderInspectorChronoReadout() {
    const el = document.getElementById("insp-chrono-readout");
    if (!el || !state.inspector.open) return;
    const fk = state.inspector.faceKey;
    const ch = getChronoState(fk);
    const c = computeChronoAngles(ch, fk);
    if (fk === "yachtmaster2") {
      const rem = c.regattaRemainMs;
      const rm = String(Math.floor(rem / 60000)).padStart(2, "0");
      const rs = String(Math.floor((rem % 60000) / 1000)).padStart(2, "0");
      const rt = String(Math.floor((rem % 1000) / 100));
      el.textContent = `COUNTDOWN ${rm}:${rs}.${rt}`;
    } else {
      const ms = ch.elapsedMs;
      const em = String(Math.floor(ms / 60000)).padStart(2, "0");
      const es = String(Math.floor((ms % 60000) / 1000)).padStart(2, "0");
      const et = String(Math.floor((ms % 1000) / 100));
      el.textContent = `ELAPSED ${em}:${es}.${et}`;
    }
    const startBtn = document.getElementById("insp-chrono-toggle");
    if (startBtn) startBtn.textContent = ch.running ? "Stop" : "Start";
  }

  function openInspector(faceKey) {
    if (!FACES[faceKey]) return;
    state.inspector.open = true;
    state.inspector.faceKey = faceKey;
    const face = FACES[faceKey];
    const modal = document.getElementById("inspector-modal");
    modal.hidden = false;
    document.getElementById("insp-title").textContent = face.name;
    document.getElementById("insp-sub").textContent = `${face.brand} · ${face.category} · ${face.cadence} cadence · key: ${faceKey}`;
    document.getElementById("insp-summary").textContent = face.summary || "";
    const stage = document.getElementById("insp-stage");
    stage.classList.toggle("loupe-2x", state.inspector.loupe);
    const t = buildInspectorTime();
    stage.innerHTML = renderClockMarkup(faceKey, t, nextUid(`insp_${faceKey}`), getChronoState(faceKey));

    // Chrono / Regatta panel visibility
    const chronoBox = document.getElementById("insp-chrono-box");
    const regBox = document.getElementById("insp-regatta-box");
    chronoBox.hidden = !face.chrono;
    regBox.hidden = !face.regatta;
    if (face.chrono) renderInspectorChronoReadout();

    // Populate Assign-to-City dropdown
    const sel = document.getElementById("insp-assign-city");
    const sorted = sortCitiesWestToEast(state.cities, new Date());
    if (sorted.length) {
      sel.innerHTML = sorted.map(item => {
        const c = CITY_BY_ID.get(item.cityId);
        return `<option value="${c.id}">${c.name}</option>`;
      }).join("");
      sel.disabled = false;
      document.getElementById("insp-assign-btn").disabled = false;
    } else {
      sel.innerHTML = `<option value="">No active cities</option>`;
      sel.disabled = true;
      document.getElementById("insp-assign-btn").disabled = true;
    }
    document.getElementById("insp-date").value = state.inspector.fixedDate;
    document.getElementById("insp-time").value = state.inspector.fixedTime;
    updatePoseButtons();
  }

  function closeInspector() {
    state.inspector.open = false;
    document.getElementById("inspector-modal").hidden = true;
  }

  function updatePoseButtons() {
    document.querySelectorAll("[data-pose]").forEach(btn => {
      const p = btn.getAttribute("data-pose");
      const active = (p === "live" && state.inspector.poseMode === "live") ||
        (state.inspector.poseMode === "fixed" && p === `${state.inspector.fixedDate}T${state.inspector.fixedTime}`);
      btn.setAttribute("aria-pressed", String(active));
    });
  }

  function setInspectorPose(mode, dateStr, timeStr) {
    state.inspector.poseMode = mode;
    if (dateStr) state.inspector.fixedDate = dateStr;
    if (timeStr) state.inspector.fixedTime = timeStr;
    document.getElementById("insp-date").value = state.inspector.fixedDate;
    document.getElementById("insp-time").value = state.inspector.fixedTime;
    updatePoseButtons();
    if (state.inspector.open) {
      const stage = document.getElementById("insp-stage");
      const svg = stage.querySelector("svg");
      const t = buildInspectorTime();
      if (svg) updateClockDom(svg, state.inspector.faceKey, t, getChronoState(state.inspector.faceKey));
    }
  }

  function tickFrame() {
    const now = new Date();
    // Header UTC clock
    const utcEl = document.getElementById("header-utc");
    if (utcEl) {
      const u = getTzParts(now, "UTC");
      utcEl.textContent = `${String(u.hour).padStart(2, "0")}:${String(u.minute).padStart(2, "0")}:${String(u.second).padStart(2, "0")} UTC`;
    }

    // Update active city cards
    if (state.view === "board") {
      const cards = document.querySelectorAll("#city-grid .city-card");
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const city = CITY_BY_ID.get(card.getAttribute("data-city-id"));
        const faceKey = card.getAttribute("data-face-key");
        if (!city || !faceKey) continue;
        const t = buildTimeState(now, city.tz);
        const svg = card.querySelector("svg");
        updateClockDom(svg, faceKey, t, getChronoState(faceKey));
        const timeEl = card.querySelector("[data-card-time]");
        const hhmmss = `${String(t.hour).padStart(2, "0")}:${String(t.minute).padStart(2, "0")}:${String(t.second).padStart(2, "0")}`;
        if (timeEl && timeEl.textContent !== hhmmss) timeEl.textContent = hhmmss;
        const dateEl = card.querySelector("[data-card-date]");
        const dStr = `${t.weekdayShort}, ${t.day} ${t.monthShort} · ${t.relDay}`;
        if (dateEl && dateEl.textContent !== dStr) dateEl.textContent = dStr;
      }
    } else {
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      const t = buildTimeState(now, localTz);
      const cards = document.querySelectorAll("#collection-grid .col-card");
      for (let i = 0; i < cards.length; i++) {
        const fk = cards[i].getAttribute("data-face-key");
        updateClockDom(cards[i].querySelector("svg"), fk, t, getChronoState(fk));
      }
    }

    // Update Inspector if open
    if (state.inspector.open) {
      const svg = document.querySelector("#insp-stage svg");
      const fk = state.inspector.faceKey;
      const t = buildInspectorTime();
      updateClockDom(svg, fk, t, getChronoState(fk));
      if (FACES[fk] && FACES[fk].chrono) renderInspectorChronoReadout();
    }

    requestAnimationFrame(tickFrame);
  }

  function setupSearch() {
    const input = document.getElementById("city-search");
    const list = document.getElementById("city-suggestions");
    let activeIdx = -1;
    let matches = [];

    function renderList() {
      const q = input.value.trim().toLowerCase();
      if (!q) {
        list.hidden = true;
        list.innerHTML = "";
        matches = [];
        activeIdx = -1;
        return;
      }
      const existing = new Set(state.cities.map(c => c.cityId));
      const now = new Date();
      matches = CITY_ATLAS.filter(c => {
        if (existing.has(c.id)) return false;
        return c.name.toLowerCase().includes(q) ||
          c.region.toLowerCase().includes(q) ||
          c.tz.toLowerCase().includes(q);
      }).slice(0, 10);

      if (!matches.length) {
        list.innerHTML = `<li class="sug-empty">No matching available cities</li>`;
        list.hidden = false;
        activeIdx = -1;
        return;
      }
      list.innerHTML = matches.map((c, idx) => {
        const p = getTzParts(now, c.tz);
        return `<li role="option" class="sug-item${idx === activeIdx ? " active" : ""}" data-add-city="${c.id}">
          <span class="sug-name">${c.name} <small>${c.region}</small></span>
          <span class="sug-tz">${formatOffset(p.offsetMinutes)}</span>
        </li>`;
      }).join("");
      list.hidden = false;
    }

    input.addEventListener("input", () => { activeIdx = 0; renderList(); });
    input.addEventListener("focus", () => { if (input.value.trim()) renderList(); });
    input.addEventListener("keydown", (e) => {
      if (list.hidden || !matches.length) return;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        activeIdx = (activeIdx + 1) % matches.length;
        renderList();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeIdx = (activeIdx - 1 + matches.length) % matches.length;
        renderList();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const pick = matches[Math.max(0, activeIdx)];
        if (pick) {
          addCity(pick.id);
          input.value = "";
          renderList();
        }
      } else if (e.key === "Escape") {
        list.hidden = true;
      }
    });
    list.addEventListener("mousedown", (e) => {
      const li = e.target.closest("[data-add-city]");
      if (!li) return;
      e.preventDefault();
      addCity(li.getAttribute("data-add-city"));
      input.value = "";
      list.hidden = true;
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) list.hidden = true;
    });
  }

  function setupEvents() {
    document.getElementById("tab-board").addEventListener("click", () => setView("board"));
    document.getElementById("tab-collection").addEventListener("click", () => setView("collection"));
    document.getElementById("btn-lume").addEventListener("click", () => toggleLume());
    document.getElementById("btn-shuffle-all").addEventListener("click", shuffleAllFaces);

    // Delegated clicks on city grid
    document.getElementById("city-grid").addEventListener("click", (e) => {
      const pusher = e.target.closest(".chrono-pusher");
      if (pusher) {
        const card = pusher.closest("[data-face-key]");
        if (card) {
          const fk = card.getAttribute("data-face-key");
          if (pusher.getAttribute("data-pusher") === "startstop") toggleChrono(fk);
          else resetChrono(fk);
        }
        return;
      }
      const btn = e.target.closest("[data-action]");
      if (btn) {
        const act = btn.getAttribute("data-action");
        if (act === "shuffle") shuffleSingleCity(btn.getAttribute("data-city"));
        else if (act === "remove") removeCity(btn.getAttribute("data-city"));
        else if (act === "inspect") openInspector(btn.getAttribute("data-face"));
        return;
      }
      const stage = e.target.closest("[data-inspect-face]");
      if (stage) openInspector(stage.getAttribute("data-inspect-face"));
    });

    // Meridian pin click highlights card
    document.getElementById("meridian-strip").addEventListener("click", (e) => {
      const pin = e.target.closest("[data-jump-city]");
      if (!pin) return;
      const cid = pin.getAttribute("data-jump-city");
      const card = document.querySelector(`.city-card[data-city-id="${cid}"]`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        card.classList.add("pulse-focus");
        setTimeout(() => card.classList.remove("pulse-focus"), 900);
      }
    });

    // Collection filters & inspection
    document.getElementById("col-search").addEventListener("input", (e) => {
      state.filterQuery = e.target.value;
      renderCollection();
    });
    document.getElementById("col-cats").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      state.filterCat = btn.getAttribute("data-cat");
      document.querySelectorAll("#col-cats [data-cat]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      renderCollection();
    });
    document.getElementById("collection-grid").addEventListener("click", (e) => {
      const el = e.target.closest("[data-inspect-face]");
      if (el) openInspector(el.getAttribute("data-inspect-face"));
    });

    // Inspector modal controls
    document.getElementById("insp-close").addEventListener("click", closeInspector);
    document.getElementById("inspector-modal").addEventListener("click", (e) => {
      if (e.target.id === "inspector-modal") closeInspector();
      const pusher = e.target.closest(".chrono-pusher");
      if (pusher) {
        const fk = state.inspector.faceKey;
        if (pusher.getAttribute("data-pusher") === "startstop") toggleChrono(fk);
        else resetChrono(fk);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.inspector.open) closeInspector();
    });
    document.getElementById("insp-loupe").addEventListener("click", (e) => {
      state.inspector.loupe = !state.inspector.loupe;
      e.currentTarget.setAttribute("aria-pressed", String(state.inspector.loupe));
      document.getElementById("insp-stage").classList.toggle("loupe-2x", state.inspector.loupe);
    });
    document.getElementById("insp-lume").addEventListener("click", () => toggleLume());
    document.querySelectorAll("[data-pose]").forEach(btn => {
      btn.addEventListener("click", () => {
        const p = btn.getAttribute("data-pose");
        if (p === "live") setInspectorPose("live");
        else {
          const [d, tm] = p.split("T");
          setInspectorPose("fixed", d, tm);
        }
      });
    });
    document.getElementById("insp-date").addEventListener("change", (e) => setInspectorPose("fixed", e.target.value, state.inspector.fixedTime));
    document.getElementById("insp-time").addEventListener("change", (e) => setInspectorPose("fixed", state.inspector.fixedDate, e.target.value));
    document.getElementById("insp-chrono-toggle").addEventListener("click", () => toggleChrono(state.inspector.faceKey));
    document.getElementById("insp-chrono-reset").addEventListener("click", () => resetChrono(state.inspector.faceKey));
    document.getElementById("insp-regatta-min").addEventListener("change", (e) => setRegattaMinutes(e.target.value));
    document.getElementById("insp-assign-btn").addEventListener("click", () => {
      const cid = document.getElementById("insp-assign-city").value;
      if (cid) {
        assignFaceToCity(cid, state.inspector.faceKey);
        closeInspector();
        setView("board");
      }
    });
  }

  function init() {
    loadState();
    document.documentElement.classList.toggle("lume-active", state.lume);
    const lBtn = document.getElementById("btn-lume");
    if (lBtn) lBtn.setAttribute("aria-pressed", String(state.lume));
    setupSearch();
    setupEvents();
    renderBoard();
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(tickFrame);
    }
  }

  return {
    init,
    state,
    FACES,
    FACE_KEYS,
    CITY_ATLAS,
    buildTimeState,
    computeCadenceMotion,
    computeChronoAngles,
    renderClockMarkup,
    updateClockDom,
    sortCitiesWestToEast,
    getMoonPhase,
    addCity,
    removeCity,
    shuffleAllFaces,
    shuffleSingleCity,
    assignFaceToCity,
    toggleLume,
    setView,
    openInspector,
    closeInspector,
    setInspectorPose,
    toggleChrono,
    resetChrono,
    setRegattaMinutes
  };
})();

if (typeof window !== "undefined") {
  window.__G4N_API__ = App;
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => App.init());
  } else {
    App.init();
  }
}

  </script>
</body>
</html>
