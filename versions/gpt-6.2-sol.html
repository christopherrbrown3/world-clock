  :root {
    --paper: #f6f4ed;
    --well: #e9e7df;
    --ink: #202823;
    --muted: #535f56;
    --rule: #cfcec2;
    --green: #1f473b;
    --green-light: #e0e8df;
    --focus: #9d431e;
    --serif: "Newsreader", Georgia, serif;
    --sans: system-ui, -apple-system, sans-serif;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    font-synthesis: none;
    font-optical-sizing: auto;
    accent-color: var(--green);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  ::selection { background: #c3d7ca; color: #192821; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  body { margin: 0; }
  a { color: inherit; text-underline-offset: .2em; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button, select { touch-action: manipulation; }
  button, select, input, .link-button { min-height: 44px; }
  .wrap { width: min(100% - 2 * clamp(16px, 4vw, 68px), 1320px); margin: auto; }
  .skip { position: fixed; top: 8px; left: 8px; transform: translateY(-180%); z-index: 2; padding: 12px; background: var(--paper); }
  .skip:focus { transform: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .masthead { background: #eaece3; border-bottom: 1px solid var(--rule); }
  .masthead .wrap { display: flex; flex-wrap: wrap; min-height: 64px; align-items: center; gap: 0 24px; }
  .wordmark { display: inline-flex; gap: 10px; align-items: center; text-decoration: none; min-height: 44px; font-weight: 680; }
  .wordmark svg { width: 25px; height: 25px; color: var(--green); }
  .version { color: var(--muted); font-size: .83rem; }
  .directory { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-left: auto; font-size: .84rem; color: var(--green); }
  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .section-nav { display: flex; align-items: stretch; column-gap: 26px; border-bottom: 1px solid var(--rule); margin-top: 14px; }
  .section-nav button { position: relative; background: transparent; border: 0; padding: 2px 0; color: var(--muted); font-weight: 575; }
  .section-nav button[aria-current] { color: var(--green); }
  .section-nav button[aria-current]::after { position: absolute; inset: auto 0 -1px; height: 2px; background: var(--green); content: ""; }
  .collection-count { margin-inline-start: .28em; font-weight: 420; font-variant-numeric: tabular-nums; }
  .section-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 14px 22px; padding: clamp(26px, 4.4vw, 54px) 0 20px; }
  h1, h2 { font-family: var(--serif); font-weight: 450; letter-spacing: -.035em; }
  h1 { margin: 0; font-size: clamp(2.8rem, 6.1vw, 5.4rem); line-height: .93; }
  h2 { margin: 0; font-size: clamp(2rem, 3.5vw, 3rem); line-height: 1; }
  .actions, .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .control, input, select { border: 1px solid #b8bcb0; background: #fbfaf4; border-radius: 4px; padding: 8px 13px; }
  .control { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: .87rem; font-weight: 570; }
  .control:hover:not(:disabled) { background: var(--green-light); border-color: var(--green); }
  .primary { background: var(--green); border-color: var(--green); color: #fff; }
  .primary:hover:not(:disabled) { background: #2e5a4b; color: #fff; }
  .zone-label, .caption-detail, .record-reference { color: var(--muted); font-size: .82rem; }
  .board { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .feature { min-width: 0; }
  .object-stage {
    display: grid; place-items: center; min-width: 0; overflow: hidden;
    background: radial-gradient(ellipse at 43% 30%, #fffdf4 1%, #eeede5 54%, #dcdcd2 100%);
  }
  button.object-stage { width: 100%; padding: 0; border: 0; border-radius: 0; }
  button.object-stage:hover { background-color: #fffdf6; background-blend-mode: screen; }
  .object-stage:focus-visible { outline-offset: -4px; }
  .feature .object-stage { height: clamp(330px, 38vw, 512px); }
  .object-stage > svg { display: block; height: 100%; width: 100%; max-height: 100%; }
  .feature .object-stage > svg { height: 94%; width: 88%; }
  .feature-caption { min-height: 105px; display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 18px 18px 16px 0; }
  .watch-name { font-family: var(--serif); font-size: clamp(1.45rem, 2.6vw, 2.15rem); letter-spacing: -.025em; line-height: 1.03; margin: 0 0 6px; font-weight: 530; }
  .caption-detail { margin: 0; }
  .time-zones { min-width: 0; border-left: 1px solid var(--rule); padding-left: clamp(16px, 2.8vw, 36px); }
  .zone-heading { margin: 20px 0 10px; font-family: var(--sans); font-size: .87rem; letter-spacing: 0; font-weight: 700; }
  .zone-list { list-style: none; padding: 0; margin: 0; }
  .zone-list li { border-top: 1px solid var(--rule); }
  .zone { display: grid; grid-template-columns: 50px minmax(70px, 1fr) auto; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border: 0; border-radius: 0; background: transparent; min-height: 73px; }
  .zone:hover, .zone[aria-pressed="true"] { background: var(--green-light); }
  .zone-name { display: block; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; }
  .zone-label { display: block; margin-top: 4px; }
  .zone-art { width: 48px; height: 51px; }
  .zone-art svg { display: block; width: 100%; height: 100%; }
  .zone-time, .readout { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--green); }
  .zone-time { text-align: right; font-size: 1.01rem; font-weight: 630; }
  .feature-time { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 7px 12px; padding: 17px 20px 15px; background: #f0efe6; border-bottom: 1px solid #d8d9ce; }
  .feature-city { font-weight: 660; }
  .feature-time .readout { font-size: 1.1rem; font-weight: 620; }
  .empty { padding: 30px 16px; border-top: 1px solid var(--rule); color: var(--muted); }
  .filters input { width: min(35vw, 260px); }
  input::placeholder { color: var(--muted); opacity: 1; }
  input { caret-color: var(--green); }
  .collection-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .collection-grid li { min-width: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .catalog-item { display: flex; flex-direction: column; width: 100%; background: transparent; border: 0; border-radius: 0; padding: 0; text-align: left; height: 100%; }
  .catalog-item:hover { background: #eaece2; }
  .catalog-item:hover .object-stage { background: radial-gradient(ellipse at 43% 32%, #fffdf4, #e1e6dc); }
  .catalog-item:focus-visible { outline-offset: -3px; position: relative; z-index: 1; }
  .catalog-item .object-stage { width: 100%; aspect-ratio: 1.04; background: transparent; }
  .catalog-item .object-stage > svg { height: 93%; width: 90%; }
  .record-label { padding: 6px 13px 16px; }
  .record-name { display: block; font-family: var(--serif); font-weight: 550; font-size: 1.15rem; line-height: 1.05; }
  .record-reference { display: block; margin-top: 5px; line-height: 1.3; overflow-wrap: anywhere; }
  footer { padding: 22px 0 36px; }
  footer a { color: var(--green); display: inline-flex; align-items: center; min-height: 44px; font-size: .87rem; }
  dialog { width: min(94vw, 520px); padding: 20px; max-height: 92dvh; border: 1px solid #aab6a9; border-radius: 6px; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: #16221dd0; }
  .dialog-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 14px; }
  .dialog-head .control { flex: none; width: 44px; padding: 0; }
  .dialog-head .caption-detail { margin-top: 5px; }
  .add-dialog input { width: 100%; margin: 8px 0 6px; }
  .city-results { list-style: none; margin: 0; padding: 0; max-height: min(48dvh, 382px); overflow: auto; scrollbar-color: #798e80 #eaece3; }
  .city-results button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: transparent; width: 100%; border: 0; border-bottom: 1px solid var(--rule); padding: 8px 4px; }
  .city-results button:hover { background: var(--green-light); }
  .city-results button:focus-visible { outline-offset: -2px; }
  .city-region { text-align: right; font-size: .8rem; color: var(--muted); }
  .inspect { width: min(94vw, 940px); }
  .inspection-body { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(220px, 1fr); gap: 24px; }
  .inspect-art { min-height: 0; height: min(61dvh, 495px); }
  .inspect-art > svg { height: 96%; width: 94%; }
  .inspection-details { min-width: 0; padding: 10px 0 6px; }
  .inspection-details label { display: block; margin-bottom: 5px; font-size: .9rem; font-weight: 600; }
  .inspection-details select { width: 100%; }
  .inspection-details .readout { font-size: clamp(1.55rem, 3.1vw, 2.65rem); margin: 12px 0; }
  .inspection-details > .control { margin: 4px 0; }
  .stopwatch { margin: 16px 0; border: 0; border-top: 1px solid var(--rule); padding: 8px 0 0; }
  .stopwatch legend { padding-right: 8px; font-size: .9rem; font-weight: 650; }
  .stopwatch output { display: block; margin: 8px 0 12px; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
  @media (max-width: 1050px) {
    .collection-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .board { grid-template-columns: minmax(0, 1fr); }
    .time-zones { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); }
    .collection-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .feature .object-stage { height: clamp(290px, 74vw, 466px); }
    .inspection-body { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .inspect-art { height: min(45dvh, 375px); }
  }
  @media (max-width: 480px) {
    .masthead .wrap { gap: 0 10px; }
    .version { font-size: .72rem; }
    .directory { font-size: .76rem; gap: 2px; }
    .directory .icon { display: none; }
    .collection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters { width: 100%; align-items: stretch; }
    .filters input { flex: 1 1 130px; width: 100%; min-width: 0; }
    .filters select { flex: 1 1 105px; max-width: 100%; min-width: 0; }
    .feature-caption { padding-right: 0; flex-direction: column; min-height: 0; }
    .feature-time { padding-inline: 12px; }
    .zone { padding-inline: 6px; }
    dialog { padding: 14px; }
  }
</style>
</head>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="../index.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 5v7l4 2M3 12h2m14 0h2m-9 7v2"/></svg>
      World Clock
    </a>
    <span class="version">GPT 6.2 Sol</span>
    <a class="directory" href="../index.html">Model directory <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12m-5-5 5 5-5 5"/></svg></a>

</header>
<main class="wrap" id="main" tabindex="-1">
  <nav class="section-nav" aria-label="Clock views">
    <button type="button" id="show-board" aria-current="page" aria-controls="board-view">Cities</button>
    <button type="button" id="show-collection" aria-controls="collection-view">Collection <span class="collection-count">62</span></button>
  </nav>
  <section id="board-view" aria-labelledby="board-title">

      <h1 id="board-title">City clocks</h1>
      <div class="actions">
        <button type="button" class="control" id="shuffle-all">Shuffle all</button>
        <button type="button" class="control primary" id="add-city">Add city</button>
      </div>
    </div>
    <div class="board" id="board">
      <div class="feature">
        <div class="feature-time">
          <span>
            <span class="feature-city" id="feature-city"></span>
            <span class="zone-label" id="feature-offset"></span>
          </span>
          <time class="readout" id="feature-time"></time>
        </div>
        <button type="button" class="object-stage" id="feature-art"></button>
        <div class="feature-caption">
          <div><h2 class="watch-name" id="feature-name"></h2><p class="caption-detail" id="feature-date"></p></div>
          <div class="actions">
            <button type="button" class="control" id="shuffle-one">Shuffle face</button>
            <button type="button" class="control" id="remove-city">Remove city</button>
          </div>
        </div>
      </div>
      <aside class="time-zones" aria-labelledby="zone-heading">
        <h2 class="zone-heading" id="zone-heading">Cities from west to east</h2>
        <ul class="zone-list" id="zone-list"></ul>
      </aside>
    </div>
    <p class="empty" id="empty-board" hidden>Add a city to start your clock.</p>
  </section>
  <section id="collection-view" aria-labelledby="collection-title" hidden>
    <div class="section-heading">
      <h1 id="collection-title">Collection</h1>
      <div class="filters">
        <label class="sr-only" for="watch-search">Search timepieces</label>
        <input type="search" id="watch-search" placeholder="Search timepieces" autocomplete="off">
        <label class="sr-only" for="watch-category">Timepiece type</label>
        <select id="watch-category">
          <option value="">All types</option>
          <option value="Wristwatch">Analog wristwatch</option><option>Chronograph</option><option>Digital</option><option>Clock</option><option>Pocket watch</option>
        </select>
      </div>
    </div>
    <p id="match-count" class="sr-only" role="status"></p>
    <ul class="collection-grid" id="collection"></ul>
    <p class="empty" id="empty-collection" hidden>No timepieces match your search.</p>
  </section>
  <noscript><p class="empty">Enable JavaScript to draw the watches and run the clocks.</p></noscript>
</main>
<footer class="wrap"><a href="../docs/gpt-6.2-sol-reference-notes.md">Reference notes</a></footer>

<dialog id="city-dialog" class="add-dialog" aria-labelledby="city-title">
  <div class="dialog-head"><h2 id="city-title">Add city</h2><button type="button" class="control" data-close aria-label="Close city search"></button></div>
  <label class="sr-only" for="city-search">Search by city or time zone</label>
  <input type="search" id="city-search" placeholder="Search by city or time zone" autofocus autocomplete="off">
  <ul id="city-results" class="city-results"></ul>
  <p id="city-empty" hidden>No matching cities or time zones.</p>
</dialog>

<dialog id="inspect" class="inspect" aria-labelledby="inspect-name">
  <div class="dialog-head">
    <div><h2 id="inspect-name"></h2><p id="inspect-reference" class="caption-detail"></p></div>

  <div class="inspection-body">

          <button type="button" class="control" id="reset">Reset</button>
        </div>
      </fieldset>
    </div>
  </div>
</dialog>
<p class="sr-only" role="status" id="announcement"></p>
<script>
"use strict";

// Drawings use millimetre-like coordinates centred on each watch dial.
const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" })[char]);
const many = (count, draw) => Array.from({ length: count }, (_, i) => draw(i)).join("");
const n = value => Math.round(value * 100) / 100;
const angle = degrees => degrees * Math.PI / 180;
const at = (bearing, radius, x = 0, y = 0) => [n(x + radius * Math.sin(angle(bearing))), n(y - radius * Math.cos(angle(bearing)))];
const pair = coordinates => coordinates.join(" ");
const circle = (x, y, r, fill, more = "") => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${more}/>`;
const oval = (x, y, rx, ry, fill, more = "") => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" ${more}/>`;
const rect = (x, y, width, height, rx, fill, more = "") => `<rect x="${x}" y="${y}" width="${width}" height="${height}" rx="${rx}" fill="${fill}" ${more}/>`;
const path = (d, fill, more = "") => `<path d="${d}" fill="${fill}" ${more}/>`;
const g = (body, more = "") => `<g ${more}>${body}</g>`;
const turn = (body, degrees, x = 0, y = 0) => g(body, `transform="rotate(${n(degrees)} ${x} ${y})"`);
const move = (body, x, y) => g(body, `transform="translate(${x} ${y})"`);
const edge = (color, width = 1) => `stroke="${color}" stroke-width="${width}"`;
const line = (x1, y1, x2, y2, color, width = 1, more = "") =>
  path(`M${x1} ${y1}L${x2} ${y2}`, "none", `${edge(color, width)} ${more}`);
const ring = (radius, color, width = 1, x = 0, y = 0) => circle(x, y, radius, "none", edge(color, width));
const sans = "Arial, Helvetica, sans-serif";
const serif = "Georgia, Times New Roman, serif";
const cream = "#eee8d4";
const lume = "#e9efe0";
const ink = "#222425";
const white = "#efeef0";

function label(value, x, y, size, fill, options = {}) {
  const { font = sans, weight = 500, track = 0, more = "" } = options;
  return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="${fill}" font-family="${font}" font-size="${size}" font-weight="${weight}" letter-spacing="${track}" ${more}>${esc(value)}</text>`;
}
function textStack(rows, y, size, step, color, options) {
  return rows.map((row, index) => label(row, 0, y + step * index, size, color, options)).join("");
}
function dynamic(slot, x, y, size, fill, options) {
  return label("", x, y, size, fill, { ...options, more: `data-slot="${slot}" ${options?.more ?? ""}` });
}
function arc(radius, start, end, x = 0, y = 0) {
  return `M${pair(at(start, radius, x, y))} A${radius} ${radius} 0 ${end - start > 180 ? 1 : 0} 1 ${pair(at(end, radius, x, y))}`;
}
function sector(inner, outer, start, end) {
  return `${arc(outer, start, end)} L${pair(at(end, inner))} A${inner} ${inner} 0 ${end - start > 180 ? 1 : 0} 0 ${pair(at(start, inner))} Z`;
}
function scaleTicks({ radius, count = 60, every = 5, depth = 2.8, major = 5, color = white, width = .7, from = 0, span = 360 }) {
  const marks = [[], []];
  for (let i = 0; i < count; i++) {
    const main = i % every === 0;
    const bearing = from + span * i / count;
    marks[Number(main)].push(`M${pair(at(bearing, radius - (main ? major : depth)))}L${pair(at(bearing, radius))}`);
  }
  return marks.map((pieces, i) => path(pieces.join(" "), "none", edge(color, width * (1 + i * .5)))).join("");
}
const eachHour = draw => many(12, i => draw(i || 12, i * 30));
function numbers(radius, fontSize, color, options = {}) {
  const { skip = [], values, ...style } = options;
  return eachHour((hour, bearing) => {
    if (skip.includes(hour)) return "";
    const [x, y] = at(bearing, radius);
    return label(values ? values[hour - 1] : hour, x, y, fontSize, color, style);
  });
}
const roman = ["I", "II", "III", "IIII", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

const brushed = ["#c1c7c8", "#f1f1ed", "#777e81", "#c9cbca", "#9eaaad", "#e0e3e4", "#747b7c"];
const polished = ["#4b5054", "#edf1ec", "#b0b7b8", "#444a4f", "#fafdff", "#929b9c", "#34383a"];
const yellowGold = ["#704817", "#fff0b9", "#e5bf67", "#a66c2f", "#fbe4a0", "#a47032", "#684418"];
const roseGold = ["#714134", "#ffdfc5", "#d6a07e", "#955a45", "#ffdfbf", "#b57959", "#693f31"];
const darkCeramic = ["#191c20", "#55575a", "#292a2c", "#111315", "#3d4143", "#242729", "#0c0e10"];
const redCeramic = ["#5a0709", "#fa4239", "#bd1017", "#79070d", "#ed2d33", "#a10a16", "#590707"];

let svgCount = 0;
function inks() {
  const idPrefix = `piece-${++svgCount}-`;
  const defs = [];
  const memo = new Map();
  function definition(name, build) {
    if (!memo.has(name)) {
      const id = idPrefix + defs.length;
      defs.push(build(id));
      memo.set(name, id);
    }
    return `url(#${memo.get(name)})`;
  }
  function gradient(tag, name, geometry, colors) {
    return definition(name, id => `<${tag} id="${id}" ${geometry}>${colors.map((entry, i) => {
      const [offset, color, opacity = 1] = Array.isArray(entry) ? entry : [i / (colors.length - 1), entry];
      return `<stop offset="${offset}" stop-color="${color}" stop-opacity="${opacity}"/>`;
    }).join("")}</${tag}>`);
  }
  return {
    defs,
    linear(name, colors, axes = 'x1="0%" y1="0%" x2="100%" y2="75%"') {
      return gradient("linearGradient", name, axes, colors);
    },
    radial(name, colors, focus = 'cx="44%" cy="35%" r="73%"') {
      return gradient("radialGradient", name, focus, colors);
    },
    pattern(name, width, height, art) {
      return definition(name, id => `<pattern id="${id}" width="${width}" height="${height}" patternUnits="userSpaceOnUse">${art}</pattern>`);
    },
    clip(name, art) {
      return definition(name, id => `<clipPath id="${id}">${art}</clipPath>`);
    },
    get steel() { return this.linear("steel", polished); },
    get satin() { return this.linear("satin", brushed, 'x1="0%" y1="0%" x2="100%" y2="24%"'); },
    get gold() { return this.linear("gold", yellowGold); },
    get rose() { return this.linear("rose", roseGold); },
    get ceramic() { return this.linear("ceramic", darkCeramic); },
    get black() { return this.radial("black", ["#34383d", "#171c21", "#080a0f"]); },
    get silver() { return this.radial("silver", ["#fcfaf0", "#e9e6dd", "#bfc1ba"]); },
    get crystal() {
      return this.linear("crystal", [[0, "#fff", .17], [.34, "#fff", .035], [.52, "#fff", 0], [.77, "#b1ceff", .02], [1, "#c0cbdd", .14]]);
    }
  };
}

function floorShadow(p, rx, ry, x = 6, y = 116) {
  const shadow = p.radial("contact", [[0, "#292d2b", .33], [.63, "#2b302c", .15], [1, "#43473e", 0]], 'cx="50%" cy="50%" r="50%"');
  return oval(x, y, rx, ry, shadow);
}
function sunburst(p, name, light, mid, dark, radius, alpha = .15) {
  const ground = p.radial(name, [light, mid, dark]);
  const rays = path(many(168, i => {
    const a = i * 360 / 168;
    return `M${pair(at(a, 5))}L${pair(at(a + .14, radius))}`;
  }), "none", `stroke="#e8edeb" stroke-width=".35" opacity="${alpha}"`);
  return circle(0, 0, radius, ground) + rays;
}
function glass(p, radius) {
  return circle(0, 0, radius, p.crystal) + path(arc(radius - 1.4, 272, 349), "none", 'stroke="#fff" opacity=".27" stroke-width="1.2"');
}
function metalCrown(p, x, y = 0, width = 16, height = 25, fill = p.satin, bearing = 0) {
  const left = x - width / 2;
  const top = y - height / 2;
  const ridges = many(Math.round(height / 3), i => {
    const cy = top + 2.8 + i * 3;
    return line(left + 3, cy, left + width - 1.4, cy, "#292c2d", .8, 'opacity=".62"') +
      line(left + 3, cy + .8, left + width - 1.7, cy + .8, "#f6f3ed", .5, 'opacity=".55"');
  });
  return turn(rect(left - 3, y - height * .34, 8, height * .68, 2, p.steel) +
    rect(left, top, width, height, 4, fill, edge("#464949", .85)) + ridges +
    line(left + width - 2, top + 3, left + width - 2, top + height - 3, "#fff", .8, 'opacity=".55"'), bearing);
}
function pusher(p, y, x = 100, width = 17, height = 17, metal = p.steel) {
  const d = `M${x - 7} ${y - height / 2 + 2}h7v${height - 4}h-7Z`;
  return path(d, p.satin, edge("#353939", .6)) +
    rect(x - 2, y - height / 2, width, height, 3, metal, edge("#535654", .7)) +
    line(x + width - 5, y - height / 2 + 1.8, x + width - 5, y + height / 2 - 1.8, "#eee", .85, 'opacity=".65"');
}
function lugs(p, radius, width, fill = p.satin, reach = 17) {
  const joint = -radius * .65;
  const end = -radius - reach + 5;
  const art = path(`M${width+26} ${joint} Q${width+14} ${joint-24} ${width+7} ${end} L${width-3} ${end-1} Q${width-6} ${end+14} ${width-12} ${joint-5}Z`, fill, edge("#575d5b", .77)) +
    path(`M${width+23} ${joint-3} Q${width+14} ${joint-23} ${width+7} ${end+1}`, "none", 'stroke="#f6f6ed" stroke-width="1.3" opacity=".65"');
  return art + g(art, 'transform="scale(-1 1)"') + g(art, 'transform="scale(1 -1)"') + g(art, 'transform="scale(-1 -1)"');
}
function strap(p, width, { kind = "leather", color = "#322721", high = "#605043", low = "#170f0c", stitch = "#9f866c", taper = 5, reach = 131 } = {}) {
  const finish = p.linear(`strap-${color}`, [low, high, color, low], 'x1="0%" y1="0%" x2="100%" y2="0%"');
  const outline = `M${-width} -64 L${-width + taper} ${-reach + 8} Q${-width + taper} ${-reach} ${-width + taper + 6} ${-reach} H${width - taper - 6} Q${width - taper} ${-reach} ${width - taper} ${-reach + 8} L${width} -64Z`;
  const grain = p.pattern(`strap-grain-${kind}`, 18, 15,
    path("M-4 9Q4 2 10 6T22 9M1 14Q7 7 14 11M3 0L9 2m5-1 4 2", "none", 'stroke="#e5d8c3" stroke-width=".45" opacity=".28"') +
    path("M0 8L6 5m2 6 10-2m-12 7 6-2", "none", 'stroke="#000" stroke-width=".6" opacity=".45"'));
  const stitching = `stroke="${stitch}" stroke-width="1.05" stroke-dasharray="3 2.5" opacity=".84"`;
  const details = {
    leather: path(outline, grain) +
      path(`M${-width + taper + 5} ${-reach + 6}L${-width + 5} -71 M${width - taper - 5} ${-reach + 6}L${width - 5} -71`, "none", stitching),
    rubber: many(5, index => {
      const y = -reach + 10 + index * 10;
      return line(-width + taper + 4, y, width - taper - 4, y, "#070a0b", 2.3, 'opacity=".7"') +
        line(-width + taper + 4, y + 1.2, width - taper - 4, y + 1.2, high, .75);
    }),
    fabric: path(outline, p.pattern("woven-band", 3.2, 3.2,
      path("M.2 0v3.2M1.8 0v3.2M0 1.2h3.2", "none", 'stroke="#000" stroke-width=".48" opacity=".5"') +
      path("M0 .4h3.2M.9 0v3.2", "none", 'stroke="#fff" stroke-width=".35" opacity=".27"')))
  };
  const half = path(outline, finish, edge(low, 1)) + (details[kind] ?? "");
  return half + turn(half, 180);
}
function bracelet(p, width, { style = "three", fill = p.satin, center = p.steel, reach = 134 } = {}) {
  const axis = 'x1="0%" y1="0%" x2="0%" y2="100%"';
  const brushedLink = p.linear("bracelet-brushed", [[0,"#bfc3c0"],[.12,"#e2e4de"],[.43,"#b6bbba"],[.85,"#a3aaa9"],[1,"#7c8585"]],axis);
  const polishLink = p.linear("bracelet-polished", [[0,"#dedfd9"],[.14,"#f1f1ed"],[.58,"#c4cbcb"],[.83,"#929da0"],[.96,"#454c51"],[1,"#687174"]],axis);
  const pinkLink = p.linear("bracelet-rose-gold", [[0,"#d5a183"],[.14,"#ffdec3"],[.45,"#cd956f"],[.81,"#b47a59"],[1,"#89563c"]],axis);
  const linkSurface = fill===p.satin ? brushedLink : fill===p.rose ? pinkLink : fill;
  const centerSurface = center===p.steel ? polishLink : center===p.satin ? brushedLink : center===p.rose ? pinkLink : center;
  const grain = p.pattern("bracelet-finish", 2.85, 2.85,
    line(.34,0,.34,2.85,"#f9faf6",.33,'opacity=".35"') + line(1.7,0,1.7,2.85,"#646d6d",.28,'opacity=".24"'));
  const links = many(6, index => {
    const y = -reach + index * 12;
    const span = width - (5 - index) * 2.1;
    const background = rect(-span, y, span * 2, 12, 1.65, linkSurface, edge("#414744", .7)) +
      rect(-span+.3,y+.35,span*2-.6,10.8,1.1,grain) +
      line(-span + 2, y + .8, span - 2, y + .8, "#fff", .67, 'opacity=".58"') +
      line(-span + 2, y + 10.7, span - 2, y + 10.7, "#22272a", .8, 'opacity=".55"');
    if (style === "single") return background;
    if (style === "jubilee") {
      return background + many(3, i => rect((i - 1.5) * span * .29, y - 2, span * .29, 10.3, 1.6, centerSurface, edge("#515757", .58)));
    }
    if (style === "cross") {
      const c = span * .49;
      return background + path(`M${-c} ${y}H${c}L${c - 4} ${y + 4}L${c} ${y + 8}H${-c}L${-c + 4} ${y + 4}Z`, centerSurface, edge("#606567", .6));
    }
    const centerWidth = span * (style === "integrated" ? .84 : .78);
    return background + rect(-centerWidth / 2, y - 1.5, centerWidth, 13, 1.55, centerSurface, edge("#606667", .6)) +
      line(-centerWidth / 2 + 1, y, centerWidth / 2 - 1, y, "#f8f6f0", .8, 'opacity=".45"');
  });
  return links + turn(links, 180);
}
function screw(p, x, y, r, tilt, fill = p.steel, bolt = false) {
  const housing = bolt ? path(`M${many(6, i => pair(at(30 + i * 60, r + 1.2, x, y)) + " ")}Z`, "#484a47") : circle(x, y, r + .7, "#404344");
  return housing + (bolt ? path(`M${many(6, i => pair(at(30 + i * 60, r, x, y)) + " ")}Z`, fill, edge("#d0cebd", .55)) : circle(x, y, r, fill, edge("#d9dad3", .58))) +
    turn(line(x - r * .6, y, x + r * .6, y, "#292c2d", Math.min(1.3, r * .3)) + line(x - r * .55, y + .65, x + r * .55, y + .65, "#eae9e0", .43), tilt, x, y);
}
function roundCase(p, radius, { fill = p.steel, face = p.black, dial = radius - 11, flange = p.satin, bevel = 4.1 } = {}) {
  return circle(1.7, 3.7, radius, "#303435") +
    circle(0, 0, radius, fill, edge("#484d4e", 1)) +
    circle(0, 0, radius - bevel, flange, edge("#e4e2d9", .65)) +
    circle(0, 0, dial + 1.25, "#2e3434") +
    circle(0, 0, dial, face, edge("#111817", .75)) +
    path(arc(radius - 1.2, 269, 346), "none", 'stroke="#fff" stroke-width="1.35" opacity=".58"') +
    path(arc(radius - 1.7, 91, 184), "none", 'stroke="#141718" stroke-width="1.4" opacity=".44"');
}
function flutes(p, inner, outer, count, gold = false) {
  return many(count, index => {
    const a = index * 360 / count;
    const span = 180 / count;
    const base = pair(at(a - span, inner));
    const top = pair(at(a - span + .3, outer));
    const spine = pair(at(a + .1, outer + .17));
    const end = pair(at(a + span, outer));
    const endBase = pair(at(a + span, inner));
    const light = .7 + Math.cos(angle(a + 34)) * .2;
    return path(`M${base} L${top} L${spine} L${pair(at(a, inner))}Z`, gold ? "#ffdfa0" : "#f1f0e9", `opacity="${n(light)}"`) +
      path(`M${pair(at(a, inner))} L${spine} L${end} L${endBase}Z`, gold ? "#6d4b22" : "#4a4f50", 'opacity=".55"');
  });
}
function crownLogo(x, y, color) {
  const form = path("M-8 -3l3.9 7.4H4.1L8-3 3.2.2 2.7-4.7 0-.1-2.7-4.7-3.2.2Z", color) +
    oval(0, 4.1, 4.2, 1.2, color) +
    [[-8,-3],[-2.7,-4.7],[0,-6],[2.7,-4.7],[8,-3]].map(([x,y]) => circle(x,y,.9,color)).join("");
  return move(form, x, y);
}
function applied(p, r, { metal = p.steel, fill = lume, width = 5.5, length = 12, style = "batons", skip = [] } = {}) {
  function marker(shape, x, top) {
    if (shape === "dot") {
      return circle(x, top + width * .5 + 1, width * .63 + 1.3, metal, edge("#333638", .55)) +
        circle(x, top + width * .5 + 1, width * .56 - .22, fill, edge("#766f61", .35));
    }
    if (shape === "triangle") {
      return path(`M${x - width - 1} ${top}H${x + width + 1}L${x} ${top + length + 5}Z`, metal, edge("#333638", .55)) +

function elapsedAt(key, steady) {
  const value=stopwatchStates.get(key);
  return value ? value.elapsed+(value.started===null?0:Math.max(0,steady-value.started)) : 0;
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
function rotations(fields, timestamp, cadence, key, steady, posed) {
  const fraction = posed || reduced.matches ? 0 : timestamp%1000/1000;
  const stepped = cadence==="sweep" ? Math.floor(fraction*8)/8 : cadence==="glide" ? fraction : 0;
  const runningSecond=fields.second+stepped;
  const continuousSecond=fields.second+fraction;
  const hm=fields.hour+fields.minute/60+continuousSecond/3600;
  const epochDays=(timestamp-Date.UTC(2000,0,6,18,14))/86400000;
  const lunations=epochDays/29.530588853;
  const phase=((lunations%1)+1)%1;
  const calendarDay=(Date.UTC(fields.year,fields.month-1,fields.day)-Date.UTC(fields.year,0,0))/86400000;
  const sidereal=280.4606+360.9856474*(timestamp-Date.UTC(2000,0,1,12))/86400000;
  const power=.64+.14*Math.cos(angle(hm/24*360-94));
  const elapsed=elapsedAt(key,steady)/1000;
  const countdownPreset=stopwatchStates.get(key)?.minutes??10;
  const regattaRemaining=Math.max(0,countdownPreset*60-elapsed);
  const localSolar=hm*15+180;
  return {
    hour:hm*30, minute:fields.minute*6+continuousSecond/10,
    second:cadence==="mondaine" ? Math.min(360,continuousSecond*360/58.5) : runningSecond*6,
    gmt:((((timestamp/1000)%86400)+86400)%86400)/240,
    chrono60:elapsed*6, chrono10:elapsed*36, chrono15:elapsed*.4, chrono30:elapsed*.2,
    chrono60m:elapsed*.1, chrono12:elapsed/120, countdown60:-elapsed*.1,
    regattaMinute:regattaRemaining*.5, regattaSecond:regattaRemaining*6,
    hour24:hm*15, dateHand:(fields.day-1)*360/31, moon:(phase-.5)*180,
    power:277-power*111, langePower:116-power*52, marinePower:297+power*130, nomosPower:power*234,
    balance:reduced.matches ? 0 : 26*Math.sin(angle((timestamp%1000)*2.88)),
    pendulum:posed || reduced.matches ? 0 : 2.15*Math.sin(timestamp*Math.PI/1000),
    solar:localSolar, orlojMoon:localSolar-phase*360, zodiac:sidereal%360,
    bohemian:90-18*Math.cos((calendarDay-172)*2*Math.PI/365.2422)
  };
}
const segmentMasks = [0b0111111,0b0000110,0b1011011,0b1001111,0b1100110,0b1101101,0b1111101,0b0000111,0b1111111,0b1101111];
function markings(fields) {
  const weekday=weekdays[fields.weekday];
  return {
    date:String(fields.day),datePadded:padded(fields.day),dateTens:fields.day>9?padded(fields.day)[0]:"",dateOnes:padded(fields.day)[1],
    dayShort:weekday.slice(0,3),dayFull:weekday,weekday2:weekday.slice(0,2),month:months[fields.month-1],
    monthNumber:padded(fields.month),monthNumberPlain:String(fields.month).padStart(2," "),
    leap:String(fields.year%4||4),digitalHour:String(fields.hour%12||12).padStart(2," "),
    pm:fields.hour>=12?"PM":"",minute:padded(fields.minute),second:padded(fields.second)
  };
}
const artwork = new Map();
const visiblePieces = new Set();
const observer = "IntersectionObserver" in window ? new IntersectionObserver(entries=>{
  for (const entry of entries) {
    if (entry.isIntersecting) visiblePieces.add(entry.target);
    else visiblePieces.delete(entry.target);
  }
}) : null;

function updateArtwork(svg, drawing, timestamp, steady) {
  const fields = inZone(timestamp,drawing.zone);
  const posed=drawing.posed;
  // The inspection pose fixes local hand positions at 10:10:35 while retaining the local date.
  const readings=posed ? {...fields,hour:10,minute:10,second:35} : fields;
  const angles = rotations(readings,timestamp,svg.dataset.cadence,svg.dataset.face,steady,posed);
  for (const rotor of drawing.rotors) {
    const [node,role,pivot] = rotor;
    const bearing = n(angles[role]%360);
    if (bearing!==rotor[3]) {
      node.setAttribute("transform",`rotate(${bearing} ${pivot})`);
      rotor[3]=bearing;
    }
  }
  const moment = `${readings.year}-${readings.month}-${readings.day} ${readings.hour}:${readings.minute}:${readings.second}`;
  if (moment!==drawing.moment) {
    const fields = markings(readings);
    for(const [node,field] of drawing.fields) setText(node,fields[field]);
    for(const {node,ghost,field,digits} of drawing.segments) {
      const value=fields[field];
      if(node.dataset.value===value) continue;
      node.dataset.value=value;
      digits.forEach((segments,i)=>{
        const mask=value[i] && value[i]!==" " ? segmentMasks[Number(value[i])] : 0;
        segments.forEach((segment,bit)=>segment.setAttribute("opacity",(mask & (1<<bit)) ? "1" : ghost));
      });
    }
    if(drawing.daylight) drawing.daylight.setAttribute("opacity",readings.hour>=6&&readings.hour<18?"1":"0");
    drawing.moment=moment;
  }
}
function mountDrawing(parent,key,zone) {
  clearDrawings(parent);
  parent.innerHTML=drawPiece(key);
  const svg=parent.firstElementChild;
  const drawing={
    zone,posed:false,moment:null,
    fields:[...svg.querySelectorAll("[data-slot]")].map(node=>[node,node.dataset.slot]),
    rotors:[...svg.querySelectorAll("[data-rotor]")].map(node=>[node,node.dataset.rotor,node.dataset.pivot,null]),
    segments:[...svg.querySelectorAll("[data-digits]")].map(node=>({
      node,ghost:node.dataset.ghost,field:node.dataset.digits,
      digits:[...node.querySelectorAll("[data-digit]")].map(digit=>[...digit.children])
    })),
    daylight:svg.querySelector("[data-daylight]")
  };
  artwork.set(svg,drawing);
  updateArtwork(svg,drawing,Date.now(),performance.now());
  if(observer) observer.observe(svg);
  else visiblePieces.add(svg);
  return drawing;
}
function clearDrawings(parent) {
  for(const svg of parent.querySelectorAll("svg[data-face]")) {
    observer?.unobserve(svg);
    visiblePieces.delete(svg);
    artwork.delete(svg);
  }
}

const orderedCities = timestamp => boardState.cities.map(entry=>({ ...entry, ...cityById.get(entry.id) }))
  .sort((first,second)=>inZone(timestamp,first.zone).offset-inZone(timestamp,second.zone).offset ||
    first.name.localeCompare(second.name,"en") || first.id.localeCompare(second.id,"en"));
const currentCity = () => cityById.get(boardState.selected);
const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
let sortedIds = [];
let featuredTime = null;
let view = "board";
const defaultZone = () => currentCity()?.zone ?? localZone;
const zoneRows = new Map();
function refreshFeature(list, timestamp) {
  const featured=list.find(city=>city.id===boardState.selected);
  if(!featured) return;
  for(const [id,row] of zoneRows) row.button.setAttribute("aria-pressed",String(id===featured.id));
  const [name,reference]=catalog[featured.key];
  setText($("feature-city"),featured.name);
  setText($("feature-name"),name);
  $("feature-art").setAttribute("aria-label",`Inspect ${name}${reference ? " "+reference : ""}`);
  $("feature-art").dataset.key=featured.key;
  mountDrawing($("feature-art"),featured.key,featured.zone);
  featuredTime=featured;
  renderTimes(timestamp);
  for(const [svg,drawing] of artwork) {
    if (svg.closest("#collection") && drawing.zone!==featured.zone) {
      drawing.zone=featured.zone;
      updateArtwork(svg,drawing,timestamp,performance.now());
    }
  }
}
function renderBoard(timestamp = Date.now()) {
  const cities=orderedCities(timestamp);
  const list=$("zone-list");
  clearDrawings(list);
  list.replaceChildren();
  zoneRows.clear();
  sortedIds=cities.map(city=>city.id);
  $("board").hidden=!cities.length;
  $("empty-board").hidden=!!cities.length;
  $("shuffle-all").disabled=!cities.length;
  if(!cities.length) {
    clearDrawings($("feature-art"));
    $("feature-art").replaceChildren();
    featuredTime=null;
    return;
  }
  if(!cities.some(city=>city.id===boardState.selected)) boardState.selected=cities[0].id;
  for(const city of cities) {
    const item=document.createElement("li");
    const button=document.createElement("button");
    button.type="button";
    button.className="zone";
    button.dataset.city=city.id;
    button.innerHTML=`<span class="zone-art" aria-hidden="true"></span><span><span class="zone-name">${esc(city.name)}</span><span class="zone-label"></span></span><time class="zone-time"></time>`;
    item.append(button);
    list.append(item);
    mountDrawing(button.querySelector(".zone-art"),city.key,city.zone);
    zoneRows.set(city.id,{city,button,time:button.querySelector("time"),offset:button.querySelector(".zone-label")});
  }
  refreshFeature(cities,timestamp);
}
function renderTimes(timestamp) {
  for(const {city,time,offset} of zoneRows.values()) {
    const fields=inZone(timestamp,city.zone);
    timeLabel(time,fields,false);
    setText(offset,offsetString(fields.offset));
  }
  if(featuredTime) {
    const fields=inZone(timestamp,featuredTime.zone);
    timeLabel($("feature-time"),fields);
    setText($("feature-offset"),offsetString(fields.offset));
    setText($("feature-date"),displayDate(fields));
  }
  if($("inspect").open && inspection) {
    const fields=inZone(timestamp,inspection.zone);
    timeLabel($("inspect-time"),inspection.drawing.posed ? {...fields,hour:10,minute:10,second:35} : fields);
    setText($("inspect-date"),displayDate(fields));
  }
}

const randomItem = pool => pool[Math.floor(Math.random()*pool.length)];
function freeFace(excluded,key) {
  const unused=faceKeys.filter(face=>face!==key && !excluded.has(face));
  if(unused.length) return randomItem(unused);
  return randomItem(faceKeys.filter(face=>face!==key));
}
function announce(message) { setText($("announcement"),message); }
function shuffleBoard() {
  for(let start=0;start<boardState.cities.length;start+=faceKeys.length) {
    const cities=boardState.cities.slice(start,start+faceKeys.length);
    const keys=[...faceKeys];
    for(let i=keys.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [keys[i],keys[j]]=[keys[j],keys[i]];
    }
    // Exchange any stationary face with another slot that can take it.
    cities.forEach((city,i)=>{
      if(city.key!==keys[i]) return;
      const j=keys.findIndex((_,index)=>index!==i && cities[index]?.key!==keys[i]);
      if(j>=0) [keys[i],keys[j]]=[keys[j],keys[i]];
    });
    cities.forEach((city,i)=>{ city.key=keys[i]; });
  }
  saveCities();
  renderBoard();
  announce("Shuffled all city faces.");
}
$("shuffle-all").addEventListener("click",shuffleBoard);
$("shuffle-one").addEventListener("click",()=>{
  const entry=boardState.cities.find(city=>city.id===boardState.selected);
  if(!entry) return;
  entry.key=freeFace(new Set(boardState.cities.map(city=>city.key)),entry.key);
  saveCities();
  renderBoard();
  announce(`${currentCity().name} now uses ${catalog[entry.key][0]}.`);
});
$("remove-city").addEventListener("click",()=>{
  const index=sortedIds.indexOf(boardState.selected);
  if(index<0) return;
  const removed=currentCity().name;
  boardState.cities=boardState.cities.filter(city=>city.id!==boardState.selected);
  boardState.selected=sortedIds[index+1]??sortedIds[index-1];
  saveCities();
  renderBoard();
  (zoneRows.get(boardState.selected)?.button??$("add-city")).focus();
  announce(`Removed ${removed}.`);
});
$("zone-list").addEventListener("click",event=>{
  const button=event.target.closest("[data-city]");
  if(!button || button.dataset.city===boardState.selected) return;
  boardState.selected=button.dataset.city;
  saveCities();
  refreshFeature(orderedCities(Date.now()),Date.now());
  if(matchMedia("(max-width: 760px)").matches && event.detail>0) {
    $("feature-city").scrollIntoView({block:"center",behavior:reduced.matches?"instant":"smooth"});
  }
});

function showView(next) {
  if(view===next) return;
  view=next;
  const showCities=next==="board";
  $("board-view").hidden=!showCities;
  $("collection-view").hidden=showCities;
  $("show-board").toggleAttribute("aria-current",showCities);
  $("show-collection").toggleAttribute("aria-current",!showCities);
  $(showCities?"show-board":"show-collection").setAttribute("aria-current","page");
  if(!showCities) renderCollection();
}
$("show-board").addEventListener("click",()=>showView("board"));
$("show-collection").addEventListener("click",()=>showView("collection"));
function renderCollection() {
  const list=$("collection");
  const type=$("watch-category").value;
  const query=searchKey($("watch-search").value);
  const keys=faceKeys.filter(key=>{
    const [name,reference,,category]=catalog[key];
    const searchable=searchKey(`${name} ${reference} ${key}`);
    return (!type || type===category) && query.split(/\s+/).every(term=>searchable.includes(term));
  });
  const retained=new Map([...list.children].map(node=>[node.firstElementChild.dataset.key,node]));
  for(const [key,item] of retained) {
    if(keys.includes(key)) continue;
    clearDrawings(item);
    item.remove();
    retained.delete(key);
  }
  const fragment=document.createDocumentFragment();
  for(const key of keys) {
    if(retained.has(key)) {
      const item=retained.get(key);
      const svg=item.querySelector("svg[data-face]");
      const drawing=artwork.get(svg);
      drawing.zone=defaultZone();
      updateArtwork(svg,drawing,Date.now(),performance.now());
      fragment.append(item);
      continue;
    }
    const [name,reference]=catalog[key];
    const item=document.createElement("li");
    const button=document.createElement("button");
    button.type="button";
    button.className="catalog-item";
    button.dataset.key=key;
    button.innerHTML=`<span class="object-stage" aria-hidden="true"></span><span class="record-label"><span class="record-name">${esc(name)}</span>${reference?`<span class="record-reference">${esc(reference)}</span>`:""}</span></span>`;
    mountDrawing(button.firstElementChild,key,defaultZone());
    item.append(button);
    fragment.append(item);
  }
  list.append(fragment);
  $("empty-collection").hidden=!!keys.length;
  setText($("match-count"),`${keys.length} timepiece${keys.length===1?"":"s"}`);
}
$("watch-search").addEventListener("input",renderCollection);
$("watch-category").addEventListener("change",renderCollection);

const searchDialog=$("city-dialog"), cityResults=$("city-results");
let visibleCities=[];
function renderCitySearch() {
  const query=searchKey($("city-search").value);
  const existing=new Set(boardState.cities.map(entry=>entry.id));
  const searchTerms=query.split(/\s+/).filter(Boolean);
  visibleCities=[...cityById.values()].filter(city=>!existing.has(city.id) &&
    searchTerms.every(term=>searchKey(`${city.name} ${city.region} ${city.zone}`).includes(term)));
  if($("city-search").value.includes("/") && validZone($("city-search").value.trim())) {
    const zone=$("city-search").value.trim();
    if(!visibleCities.some(city=>city.zone.toLowerCase()===zone.toLowerCase()) &&
       !boardState.cities.some(entry=>cityById.get(entry.id).zone.toLowerCase()===zone.toLowerCase())) visibleCities.unshift(zoneCity(zone));
  }
  visibleCities.sort((a,b)=>{
    const relevance=city=>searchKey(city.name)===query?0:searchKey(city.name).startsWith(query)?1:2;
    return relevance(a)-relevance(b)||a.name.localeCompare(b.name,"en");
  });
  visibleCities=visibleCities.slice(0,60);
  cityResults.innerHTML=visibleCities.map((city,i)=>
    `<li><button type="button" data-result="${i}"><span>${esc(city.name)}</span><span class="city-region">${esc(city.region)} · ${esc(offsetString(inZone(Date.now(),city.zone).offset))}</span></button></li>`).join("");
  $("city-empty").hidden=!!visibleCities.length;
}
function addCity(city) {
  const excluded=new Set(boardState.cities.map(entry=>entry.key));
  const key=freeFace(excluded);
  cityById.set(city.id,city);
  boardState.cities.push({id:city.id,key});
  boardState.selected=city.id;
  saveCities();
  searchDialog.close();
  renderBoard();
  announce(`Added ${city.name}.`);
}
$("add-city").addEventListener("click",()=>{
  $("city-search").value="";
  renderCitySearch();
  searchDialog.showModal();
  $("city-search").focus();
});
$("city-search").addEventListener("input",renderCitySearch);
$("city-search").addEventListener("keydown",event=>{
  if(event.key==="Enter" && visibleCities[0]) {
    event.preventDefault();
    addCity(visibleCities[0]);
  }
  if(event.key==="ArrowDown" && visibleCities.length) {
    event.preventDefault();
    cityResults.querySelector("button").focus();
  }
});
cityResults.addEventListener("click",event=>{
  const button=event.target.closest("[data-result]");
  if(button) addCity(visibleCities[+button.dataset.result]);
});
cityResults.addEventListener("keydown",event=>{
  const button=event.target.closest("[data-result]");
  if(!button || !["ArrowUp","ArrowDown"].includes(event.key)) return;
  event.preventDefault();
  const next=+button.dataset.result+(event.key==="ArrowDown"?1:-1);
  if(next<0) $("city-search").focus();
  else cityResults.querySelector(`[data-result="${next}"]`)?.focus();
});

const inspectionDialog=$("inspect");
let inspection=null;
const closeIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M6 18 18 6"/></svg>';
document.querySelectorAll("[data-close]").forEach(button=>{
  button.innerHTML=closeIcon;
  button.addEventListener("click",()=>button.closest("dialog").close());
});
const regattaLength = document.createElement("div");
regattaLength.innerHTML='<label for="regatta-minutes">Countdown length</label><select id="regatta-minutes">'+
  many(10,i=>`<option value="${i+1}">${i+1} minute${i?"s":""}</option>`)+"</select>";
$("stopwatch").insertBefore(regattaLength,$("elapsed"));
const regattaSelect=$("regatta-minutes");
function openInspection(key,city) {
  const [name, reference]=catalog[key];
  const zone=city?.zone??defaultZone();
  setText($("inspect-name"),name);
  setText($("inspect-reference"),reference);
  $("inspect-reference").hidden=!reference;
  const selector=$("inspect-zone");
  const listed=[...boardState.cities.map(entry=>cityById.get(entry.id)),{name:"Local time",zone:localZone},{name:"UTC",zone:"UTC"}];
  const choices=new Map(listed.map(entry=>[entry.zone,entry]));
  if(city) choices.set(zone,city);
  selector.replaceChildren(...[...choices.values()].map(entry=>new Option(entry.name,entry.zone)));
  selector.value=zone;
  const drawing=mountDrawing($("inspect-art"),key,zone);
  inspection={key,zone,drawing};
  $("pose").setAttribute("aria-pressed","false");
  setText($("pose"),"Set hands to 10:10");
  $("light").hidden=!hasLight.has(key);
  $("light").setAttribute("aria-pressed","false");
  $("stopwatch").hidden=!stopwatches.has(key);
  regattaLength.hidden=key!=="yachtmaster2";
  setText($("stopwatch-label"),key==="yachtmaster2"?"Regatta countdown":"Chronograph");
  if(stopwatches.has(key)) {
    const timer=stopwatchState(key);
    regattaSelect.value=String(timer.minutes);
    updateStopwatch(performance.now());
  }
  inspectionDialog.showModal();
  renderTimes(Date.now());
}
$("feature-art").addEventListener("click",()=>openInspection($("feature-art").dataset.key,currentCity()));
$("collection").addEventListener("click",event=>{
  const button=event.target.closest("[data-key]");
  if(button) openInspection(button.dataset.key,currentCity());
});
inspectionDialog.addEventListener("close",()=>{
  if(inspectionDialog.open) return;
  clearDrawings($("inspect-art"));
  $("inspect-art").replaceChildren();
  inspection=null;
});
$("inspect-zone").addEventListener("change",event=>{
  inspection.zone=event.target.value;
  inspection.drawing.zone=inspection.zone;
  renderTimes(Date.now());
  updateArtwork($("inspect-art").firstElementChild,inspection.drawing,Date.now(),performance.now());
});
$("pose").addEventListener("click",()=>{
  const posed=!inspection.drawing.posed;
  inspection.drawing.posed=posed;
  $("pose").setAttribute("aria-pressed",String(posed));
  setText($("pose"),posed?"Return to live time":"Set hands to 10:10");
  renderTimes(Date.now());
  updateArtwork($("inspect-art").firstElementChild,inspection.drawing,Date.now(),performance.now());
});
$("light").addEventListener("click",()=>{
  const light=$("inspect-art").querySelector("[data-light]");
  if(!light) return;
  const active=$("light").getAttribute("aria-pressed")!=="true";
  light.style.visibility=active?"visible":"hidden";
  $("light").setAttribute("aria-pressed",String(active));
});

function updateStopwatch(steady) {
  const key=inspection.key;
  const timer=stopwatchState(key);
  let duration=elapsedAt(key,steady);
  if(key==="yachtmaster2") {
    const limit=timer.minutes*60000;
    if(duration>=limit && timer.started!==null) {
      timer.elapsed=limit;
      timer.started=null;
      announce("Regatta countdown finished.");
    }
    duration=Math.max(0,limit-duration);
  }
  const deciseconds=Math.floor(duration/100);
  const hours=Math.floor(deciseconds/36000);
  const minutes=padded(Math.floor(deciseconds/600)%60);
  const seconds=padded(Math.floor(deciseconds/10)%60);
  setText($("elapsed"),`${hours?`${hours}:`:""}${minutes}:${seconds}.${deciseconds%10}`);
  setText($("start-stop"),timer.started===null?"Start":"Stop");
  regattaSelect.disabled=timer.started!==null;
}
$("start-stop").addEventListener("click",()=>{
  const key=inspection.key;
  const timer=stopwatchState(key);
  const steady=performance.now();
  if(timer.started===null) {
    if(key==="yachtmaster2" && timer.elapsed>=timer.minutes*60000) timer.elapsed=0;
    timer.started=steady;
  } else {
    timer.elapsed=elapsedAt(key,steady);
    timer.started=null;
  }
  updateStopwatch(steady);
});
$("reset").addEventListener("click",()=>{
  const timer=stopwatchState(inspection.key);
  timer.elapsed=0;
  timer.started=null;
  updateStopwatch(performance.now());
});
regattaSelect.addEventListener("change",()=>{
  const timer=stopwatchState("yachtmaster2");
  timer.minutes=Number(regattaSelect.value);
  timer.elapsed=0;
  updateStopwatch(performance.now());
});

// Keep the frame loop scoped to watches currently intersecting the viewport.
let lastSecond = -1;
let lastOrderMinute = -1;
let frameRequest = 0;
function tick(steady) {
  const timestamp=Date.now();
  const second=Math.floor(timestamp/1000);
  const minute=Math.floor(second/60);
  if(minute!==lastOrderMinute) {
    lastOrderMinute=minute;
    const next=orderedCities(timestamp).map(city=>city.id);
    if(next.some((id,i)=>id!==sortedIds[i])) {
      sortedIds=next;
      // Moving the existing rows retains the face instances across a DST change.
      const focused=document.activeElement;
      for(const id of sortedIds) $("zone-list").append(zoneRows.get(id).button.parentElement);
      if(focused?.matches("[data-city]")&&focused.isConnected) focused.focus({preventScroll:true});
    }
  }
  if(lastSecond!==second) {
    lastSecond=second;
    renderTimes(timestamp);
  }
  if(inspection && inspectionDialog.open && stopwatches.has(inspection.key)) updateStopwatch(steady);
  for(const svg of visiblePieces) {
    const drawing=artwork.get(svg);
    if(drawing) updateArtwork(svg,drawing,timestamp,steady);
  }
  frameRequest=requestAnimationFrame(tick);
}
document.addEventListener("visibilitychange",()=>{
  cancelAnimationFrame(frameRequest);
  if(!document.hidden) frameRequest=requestAnimationFrame(tick);
});
renderBoard();
if(!document.hidden) frameRequest=requestAnimationFrame(tick);
</script>
